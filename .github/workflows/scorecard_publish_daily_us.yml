# .github/workflows/scorecard_publish_daily_us.yml
# =============================================================================
# 📋 "내 성적표" 공개 순위표 **발행 배치 — 달러(USD) 트랙**
#   (`.github/workflows/scorecard_publish_daily.yml`(원화)의 미러 — 결투가
#    `duel_daily.yml` / `duel_daily_us.yml` 로 나뉜 것과 같은 모양입니다. 2026-09-07 #203)
#
#   하는 일 (순서는 원화 트랙과 같습니다 — `utils/scorecard_publish.py::run_publish_batch()`):
#     ⓪ 철회한 사용자의 발행 기록을 **모든 날짜·모든 통화에서** 삭제(원화 트랙과 같은 일 — 멱등)
#     ① 발행 대상 고르기 — final_confirmed=true 이고 revoked_at 이 없는 사용자
#     ② 그 사용자들의 "내 성적표" 보유종목을 한 번에 읽어 **통화별** 포트폴리오로 집계
#     ③ 체급 배정 — **달러** 매입원가합계(전 종목) → 시즌 고정 규칙 적용
#     ④ 매입원가 대비 수익률 → (USD × 체급) 그룹별 순위
#     ⑤ 최소 인원 미달 그룹은 발행 안 함 + 과거 행도 삭제 — 🔴 **달러 그룹 9개 안에서만.**
#        원화 그룹은 이 실행이 보지도 지우지도 않습니다(원화 트랙 머리말 💱 #203 문단)
#     ⑥ 그날 **달러** 발행분 전량 삭제 후 재작성 — 그날 아침 원화 트랙이 쓴 행은 남습니다
#
#   실제 로직은 전부 파이썬에 있습니다
#   (`run_scorecard_publish_batch.py --currency USD` → `utils/scorecard_publish.py`).
#   스크립트는 원화 트랙과 **같은 파일**이고 `--currency` 만 다릅니다(결투와 달리 파일을 나누지
#   않는 이유는 그 스크립트 머리말 💱 문단). 이 워크플로우는 **언제·어떤 권한으로 그걸
#   부르는가**만 정합니다. 분리의 배경·정합성 조건·철회 청소를 양쪽에서 하는 이유는 원화 트랙
#   머리말에 한 번만 적어 두었습니다(여기 다시 적지 않습니다).
# -----------------------------------------------------------------------------
# 🕘 왜 이 시각인가 — 달러 트랙은 **미국 벤치마크 수집 뒤**여야 신선도 검사가 삽니다
# -----------------------------------------------------------------------------
#   달러 발행이 읽는 것: 미국 종목 스냅샷(`scrape_us.yml`), 미국 벤치마크
#   `data/us_index_history.json`(`scrape_report_snapshots.yml` — 🩺 신선도 검사의 지수 원천),
#   결투 USD 기준값 파일(`duel_daily_us.yml` 이 커밋). 시간표(cron 은 전부 UTC, KST = UTC+9 고정):
#        · `scrape_us.yml`               cron '35 20/21 * * 1-5' = UTC 20:35/21:35 = KST 05:35/06:35
#                                        (미국 종가 — 실측 종료 08:20~08:39 KST, 2026-09-02~05)
#        · `scrape_report_snapshots.yml` cron '20 23 * * 1-5'    = UTC 23:20 = KST 08:20 (미국 벤치마크,
#                                        실제 커밋 10:04~10:52 KST — 아래 실측)
#        · **이 파일**                   cron '35 2 * * *'       = UTC 02:35 = **KST 11:35**
#        · `duel_daily_us.yml`           cron '0 3 * * *'        = UTC 03:00 = KST 12:00 (결투 USD 기준값)
#        · `watch_schedule_health.yml`   cron '0 9 * * *'        = UTC 09:00 = KST 18:00 (워치독 — 감시
#                                        대상 전부의 예정 시각 뒤여야 하며 테스트가 고정)
#   주말에도 돌립니다 — 원화 트랙과 같은 이유(철회 청소는 하루도 거르면 안 됨). 주말엔 미국
#   스냅샷이 금요일 값이라 발행 내용은 같고, 신선도 검사는 이력 CSV 직전 행과 비교합니다(§4-b).
#
#   🕘 2026-09-07 (#203) — 11:35 는 #202 의 값을 **그대로** 옮긴 것입니다(오너: "필요 이상으로
#      늦추지 말 것 — 정상 범위 실측 최댓값에 적당한 여유"라는 #202 의 계산 방식은 유지).
#      · 실측(#202 조사, Actions API `workflows/{file}/runs` + `us_index_history.json` 의
#        `metadata.collected_at_kst`; 2026-09-07 재조회 시 새 실행 없음 — 09-05 토 10:04 가 최신):
#          미국 벤치마크 실제 커밋  08-19~08-26 08:41~08:44 / 08-27~29 13:33·15:58·13:11 / 09-01~05
#                                  10:52·10:05·10:11·10:04·10:04 KST
#          미국 종목 수집 실제 종료  09-01 09:54 / 09-02~05 08:36·08:39·08:38·08:20 KST
#        즉 GitHub 스케줄러 지연(`watch_schedule_health.yml` 머리말·`cloudflare_worker.js`, 2026-08-27
#        이후 매일 1.5~5시간)이 걸린 **정상 범위**의 최댓값이 10:52 이고, 08-27~29 의 13~16시대는
#        장애 기간의 이상치입니다. 이상치까지 기준으로 삼아 더 늦추지 않습니다 — 그런 날은 어차피
#        검사가 "지수 원천이 낡음 → 미국 검사 생략"으로 스스로 걸러 주고(틀린 판정이 아님), 후행
#        지표라도 며칠씩 밀리는 시각을 만드는 쪽이 더 나쁩니다(오너 지시).
#      · 11:35 = ① 벤치마크 cron(08:20)보다 3시간 15분 뒤, ② 정상 범위 실측 최댓값 10:52 보다 43분 뒤
#        (이 저장소의 "앞 단계 뒤 30분 이상" 관례 충족 — `duel_daily.yml` 머리말: 10분→30분 전례),
#        ③ 결투 USD 배치(12:00)보다 앞이라 §4-b 가 전제한 "미국 결투 기준선 = 어제(D-1) 값"이 명목
#        시간표에서 성립하고(늦어져 12:00 을 넘겨도 이력 CSV 대체 경로가 받음), ④ 워치독(18:00)보다
#        앞, ⑤ 정각·정30분 회피 값. 원화 트랙(07:35)보다 4시간 뒤이지만 서로 의존하지 않습니다.
#      · 더 이르게 잡지 않는 이유: 10:52 + 30분 = 11:22 가 하한이고, 그보다 13분 뒤인 11:35 는
#        #202 에서 이미 이 계산으로 확정된 값이라 굳이 흔들지 않습니다. 더 늦게 잡지 않는 이유는 위.
#
#   🩺 신선도 검사 — 이 트랙은 **미국주식만** 검사합니다(코스피는 원화 트랙). 실행 요약의
#      "🩺 … US: 검사함 → ok — 기준선 <D-1> (duel_probe)" 줄로 확인하세요.
#      ✅ (#203) #202 조사에서 발견된 "매주 월·화는 `no_baseline` 생략" 빈틈도 함께 닫았습니다 —
#         결투 USD 배치가 토·일(또는 미국 휴장일) 대상으로 남기는 기준값 파일엔 지수가 없는데,
#         이제 그런 기준선은 쓰지 않고 이력 CSV 직전 행으로 대체합니다(`utils/scorecard_publish.py`
#         `load_freshness_inputs()`). 월·화 요약엔 "결투 기준선(…)에 비교할 지수가 없어 … 수집
#         이력의 직전 날짜 행" 안내가 찍히고 판정은 실제로 이뤄집니다.
#      ⚠️ 08-27~29 처럼 벤치마크가 13시 넘어 들어온 날은 미국 검사가 "지수 원천이 낡음"으로 생략될
#         수 있습니다 — 종전과 같고 틀린 판정이 아닙니다. 근본 해결(`workflow_run` 으로 벤치마크
#         완료에 묶기)은 주말 실행이 필요해 cron 을 없앨 수 없으므로 별도 결정 사항으로 남깁니다.
#         → ✅ (#204) 아래 문단 — cron 을 없애지 않고(주말 철회 청소용 안전망으로 유지) workflow_run 을
#           **추가**하는 방식으로 닫았습니다. 벤치마크가 늦게 들어온 날도 그 완료 직후 발행됩니다.
# -----------------------------------------------------------------------------
# 🔴 2026-09-07 (#204) — `workflow_run` 을 주 트리거로 추가, 위 cron 은 **순수 안전망**으로 강등
# -----------------------------------------------------------------------------
#   오너 방향 지시: "전부 다 크롤링 끝나고 연결해서 작업이 발생하게 … 시간을 뒤로 영원히 미뤄도
#   OK 라는 건 절대 아니다 … 크롤링 후 현재가가 적용이 최대한 빨리 되는 방향으로." 위 🕘 문단의 11:35
#   는 "정상 범위 실측 최댓값 + 30분"이라는 타이밍 추정이었고, 실측으로는 GitHub 스케줄러 지연까지
#   겹쳐 13시 전후에 돌게 됩니다(원화 트랙 07:35 가 09:07~10:21 에 돈 것과 같은 지연 폭).
#
#   트리거 원천 — 결투 USD(`duel_daily_us.yml`)와 **같은 기준**으로 정했습니다(그쪽 머리말 #204 문단에
#   실측 표): 이 트랙의 입력은 미국 종목 스냅샷(`scrape_us.yml`, "Daily US Stocks Scraper")과 미국
#   벤치마크(`scrape_report_snapshots.yml`, "Daily Report Snapshots") **둘**이고, 실측(09-01~05)으로는
#   벤치마크가 항상 1.5~2시간 늦게 끝났지만 #204 에서 벤치마크 워크플로우 자체를 scrape_us 완료의
#   workflow_run 으로 바꿨으므로 앞으로의 정상 순서는 "종목 → 1~2분 뒤 벤치마크"이고, 실패·안전망
#   cron 이 먼저 돈 날엔 뒤집힐 수 있습니다. 그래서 **두 워크플로우 완료를 모두** 걸고, 어느 쪽으로
#   깨어나든 게이트(`crawl_ready_gate.py scorecard-us`)가 데이터로 "처리 거래일(어제, 한국 날짜)의
#   종목 스냅샷(SUCCESS)과 벤치마크 두 지수 종가가 모두 있음"을 확인한 뒤에만 발행합니다 — 먼저 끝난
#   쪽의 이벤트는 조용히 건너뛰고 나중에 끝난 쪽이 실제로 발행합니다. 벤치마크 없이 발행하면 🩺 검사가
#   "지수 원천 낡음 → 생략"으로 빠지므로(#201 의 상태로 후퇴) 기다리는 것이 맞습니다.
#   결투 USD 기준값 파일은 기다리지 않습니다 — §4-b 가 "같은 날/지수 없음이면 이력 CSV 대체"로 어느
#   순서든 판정하기 때문입니다.
#
#   🔁 멱등성 — "그날 발행분(달러) 통째로 삭제 후 재작성"(⑥)이라 workflow_run 과 cron 이 같은 날 둘 다
#      돌아도 같은 값을 한 번 더 쓸 뿐입니다(원화 트랙 머리말 🔁 과 같음). 그래서 cron 쪽엔 게이트를
#      걸지 않습니다. 발행일은 둘 다 실행일(같은 한국 날짜)이라 원화처럼 하루 앞당겨지지도 않습니다.
#   🕰️ cron(11:35) 은 그대로 두되 의미가 바뀝니다 — **workflow_run 이 그날 안 왔을 때(두 크롤링 중
#      하나라도 실패·누락·미국 휴장) + 주말 철회 청소** 를 위한 안전망. 시각은 옮기지 않았습니다
#      (오너: 고정 시각을 뒤로 미루는 방향 금지). `workflow_dispatch` 는 게이트 없이 항상 실행.
#   기대 효과(실측 기반): 벤치마크 커밋 직후 1~2분(현재 10:04~10:52, #204 뒤엔 종목 종료 직후 08:2x~08:4x)
#   — 종전 11:35+지연 대비 2~4시간 빠름. 실제 발동은 다음 평일 실행에서 확인 필요(§0-1).
# -----------------------------------------------------------------------------
# 🔴 이 배치가 만드는 표는 **로그인한 모든 사용자가 읽습니다** (§0-3-8) — 원화 트랙과 동일
# =============================================================================

name: Scorecard Publish Daily (USD)

on:
  schedule:
    # 매일 02:35 UTC = KST 11:35 (미국 종목·벤치마크 수집이 실측으로 모두 끝난 뒤 — 위 머리말
    # 🕘 #203 문단. #202 가 정한 값 그대로, 달러 트랙만 이 시각으로 옮겨 옴).
    # 🔴 (#204) 이 값은 더 이상 타이밍 추정이 아니라 **순수 안전망**입니다 — 평일엔 아래
    #    workflow_run 이 먼저 발행하고, 이 cron 은 그 이벤트가 안 온 날과 주말(철회 청소)을 받칩니다.
    - cron: "35 2 * * *"
  # (#204) 미국 종목 수집·미국 벤치마크 수집이 끝나면 곧바로. 둘 다 걸어 두고 게이트가 "둘 다
  # 들어왔음"을 확인한 쪽만 발행합니다(위 머리말 #204 문단).
  workflow_run:
    workflows: ["Daily US Stocks Scraper", "Daily Report Snapshots"]
    types: [completed]
  # 수동 실행. 처음 며칠은 dry-run 으로 "무엇이 발행될 뻔했는지"부터 확인하는 것을 권합니다.
  workflow_dispatch:
    inputs:
      published_date:
        description: "발행일 (YYYY-MM-DD, KST). 비우면 오늘"
        required: false
        default: ""
      dry_run:
        description: "저장하지 않고 계산만 (발행표를 건드리지 않음)"
        required: false
        default: false
        type: boolean

# 이 배치는 저장소에 **아무것도 커밋하지 않습니다**(결과는 전부 Supabase 로 갑니다).
# 그래서 쓰기 권한을 주지 않습니다 — 최소 권한(§0-3-9).
permissions:
  contents: read

# 같은 통화끼리만 겹치지 않게(원화 트랙은 `scorecard-publish-batch` — 다른 그룹). 두 트랙은
# 서로 다른 통화의 행만 만지므로 겹쳐 돌아도 안전합니다(원화 트랙 머리말 💱 #203 문단).
concurrency:
  group: scorecard-publish-batch-usd
  cancel-in-progress: false

jobs:
  scorecard-publish-usd:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # (#204) workflow_run 으로 깨어났을 때만 거릅니다 — 앞 워크플로우가 성공으로 끝났고 그 실행이
    # 자기 cron 또는 workflow_dispatch 였을 때. "처리 거래일 값이 둘 다 있는가"는 아래 게이트가
    # 데이터로 봅니다. cron·workflow_dispatch 로 직접 불렸을 땐 항상 참(예전과 동일).
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.event == 'schedule' || github.event.workflow_run.event == 'workflow_dispatch'))

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        # 커밋해 되돌릴 것이 없으므로 전체 이력을 받지 않습니다(기본 얕은 클론).
        # `data/` 의 미국 가격 스냅샷·벤치마크·결투 USD 기준값 파일은 체크아웃으로 함께 받습니다.
        # (#204) workflow_run 이면 main 의 그 시점 최신 커밋 = 앞 워크플로우가 방금 push 한 커밋.

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚦 크롤링 완료 게이트 (#204 — workflow_run 으로 깨어났을 때만)
        id: gate
        if: github.event_name == 'workflow_run'
        # 처리 거래일(어제, 한국 날짜)의 미국 종목 스냅샷(SUCCESS) + 벤치마크 두 지수 종가가 모두
        # 있을 때만 아래가 돕니다. cron·수동은 게이트 없이 항상 진행(멱등 — 머리말 🔁).
        run: |
          python crawl_ready_gate.py scorecard-us --role event

      - name: 성적표 발행 배치 실행 (USD)
        if: github.event_name != 'workflow_run' || steps.gate.outputs.ready == 'true'
        env:
          # 🔴 배치 전용 키. 원화 트랙·결투 배치와 **같은 Supabase 프로젝트, 같은 service_role 키**
          #    (두 번째 키를 만들지 않습니다). 사용자가 접속하는 앱 서버(Render)에는 절대 넣지
          #    않습니다(§0-3-8).
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          # 🔴 --currency USD 가 이 트랙의 전부입니다 — 빠지면 두 통화를 한 번에 발행합니다(#203).
          ARGS="--currency USD"
          if [ -n "${{ github.event.inputs.published_date }}" ]; then
            ARGS="$ARGS --published-date ${{ github.event.inputs.published_date }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          echo "실행: python run_scorecard_publish_batch.py $ARGS"
          python run_scorecard_publish_batch.py $ARGS

      - name: 실패했을 때 확인할 것
        if: failure()
        run: |
          echo "❌ 발행 배치(USD)가 실패했습니다. 순위표는 **이전 발행분이 그대로 남아 있습니다**"
          echo "   (화면은 각 그룹의 가장 최근 발행일을 읽습니다). 확인 순서:"
          echo "   1) 위 로그의 마지막 '❌ 성적표 발행 배치 실패:' 줄 — 원인이 한국어로 적혀 있습니다."
          echo "   2) Secrets 에 SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY 가 있는지."
          echo "   3) sql/scorecard_public_schema.sql 이 Supabase 에서 실행됐는지 —"
          echo "      표가 없으면 '... does not exist' 계열 오류가 납니다."
          echo "   4) 삭제 후 삽입 도중에 끊긴 경우, 그날 달러 발행분이 일부만 남아 있을 수 있습니다."
          echo "      → workflow_dispatch 로 같은 published_date 를 다시 실행하면 그날 달러분을"
          echo "        통째로 지우고 다시 씁니다(전량 재작성이 그 복구 경로입니다). 원화 행은 건드리지 않습니다."
          exit 1

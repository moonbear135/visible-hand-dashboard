name: 보조지표 모듈(여기서부터는 신앙입니다) 일간 수집

# ⚠️ 기존 scrape.yml에 얹지 않고 독립 워크플로우로 둡니다 — 0단계 실측 결과 이 모듈만으로
# 약 13분이 걸려, 기존 배치(20~30분)에 합치면 35~45분까지 늘어나 git push 충돌 창이
# 넓어지기 때문입니다(TECHNICAL_INDICATOR_WORK_ORDER.md §7 참고).
# scrape.yml(16:05 KST)이 끝난 뒤 데이터가 준비되도록 17:00 KST(=08:00 UTC)로 잡았습니다.
on:
  schedule:
    - cron: '0 8 * * 1-5'   # 매일 평일 17:00 KST (UTC 08:00)
  workflow_dispatch:
    inputs:
      limit:
        description: '대상 종목 수'
        required: false
        default: '500'
      days:
        description: '요청할 과거 기간(일)'
        required: false
        default: '400'
      delay:
        description: '종목별 요청 사이 딜레이(초)'
        required: false
        default: '0.5'
      # 2026-09-04: scrape.yml / scrape_us.yml 의 같은 이름 입력과 동일한 관례. 기본값 false 라
      # cloudflare_worker.js / watch_schedule_health.yml 처럼 입력 없이 dispatch 하는 호출은
      # 전부 사전 점검이 켜진 채로 돕니다.
      force:
        description: '사전 점검을 무시하고 무조건 수집합니다 (오늘 이미 SUCCESS 로 수집된 날을 다시 수집하고 싶을 때만 true)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write   # data/ 아래 유니버스·이력 파일을 커밋하기 위해 필요

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 코드 체크아웃
        uses: actions/checkout@v3

      - name: 원격 main 최신 커밋으로 동기화 (앞선 실행이 방금 푸시한 스냅샷 반영)
        # scrape_us.yml e5d9900(2026-09-03)과 같은 이유 — checkout 은 트리거 시점의
        # github.sha 에 고정되어, 앞선 실행이 그새 푸시한 당일 스냅샷을 못 볼 수 있습니다.
        # --skip-if-not-ready 사전 점검이 최신 스냅샷을 보게 하려면 여기서 origin/main
        # 으로 맞춰야 합니다. 이 워크플로우엔 scrape_us.yml 같은 concurrency 대기가 없어
        # 완전한 보장은 아니지만(진짜 겹치면 여전히 못 볼 수 있음), 순차 실행 시나리오는
        # 이 한 스텝으로 막힙니다 — 손해는 없고 이득만 있어 우선 추가합니다.
        run: |
          echo "트리거 시점 커밋(github.sha): ${{ github.sha }}"
          git fetch --depth=1 origin main
          git reset --hard origin/main
          echo "동기화 후 HEAD             : $(git rev-parse HEAD)"

      - name: 파이썬 환경 설정
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 필수 의존 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 보조지표 수집 실행
        env:
          LIMIT: ${{ inputs.limit || '500' }}
          DAYS: ${{ inputs.days || '400' }}
          DELAY: ${{ inputs.delay || '0.5' }}
        # 2026-09-04: 평소(cron · Cloudflare Worker 의 workflow_dispatch)에는 --skip-if-not-ready 로
        # 사전 점검을 켭니다. 오늘(KST) 자 스냅샷이 이미 status=SUCCESS(실패 0건)면 아무것도 하지
        # 않고 정상 종료(exit 0)하므로, GitHub 자체 cron 이 몇 시간 늦게 발동해 Worker 와 같은 날
        # 둘 다 돌아도 실제 수집은 하루 한 번만 일어납니다(2026-09-02·09-03 실측: 매일 두 번 커밋됨).
        # 실패가 있던 날(DEGRADED)은 성공으로 치지 않고 다시 수집합니다.
        # 수동 실행에서 force=true 를 고르면 점검 없이 무조건 다시 수집합니다(scrape_us.yml 과 동일).
        # ⚠️ 위 schedule: cron 은 안전망으로 그대로 둡니다 — Worker 쪽 장애 시 이게 유일한 트리거.
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "⚠️ force=true — 사전 점검을 건너뛰고 무조건 수집합니다"
            python collector_indicator_kr.py --limit "$LIMIT" --days "$DAYS" --delay "$DELAY"
          else
            python collector_indicator_kr.py --limit "$LIMIT" --days "$DAYS" --delay "$DELAY" --skip-if-not-ready
          fi

      - name: 갱신된 데이터를 깃허브에 영구 커밋 및 업로드
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/indicator_universe_kr.json data/indicator_kr_latest.json data/indicator_kr_history.csv
          # 산티체크 상태 파일(2026-08-30 신설, utils/data_sanity.py). 이 파일에는 오늘 판정
          # 결과와 '내일의 기준값'이 함께 들어 있어, 커밋되지 않으면 매일 기준값이 없어
          # 영영 '판정 불가'가 됩니다. scrape.yml(`git add data/`)·scrape_us.yml
          # (`git add -A data/`)은 이미 data/ 전체를 커밋해 이 처리가 필요 없습니다.
          # 파일이 아직 없을 수 있어(첫 실행 전 · 수집기 조기 종료) 존재할 때만 add 합니다
          # — 없는 경로를 add 하면 이 커밋 스텝 자체가 실패합니다.
          if [ -f data/indicator_kr_sanity.json ]; then
            git add data/indicator_kr_sanity.json
          fi
          git commit -m "Auto Update(보조지표): $(date +'%Y-%m-%d') [무인 자동화 로봇]" || exit 0

          # scrape.yml과 같은 재시도 패턴 — 다른 워크플로우가 먼저 push했으면 받아와서 재시도
          for i in 1 2 3; do
            if git push origin main; then
              echo "✅ 푸시 성공"
              exit 0
            fi
            echo "⚠️ 푸시 거부됨 (원격이 앞서있음) — 최신 내용 받아와서 재시도 ($i/3)"
            git fetch origin main
            if ! git rebase origin/main; then
              echo "❌ 리베이스 충돌 발생 — 자동 병합 불가, 수동 확인 필요"
              git rebase --abort
              exit 1
            fi
          done
          echo "❌ 3회 재시도 후에도 푸시 실패"
          exit 1
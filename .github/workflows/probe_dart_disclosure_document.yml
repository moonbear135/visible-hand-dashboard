# .github/workflows/probe_dart_disclosure_document.yml
# =============================================================================
# 🔍 DART 수시공시("현금·현물배당결정") 원본 문서 실측 확인용 — 한 번 쓰고 지울 임시 워크플로우
#
#   왜 있는가:
#     probe_dart_disclosure_document.py 를 실행하려면 DART_API_KEY 와 실제 네트워크
#     접근이 필요한데, 개발 세션(클로드 작업 환경)은 프록시 allowlist 때문에
#     opendart.fss.or.kr 에 직접 못 붙습니다. GitHub Actions 러너는 그 제약이
#     없고 저장소 Secrets 도 이미 등록돼 있어(collect_dividend_kr.yml 과 동일
#     키), 여기서 대신 호출해 결과를 로그로 남깁니다.
#
#   무엇을 하지 않는가:
#     data/ 의 어떤 파일도 읽거나 쓰지 않습니다. 결과를 저장소에 커밋하지도
#     않습니다 — 이 실행의 로그(Actions 탭 → 이 워크플로우 실행 → 로그)를 사람이
#     직접 읽고 복사하는 용도입니다.
#
#   확인 끝나면:
#     이 파일과 probe_dart_disclosure_document.py 는 더 이상 필요 없으니 지워도
#     됩니다 — "확인 끝난 조사용 스크립트를 남겨두지 않는다"가 이 프로젝트의
#     기존 관례입니다.
# =============================================================================

name: (임시) DART 수시공시 원본문서 확인

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 원본 문서 실측 확인
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python probe_dart_disclosure_document.py

# .github/workflows/collect_dividend_kr.yml
# =============================================================================
# 💰 배당금 모듈 — 개별종목(코스피/코스닥/코넥스) 2026년 배당 수집기
#
#   하는 일:
#     DART OpenAPI `alotMatter.json`("배당에 관한 사항")을 종목별로 호출해
#     2026 사업연도의 가장 최근 확정 누적치(3분기→반기→1분기 순, 오너 지시 §Q3)를
#     받아와 data/dividend_kr_2026_latest.json(가공본) + data/dividend_kr_2026_raw.jsonl
#     (원본, §0-3-3)로 저장합니다.
#
#   왜 스케줄이 지금은 workflow_dispatch(수동)뿐인가:
#     DART 정기보고서는 1년에 4번(3/8/11월 중순, 3월 말)만 갱신되고, 그 사이엔 매일
#     물어봐도 같은 값만 돌아옵니다 — 매일 자동 실행하면 §0-3-2("외부 서버에 무리 주지
#     않기")를 정면으로 어깁니다. 그래서 지금은 최초 전체 수집(catch-up)용으로 수동
#     트리거만 두고, 각 분기보고서 마감일 전후 2주 구간에만 자동 스케줄을 켜는 건
#     다음 단계 과제로 남겨둡니다.
#     ↳ 그 "마감일"은 12월 결산법인 기준 법정 제출기한입니다(자본시장법: 분기·반기는
#       기간 종료 후 45일, 사업보고서는 90일 — collector_dividend_kr.py 의
#       `_REPRT_PERIOD_END` 와 같은 근거):
#         · 1분기보고서 = 3/31 + 45일 → 5월 15일경
#         · 반기보고서   = 6/30 + 45일 → 8월 14일경
#         · 3분기보고서 = 9/30 + 45일 → 11월 14일경
#         · 사업보고서   = 12/31 + 90일 → 이듬해 3월 31일경
#       즉 자동화한다면 이 네 시점 전후 2주에만 켜면 되고, 나머지 기간에 매일 돌리는 것은
#       같은 값을 다시 받아오는 낭비입니다(§0-3-2).
#       ⚠️ 3월·6월 결산법인은 기준일이 달라 이 날짜가 맞지 않습니다 — 자동 스케줄을
#         켜더라도 "이 날짜 밖에는 조회하지 않는다"는 식으로 좁히면 안 됩니다.
#
#   왜 한 번에 안 끝날 수 있는가:
#     대상 종목이 약 2,700여개라 정중한 딜레이(종목당 2~3초, §0-3-2)를 다 더하면
#     최악의 경우 5~6시간대가 걸립니다. GitHub Actions 단일 job 한도(6시간)를 넘지
#     않도록 스크립트 자체가 --max-runtime-sec(기본 5시간)에서 스스로 멈추고
#     체크포인트를 저장합니다. 못 끝냈으면 이 워크플로우를 한 번 더 수동 실행하면
#     체크포인트부터 이어받습니다(완주하면 체크포인트 파일은 자동 삭제됩니다).
#
#   비밀키:
#     DART_API_KEY 를 저장소 Settings → Secrets and variables → Actions 에
#     등록해야 합니다. 코드 어디에도 하드코딩돼 있지 않습니다.
# =============================================================================

name: Dividend KR Collector

on:
  workflow_dispatch:
    inputs:
      owner_order:
        description: "3분기→반기→1분기 순으로만 조회(오너 지시 순서, 사업보고서 프로브 생략)"
        required: false
        default: true
        type: boolean
      max_runtime_minutes:
        description: "이번 실행에서 최대 몇 분까지 돌릴지(자동으로 체크포인트 저장 후 종료)"
        required: false
        default: "300"
      limit:
        description: "테스트용 — 앞에서 N개 종목만 처리(비우면 전체)"
        required: false
        default: ""

# 산출물(data/dividend_kr_2026_*.json, data/cache/*)을 저장소에 커밋해야 하므로 쓰기 권한.
permissions:
  contents: write

# 같은 수집이 겹쳐 돌면 체크포인트를 서로 덮어쓸 수 있어 동시 실행을 막습니다.
concurrency:
  group: dividend-kr-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # ⚠️ GitHub Actions 단일 job 절대 한도는 6시간입니다. 스크립트 내부
    # --max-runtime-sec 가 기본 5시간에서 스스로 멈추므로, job timeout 은 그보다
    # 여유를 둔 5시간 40분으로 잡아 "내부 budget 초과로 정상 종료"와
    # "GitHub 강제 종료"를 구분할 수 있게 합니다.
    timeout-minutes: 340

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 배당 수집기 실행
        env:
          # 🔴 이 저장소 Settings → Secrets and variables → Actions 에 등록 필요.
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          # 🔒 §0-3-9 (알려진 공격기법 방어) — 워크플로우 입력값은 **반드시 env 로 받습니다.**
          #    `${{ github.event.inputs.* }}` 를 run 스크립트 본문에 직접 적으면, GitHub 이
          #    셸을 실행하기 **전에** 그 자리에 입력 문자열을 그대로 끼워 넣습니다. 즉 입력에
          #    적힌 글자가 명령문 자체가 됩니다(GitHub Actions script injection — 공식
          #    보안 가이드가 첫 번째로 경고하는 항목이고 자동 스캐너에도 그대로 잡힙니다).
          #    env 로 받으면 값은 '환경변수의 내용'일 뿐 명령문이 되지 않습니다.
          OWNER_ORDER: ${{ github.event.inputs.owner_order }}
          MAX_RUNTIME_MINUTES: ${{ github.event.inputs.max_runtime_minutes }}
          LIMIT: ${{ github.event.inputs.limit }}
        run: |
          ARGS="--universe data/dividend_history_kr_2023_2025.json --year 2026 --out-dir data  --cache-dir data/cache --allow-overwrite"
          if [ "${OWNER_ORDER:-}" != "false" ]; then
            ARGS="$ARGS --owner-order"
          fi

          MAX_MIN="${MAX_RUNTIME_MINUTES:-}"
          if [ -z "$MAX_MIN" ]; then MAX_MIN=300; fi
          # 숫자인지 직접 확인합니다. $((...)) 안의 산술 평가도 문자열을 그대로 먹으면
          # 위험하므로, 숫자가 아니면 조용히 넘어가지 않고 여기서 실패시킵니다(§0-1).
          case "$MAX_MIN" in
            *[!0-9]*|"")
              echo "❌ max_runtime_minutes 에는 숫자만 넣어야 합니다(받은 값: '$MAX_MIN')."
              exit 1
              ;;
          esac
          ARGS="$ARGS --max-runtime-sec $((MAX_MIN * 60))"

          if [ -n "${LIMIT:-}" ]; then
            case "$LIMIT" in
              *[!0-9]*)
                echo "❌ limit 에는 숫자만 넣어야 합니다(받은 값: '$LIMIT')."
                exit 1
                ;;
            esac
            ARGS="$ARGS --limit $LIMIT"
          fi

          echo "실행: python collector_dividend_kr.py $ARGS"
          # $ARGS 를 일부러 인용하지 않습니다(인자 여러 개로 쪼개져야 하므로). 위에서 모든
          # 외부 입력이 '숫자뿐'임을 확인했고 나머지는 이 파일에 적힌 고정 문자열입니다.
          python collector_dividend_kr.py $ARGS

      - name: 산출물 커밋
        # ⚠️ `if:` 를 생략하면 기본값이 `success()` 라, 앞 스텝이 실패하거나 job 이
        #    timeout-minutes 로 강제 종료되는 순간 이 스텝이 **통째로 건너뛰어집니다.**
        #    그러면 러너 디스크에 이미 저장돼 있던 체크포인트(25종목마다 저장됨)가
        #    러너와 함께 사라지고, 다음 실행은 처음부터 다시 5,000건 넘게 요청해야 합니다
        #    — 정확히 §0-3-2(외부 서버에 무리 주지 않기)가 막으려는 상황입니다.
        #    그래서 `always()` 로 "어떻게 끝났든 지금까지 모은 것은 반드시 저장"합니다.
        #    ⚠️ 이건 실패를 감추는 장치가 아닙니다 — 수집 스텝이 실패했다면 job 은
        #    그대로 빨간불로 남고, 여기서는 중간 산출물만 건져 올립니다(§0-1).
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for f in \
            data/dividend_kr_2026_latest.json \
            data/dividend_kr_2026_raw.jsonl \
            data/cache/dart_corpcode_cache.json \
            data/cache/dart_corpcode_raw.zip \
            data/cache/dividend_kr_2026_checkpoint.json \
          ; do
            if [ -f "$f" ]; then
              git add "$f"
            fi
          done

          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋하지 않습니다."
            exit 0
          fi

          git commit -m "chore(dividend): 2026 개별종목 배당 수집 갱신 [skip ci]"

          # 다른 워크플로우(코스피 수집 등)도 같은 data/ 폴더를 커밋하므로
          # push 가 거절될 수 있습니다. 기존 워크플로우들과 같은 재시도 패턴.
          for attempt in 1 2 3; do
            if git push; then
              echo "push 성공 (시도 $attempt)"
              exit 0
            fi
            echo "push 거절 — fetch 후 rebase 재시도 ($attempt/3)"
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}" || exit 1
          done
          echo "❌ 3회 시도 후에도 push 하지 못했습니다."
          exit 1

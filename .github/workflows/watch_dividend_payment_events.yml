# .github/workflows/watch_dividend_payment_events.yml
# =============================================================================
# 📅 배당금 모듈 — 배당 **지급일정**(현금ㆍ현물배당결정 공시) 수집
#
#   하는 일:
#     DART `list.json` 의 **거래소공시(pblntf_ty="I")** 중 "현금ㆍ현물배당결정" /
#     "부동산투자회사금전배당결정" 공시를 어제치까지 훑고, 각 건의 **원문 문서**
#     (`document.xml`)를 받아 **배당기준일·배당금지급 예정일자**를 뽑아
#     data/dividend_kr_2026_payment_events.json 에 **append-only** 로 쌓습니다.
#
#   ⚠️ 기존 두 배당 워크플로우와 **데이터가 섞이지 않습니다.**
#     · collect_dividend_kr.yml / watch_dividend_disclosures.yml
#         → `alotMatter.json`(정기보고서 안의 배당 확정치) → dividend_kr_2026_latest.json
#           이 데이터에는 **배당기준일·지급일이 아예 없습니다.**
#     · 이 워크플로우
#         → 수시공시 원문 → dividend_kr_2026_payment_events.json (완전히 다른 파일)
#     같은 `data/` 폴더에 커밋하지만 **파일 이름이 하나도 겹치지 않습니다**(오너 지시:
#     "유지보수, 데이터가 섞이지 않게"). 아래 커밋 스텝도 이 모듈의 파일 3개만 add 합니다.
#
#   왜 매일 돌려도 §0-3-2("외부 서버에 무리 주지 않기")에 어긋나지 않는가:
#     · 평소에는 list.json 조회 몇 페이지가 전부입니다(배당결정이 0건이면 원문 조회는
#       **한 건도** 하지 않고 끝납니다).
#     · **이미 받아 둔 rcept_no 는 원문을 다시 받지 않습니다.** 같은 공시를 매일 다시
#       긁는 일이 구조적으로 불가능합니다(rcept_no 가 이벤트의 유일 식별자).
#     · 어디까지 확인했는지는 data/cache/dividend_kr_2026_payment_state.json 에 남습니다.
#     · 휴장일·주말에는 list.json 이 0건(status 013)을 돌려주고 조용히 끝납니다.
#
#   ⚠️ GitHub 공식 제약 — 저장소에 60일 넘게 아무 커밋도 없으면 GitHub 이 예정된 schedule 을
#     자동으로 비활성화합니다. 자동 실행이 오래 안 됐다 싶으면 Actions 탭에서 이 워크플로우가
#     "Active" 인지 확인하세요(수동 실행 한 번이면 다시 켜집니다).
#
#   비밀키:
#     DART_API_KEY 를 저장소 Settings → Secrets and variables → Actions 에 등록해야 합니다
#     (기존 배당 워크플로우들과 같은 시크릿). 코드 어디에도 하드코딩돼 있지 않습니다.
# =============================================================================

name: Dividend KR Payment Events Watch

on:
  workflow_dispatch: {}

  # 매일 1번, KST 05:30 (cron 은 항상 UTC → 20:30 UTC = 다음 날 05:30 KST).
  # ⚠️ watch_dividend_disclosures.yml 이 KST 05:00(20:00 UTC)에 돕니다. 아래 concurrency 로
  #    줄은 세워지지만, **같은 시각에 몰리면** 앞 작업이 끝날 때까지 대기하다가 push 경합
  #    (fetch → rebase → 재시도)이 잦아집니다. 그래서 30분 띄웠습니다.
  schedule:
    - cron: '30 20 * * *'

# 산출물(data/dividend_kr_2026_payment_events*, data/cache/*)을 커밋해야 하므로 쓰기 권한.
permissions:
  contents: write

# 🔴 collect_dividend_kr.yml · watch_dividend_disclosures.yml 과 **완전히 같은 그룹 이름**
#    입니다(글자 하나까지 — 그 두 파일에서 그대로 가져왔습니다). 세 워크플로우가 모두
#    `data/` 에 커밋하므로, 같은 그룹으로 묶어야 GitHub 이 줄을 세워 주고 동시 실행으로
#    인한 git push 충돌이 줄어듭니다. 이름이 다르면 세 작업이 동시에 같은 폴더를 커밋합니다.
concurrency:
  group: dividend-kr-collector
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    # 평소엔 몇 분이면 끝납니다. 배당결정이 몰리는 날(수십~수백 건)에도 건당 2~3초 딜레이를
    # 감안해 넉넉히 잡되, 전수 수집(340분)처럼 길게 둘 이유는 없습니다.
    timeout-minutes: 120

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        # 기존 두 배당 워크플로우와 같은 방식(requirements.txt)입니다. 다만 이 수집기가
        # 실제로 필요로 하는 외부 패키지는 `requests` 하나뿐이고(나머지는 표준 라이브러리 —
        # 원문 HTML 파싱도 `html.parser` 로 합니다), requirements.txt 가 없는 체크아웃에서
        # 조용히 실패하지 않도록 그 경우를 명시적으로 처리합니다(§0-1).
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "⚠️ requirements.txt 가 없습니다 — 이 수집기가 쓰는 requests 만 설치합니다."
            pip install requests
          fi

      - name: 배당 지급일정 수집 실행
        env:
          # 🔴 이 저장소 Settings → Secrets and variables → Actions 에 등록 필요.
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          # 이 워크플로우는 외부 입력(workflow_dispatch inputs)을 받지 않습니다 — 인자가
          # 전부 이 파일에 적힌 고정 문자열이라 script injection 여지가 없습니다(§0-3-9).
          # 나중에 입력을 추가한다면 collect_dividend_kr.yml 처럼 반드시 env 로 받아 쓰세요.
          # ⚠️ `--universe` 는 일부러 주지 않습니다(옵션 자체가 없습니다) — 정기보고서 기반
          #    유니버스에 아직 없는 신규 배당 회사도 이 경로로는 잡히는 것이 설계 의도입니다.
          python collector_dividend_payment_kr.py \
            --year 2026 \
            --out-dir data \
            --cache-dir data/cache

      - name: 산출물 커밋
        # ⚠️ 여기에는 `if: always()` 를 **일부러 넣지 않습니다**(watch_dividend_disclosures.yml
        #    과 같은 이유). 이 모드는 실패하면 상태 파일을 '확인 끝'으로 갱신하지 않습니다 —
        #    실패한 실행의 어중간한 산출물을 커밋하면 그 안전장치가 무너집니다.
        #    ↳ 그래서 원문 조회가 한 건이라도 실패하면(스크립트 종료코드 2) 이 스텝은
        #      건너뛰어지고 **아무것도 커밋되지 않습니다.** 그 실행에서 성공한 건들도
        #      커밋되지 않으므로, 다음 실행이 같은 구간을 처음부터 다시 확인합니다
        #      (이미 저장소에 커밋돼 있는 rcept_no 는 그때도 다시 받지 않습니다).
        #      실패가 반복되면 Actions 로그에 어떤 rcept_no 가 왜 실패했는지 그대로 남으니
        #      사람이 보고 판단하세요 — 조용히 성공으로 넘기지 않는 것이 여기서의 정답입니다.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # ⚠️ git add 대상을 **명시적으로 열거**합니다(`git add data/` 로 뭉뚱그리면 다른
          #    모듈의 산출물까지 이 커밋에 끌려 들어옵니다). 이 워크플로우가 건드리는 파일은
          #    정확히 아래 3개뿐이고, 기존 배당 파일은 이름부터 다릅니다.
          for f in \
            data/dividend_kr_2026_payment_events.json \
            data/dividend_kr_2026_payment_events_raw.jsonl \
            data/cache/dividend_kr_2026_payment_state.json \
          ; do
            if [ -f "$f" ]; then
              git add "$f"
            fi
          done

          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋하지 않습니다(그날 새 배당결정 공시가 없었다면 정상입니다)."
            exit 0
          fi

          git commit -m "chore(dividend): 배당 지급일정(현금ㆍ현물배당결정) 이벤트 갱신 [skip ci]"

          # 다른 워크플로우(전수 수집·공시감시·코스피 수집 등)도 같은 data/ 폴더를 커밋하므로
          # push 가 거절될 수 있습니다. 기존 워크플로우들과 같은 재시도 패턴.
          for attempt in 1 2 3; do
            if git push; then
              echo "push 성공 (시도 $attempt)"
              exit 0
            fi
            echo "push 거절 — fetch 후 rebase 재시도 ($attempt/3)"
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}" || exit 1
          done
          echo "❌ 3회 시도 후에도 push 하지 못했습니다."
          exit 1

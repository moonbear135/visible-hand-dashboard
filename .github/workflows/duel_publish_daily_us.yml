# .github/workflows/duel_publish_daily_us.yml
# =============================================================================
# ⚔️ "결투다!" USD 트랙 2갈래 공개 순위표 **발행 배치**
#    — `.github/workflows/duel_publish_daily.yml`(원화)의 통화 미러
#      (DUEL_MODULE_WORK_ORDER.md 5-4 · 5-11-9)
#
#   하는 일 (순서가 곧 작업지시서 5-4 의 순서입니다 — 원화와 완전히 같습니다):
#     ⓪ 철회한 USD 계좌의 발행 기록을 **모든 날짜에서** 삭제 (5-8-1)
#     ① 발행 대상 고르기 — final_confirmed=true 이고 revoked_at 이 없는 계좌 (5-4-1)
#     ② 체급 배정 — 독립 동의자만 실제 **달러** 매입원가합계 조회, 시즌 고정 규칙 적용 (5-3)
#     ③ 누적 TWR → (창유형 × 체급) 그룹별 순위 (5-4-3)
#     ④ 최소 인원(500명) 미달 그룹은 발행 안 함 + 과거 행도 삭제 (5-6)
#     ⑤ 그날 발행분 전량 삭제 후 재작성 (5-4-4)
#
#   실제 로직은 전부 파이썬에 있습니다
#   (`run_duel_publish_batch_us.py` → `utils/duel_publish_usd.py`).
#   이 워크플로우는 **언제·어떤 권한으로 그걸 부르는가**만 정합니다.
#
#   ⚠️ 이 배치가 만지는 표는 `duel_public_leaderboard_usd` / `duel_public_holdings_usd`
#      **둘뿐**입니다. 원화 발행표(`_usd` 없는 표)에는 어떤 질의도 가지 않습니다 —
#      5-11-9 가 확정한 "한국장/미국장 완전 별개"는 화면 규칙이 아니라 데이터 경로
#      규칙이고, `tests/test_duel_publish_usd.py` 가 그것을 회귀로 고정합니다.
# -----------------------------------------------------------------------------
# 🕘 왜 03:50 UTC 인가 — **USD 체결 배치보다 뒤여야 합니다** (직접 계산했습니다)
# -----------------------------------------------------------------------------
#   발행 배치는 순위를 매기려고 **그날의 일별 스냅샷(→ 누적 TWR)** 을 읽습니다. 그 스냅샷을
#   만드는 것이 `duel_daily_us.yml`(USD 야간 배치)입니다. 순서가 뒤집히면 그날 체결·스냅샷이
#   반영되지 않은 **하루 낡은 성적**으로 순위표가 나갑니다.
#
#   ① 선행 배치의 **최악의 종료 시각**을 이 저장소의 실제 파일에서 읽었습니다:
#        `.github/workflows/duel_daily_us.yml`
#          · cron            : "0 3 * * *"        → 시작 03:00 UTC (= KST 12:00 정오)
#          · timeout-minutes : 20                 → **최악의 경우 03:20 UTC 종료**
#   ② 원화 트랙이 실제로 쓴 **여유 폭**을 그대로 가져왔습니다:
#        `.github/workflows/duel_publish_daily.yml`
#          · 선행 체결 배치(`duel_daily.yml`) cron '10 8 * * 1-5' + timeout 20분
#            → 최악의 종료 08:30 UTC
#          · 발행 배치 cron '0 9 * * 1-5' = 09:00 UTC → **여유 30분**
#          · 이 30분은 2026-08-20 오너가 직접 확정한 값입니다(처음 10분이었다가 "조금 더
#            넉넉하게 두자"고 하셔서 늘렸습니다 — work order §5-10).
#   ③ **같은 30분 여유를 USD 에 적용**:
#        03:20 UTC(선행 배치 최악 종료) + 30분 = **03:50 UTC = KST 12:50**
#        → 아래 cron `"50 3 * * *"`.
#
#   ④ 뒤쪽 여유도 확인했습니다: 이 배치의 `timeout-minutes: 20` 을 다 써도 04:10 UTC
#      (= KST 13:10)에 끝나므로, 다음 USD 주문 접수 시작(**16:00:01 KST**, §5-13 오너
#      확정)보다 **약 2시간 50분 앞서** 끝납니다. 원화 트랙이 30분 버퍼를 택하면서
#      포기해야 했던 "접수 시작 전 갱신 보장"이, USD 트랙에서는 여유 있게 지켜집니다.
#
#   ⑤ **매일 돌립니다(`* * *`, 평일 한정 아님)** — 선행 `duel_daily_us.yml` 이 매일 도는
#      것과 맞춥니다. 미국 휴장일은 달력을 코드에 박지 않고 "그날 확정 종가가 실제로
#      들어왔는가"로 자연 판별하는 것이 이 트랙의 방식이고(§5-15), 발행 배치는 휴장일에
#      돌아도 그날 새 스냅샷이 없어 순위가 어제와 같을 뿐 아무것도 망가뜨리지 않습니다.
#      (원화 발행 배치가 '1-5'(평일)인 것은 KRX 가 주말에 확실히 쉬기 때문입니다.)
#
#   ⚠️ 🔴 **이 cron 값은 오너가 확정한 것이 아니라, 위 ①~③ 을 제가 직접 계산해서 도출한
#      값입니다** — 선행 `duel_daily_us.yml` 의 cron `0 3 * * *` 자체도 §5-15 에서 도출된
#      미확정 값이므로(work order "🔴 미결정 항목" 6번), **선행 배치의 시각이 바뀌면 이
#      파일의 cron 도 함께 다시 계산해야 합니다.** 두 값은 항상 "선행 종료 + 30분"으로
#      묶여 있습니다.
#
#   ⚠️ 여유를 더 두고 싶으면 늦추세요 — 늦어서 손해 보는 것은 "순위표가 몇 시간 늦게
#      갱신된다"뿐이고, 일러서 생기는 손해는 "틀린 값이 남에게 공개된다"입니다. 두 위험의
#      크기가 다릅니다(§0-3-8).
#
#   ⚠️ 더 안전한 대안(원화 파일이 적어 둔 것과 같은 방식) — 시각이 아니라 **선행 워크플로우
#      완료**를 조건으로 걸 수 있습니다. `duel_daily_us.yml` 의 name 은
#      "Duel Daily Batch (USD)" 입니다(그 파일에서 확인). 바꾸려면 아래 `on:` 을 이렇게:
#        on:
#          workflow_run:
#            workflows: ["Duel Daily Batch (USD)"]
#            types: [completed]
#      그리고 job 에 `if: github.event.workflow_run.conclusion == 'success'` 를 붙입니다.
#      (지금은 네 개의 결투 워크플로우가 **전부 같은 방식**(별도 cron)으로 맞춰져 있습니다 —
#       실행 방식이 서로 다르면 장애가 났을 때 원인 추적이 어려워집니다. 바꾸려면 넷 다
#       바꾸세요.)
# -----------------------------------------------------------------------------
# 🔴 이 배치가 만드는 표는 **로그인한 모든 사용자가 읽습니다** (§0-3-8)
# -----------------------------------------------------------------------------
#   그래서 실패했을 때 기본 동작은 "조용히 넘어가기"가 아니라 **시끄럽게 멈추기**입니다.
#   파이썬 쪽이 비정상 종료하면 이 job 이 실패로 남고, 아래 `if: failure()` 단계가 무엇을
#   확인해야 하는지 로그에 남깁니다. 실패한 날의 순위표는 **어제 발행분이 그대로 남습니다**
#   (화면은 그 그룹의 가장 최근 발행일을 읽습니다) — 잘못된 값을 새로 올리는 것보다 낫습니다.
# =============================================================================

name: Duel Publish Daily (USD)

on:
  schedule:
    # 매일 03:50 UTC = KST 12:50.
    # 선행 USD 체결 배치(`duel_daily_us.yml`) 최악의 종료 03:20 UTC → **30분 여유**
    # (원화 트랙이 오너 확정으로 쓰는 것과 같은 여유 폭. 계산 전문은 위 머리말 참고).
    - cron: "50 3 * * *"
  # 수동 실행. 처음 며칠은 dry-run 으로 "무엇이 발행될 뻔했는지"부터 확인하는 것을 권합니다.
  workflow_dispatch:
    inputs:
      published_date:
        description: "발행일 (YYYY-MM-DD, KST). 비우면 오늘"
        required: false
        default: ""
      dry_run:
        description: "저장하지 않고 계산만 (발행표를 건드리지 않음)"
        required: false
        default: false
        type: boolean

# 이 배치는 저장소에 **아무것도 커밋하지 않습니다**(결과는 전부 Supabase 로 갑니다).
# 그래서 USD 체결 배치(기준값 파일을 되커밋함)와 달리 쓰기 권한을 주지 않습니다 —
# 최소 권한(§0-3-9). 원화 발행 워크플로우와 같습니다.
permissions:
  contents: read

# 같은 발행일을 두 번 처리하려는 실행이 겹치면, 한쪽이 "그날 발행분 전량 삭제"를 하는 사이
# 다른 쪽이 삽입하는 상태가 생길 수 있습니다. 배치 자체는 다시 돌리면 스스로 따라잡지만,
# 그 사이 화면에 절반만 실린 순위표가 보일 수 있으므로 겹쳐 돌지 않게 막습니다.
# ⚠️ 그룹 이름은 원화 발행 배치(`duel-publish-batch`)와 **달라야 합니다** — 같은 이름을 쓰면
#    서로 다른 표를 만지는 두 배치가 서로를 기다리게 됩니다(트랙 분리 원칙, 5-11-1).
concurrency:
  group: duel-publish-batch-usd
  cancel-in-progress: false

jobs:
  duel-publish-usd:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        # 커밋해 되돌릴 것이 없으므로 전체 이력을 받지 않습니다(기본 얕은 클론).

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 결투 USD 발행 배치 실행
        env:
          # 🔴 배치 전용 키. 원화 배치와 **같은 Supabase 프로젝트, 같은 service_role 키**를
          #    씁니다(두 번째 키를 만들지 않습니다 — utils/duel_db_usd.py 머리말 참고).
          #    사용자가 접속하는 앱 서버(Render)에는 **절대** 넣지 않습니다
          #    (§0-3-8 · utils/duel_db.py 머리말). 변수 이름은 duel_db.py 가 읽는 것과
          #    글자 그대로 같아야 합니다: SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.published_date }}" ]; then
            ARGS="$ARGS --published-date ${{ github.event.inputs.published_date }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          echo "실행: python run_duel_publish_batch_us.py $ARGS"
          python run_duel_publish_batch_us.py $ARGS

      - name: 실패했을 때 확인할 것
        if: failure()
        run: |
          echo "❌ USD 발행 배치가 실패했습니다. 달러 순위표는 **이전 발행분이 그대로 남아 있습니다**"
          echo "   (화면은 각 그룹의 가장 최근 발행일을 읽습니다). 원화 순위표는 이 실패와"
          echo "   **무관합니다** — 표도 배치도 물리적으로 별개입니다(5-11-9). 확인 순서:"
          echo "   1) 위 로그의 마지막 '❌ 결투 USD 발행 배치 실패:' 줄 — 원인이 한국어로 적혀 있습니다."
          echo "   2) Secrets 에 SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY 가 있는지."
          echo "   3) 선행 배치(Duel Daily Batch (USD))가 오늘 성공했는지 — 스냅샷이 없으면 순위를"
          echo "      매길 수 없습니다(그 경우 이 배치는 '순위가 매겨진 그룹이 없습니다'로"
          echo "      정상 종료하지, 실패하지는 않습니다)."
          echo "   4) 삭제 후 삽입 도중에 끊긴 경우, 그날 발행분이 일부만 남아 있을 수 있습니다."
          echo "      → workflow_dispatch 로 같은 --published-date 를 다시 실행하면 그날치를"
          echo "        통째로 지우고 다시 씁니다(5-4-4 의 전량 재작성이 그 복구 경로입니다)."
          exit 1

# .github/workflows/scorecard_publish_daily.yml
# =============================================================================
# 📋 "내 성적표" 공개 순위표 **발행 배치 — 원화(KRW) 트랙**
#   (달러 트랙은 `.github/workflows/scorecard_publish_daily_us.yml` — 결투가
#    `duel_daily.yml` / `duel_daily_us.yml` 로 나뉜 것과 같은 모양입니다. 2026-09-07 #203)
#
#   하는 일 (순서가 곧 `utils/scorecard_publish.py::run_publish_batch()` 의 순서입니다):
#     ⓪ 철회한 사용자의 발행 기록을 **모든 날짜·모든 통화에서** 삭제
#     ① 발행 대상 고르기 — final_confirmed=true 이고 revoked_at 이 없는 사용자
#     ② 그 사용자들의 "내 성적표" 보유종목을 한 번에 읽어 **통화별** 포트폴리오로 집계
#     ③ 체급 배정 — **원화** 매입원가합계(전 종목) → 시즌 고정 규칙 적용
#     ④ 매입원가 대비 수익률 → (KRW × 체급) 그룹별 순위
#     ⑤ 최소 인원(`duel_rules.MIN_PARTICIPANTS_FOR_PUBLICATION` — 2026-09-03 부터 1명) 미달 그룹은 발행 안 함 + 과거 행도 삭제
#        — 🔴 **원화 그룹 9개 안에서만.** 달러 그룹은 이 실행이 보지도 지우지도 않습니다(아래 #203)
#     ⑥ 그날 **원화** 발행분 전량 삭제 후 재작성
#
#   실제 로직은 전부 파이썬에 있습니다
#   (`run_scorecard_publish_batch.py --currency KRW` → `utils/scorecard_publish.py`).
#   이 워크플로우는 **언제·어떤 권한으로 그걸 부르는가**만 정합니다.
# -----------------------------------------------------------------------------
# 💱 2026-09-07 (#203) — 왜 원화·달러를 워크플로우 두 개로 나눴는가 (오너 결정)
# -----------------------------------------------------------------------------
#   #201 이 붙인 신선도 검사의 미국 쪽을 살리려고 #202 에서 이 배치의 cron 을 07:30 → 11:35 KST
#   로 옮겼더니, 원화·달러를 한 배치에서 같이 발행하는 구조 때문에 **전날 16:05 에 이미 확정된
#   코스피 성적표까지 미국 지수를 기다리느라 네 시간 늦게** 나갔습니다(오너 지적: "한국 데이터는
#   기다릴 이유가 없다"). 그래서 결투처럼 트랙을 나눕니다 — 이 파일은 **원화만**, 예전처럼 이른
#   아침에. 스크립트는 하나이고 `--currency` 인자만 다릅니다(결투와 달리 파일을 나누지 않는 이유는
#   `run_scorecard_publish_batch.py` 머리말 💱 문단).
#
#   🔴 정합성 조건 — 통화 간 침범 금지. 두 배치가 같은 발행표 두 개를 **서로 다른 시각**에
#      쓰므로, 각 실행은 자기 통화의 행만 읽고·지우고·씁니다:
#        · ⑤ 미달 그룹 가지치기 = 담당 통화의 9개 그룹만(`all_possible_groups(currencies)`),
#        · ⑥ 당일 발행분 삭제 = `currency in ('KRW')` 로 좁힘(`delete_published_rows_for_date`),
#        · 🩺 신선도 판정 = 코스피만(미국 시장 입력은 만들지도 판정하지도 않음).
#      이걸 빠뜨리면 이 배치가 "오늘 나는 달러 그룹을 발행하지 않았다"고 오판해 **달러 그룹의
#      과거 행 전부**를 지웁니다(§0-1 위반 사고). `tests/test_scorecard_publish.py` §14 가
#      "미국 배치를 돌려도 원화 행 무사 / 원화 배치를 돌려도 달러 행 무사"를 양방향으로 고정합니다.
#   ⓪ 철회 청소는 통화와 무관한 의무라 **두 배치 모두** 합니다 — 멱등(두 번째 실행은 지울 것이
#      없어 조회 1개로 끝남)이고, "하루도 거르면 안 되는 일"에 기회가 하루 두 번 생깁니다.
#   concurrency 그룹은 트랙마다 다릅니다(`scorecard-publish-batch` / `-usd`). 두 트랙이 겹쳐
#   돌아도 통화별 행만 만지므로 안전하지만(위 조건이 그 근거), 같은 트랙끼리는 여전히 겹치지 않게.
# -----------------------------------------------------------------------------
# 🕘 왜 이 시각인가 — 원화 트랙은 **선행 배치가 없고**, 코스피는 전날 저녁에 확정됩니다
# -----------------------------------------------------------------------------
#   은퇴하는 결투 발행 배치(`duel_publish_daily.yml`)는 그날의 일별 스냅샷(→ 누적 TWR)이
#   필요해서 체결 배치(`duel_daily.yml`)가 끝난 뒤에 돌아야 했습니다. **이 배치는 다릅니다.**
#   읽는 것은 두 가지뿐입니다:
#     · `public.holdings` — 사용자가 직접 고치는 표(배치가 만들지 않습니다).
#     · 가격 스냅샷 파일 — 저장소에 커밋돼 있는 수집 결과(`data/`).
#   그래서 다른 워크플로우의 완료를 기다릴 이유가 없고, `concurrency` 로 **자기 자신끼리만**
#   겹치지 않게 하면 충분합니다.
#
#   ⚠️ 그래도 **코스피 가격 수집이 끝난 뒤**에 도는 편이 낫습니다 — 가격을 못 구한 종목만 있는
#      사용자는 수익률을 계산할 수 없어 그날 발행에서 빠지기 때문입니다(0% 로 채우지
#      않습니다 — §0-1). 같은 저장소의 실제 값으로 계산한 시간표(cron 은 전부 UTC, KST = UTC+9 —
#      한국은 서머타임이 없어 이 환산은 연중 고정입니다):
#        · `scrape.yml`                  cron '5 7 * * 1-5'      = UTC 07:05 = KST 16:05 (코스피 종가,
#                                        실측 소요 ~1시간 — 2026-09-02~04 실제 종료 17:19~17:59)
#        · `duel_daily.yml`              scrape.yml 완료 직후(workflow_run) — 코스피 신선도 기준값 커밋
#        · **이 파일**                   cron '35 22 * * *'      = UTC 22:35 = **KST 07:35** (다음 날 아침)
#          → 코스피 수집·결투 KR 기준값이 전날 저녁에 끝난 지 **14시간 뒤**입니다. 주말에도
#            돌립니다(보유종목·동의·철회는 장이 열리지 않아도 바뀌고, 특히 **철회 청소는 하루도
#            거르면 안 되는 일**입니다 — 주말에 철회한 사람의 공개 기록이 월요일까지
#            남아 있으면 그게 이 모듈에서 가장 나쁜 실패입니다).
#
#   🕘 2026-09-07 (#203) — 07:35 로 정한 근거(오너: "예전처럼 이른 시각, 데이터로 재검토").
#      · 코스피 쪽 입력은 전부 전날 저녁에 확정됩니다: 스냅샷(`scrape.yml`, 실제 종료 17:19~17:59
#        KST, GitHub 자체 cron 이 늦게 발동한 날도 21:03~22:27), 결투 KR 기준값(`duel_daily.yml`,
#        workflow_run 으로 그 직후 17:46~22:12). 자정 이후라면 언제 돌아도 "어제 값"입니다.
#      · 그래서 종전 07:30 은 데이터 관점에서 안전했고(#201 의 코스피 분석은 07:30 을 전제로 검증됨),
#        오너가 "굳이 옮길 이유가 없으면 07:30 유지"라 했으므로 근방을 유지합니다. 더 당기는
#        것(전날 밤)도 데이터로는 가능하지만, 발행일(`published_date` = 실행일 KST)이 하루 앞으로
#        바뀌어 화면·문서의 "다음 날 아침 발행" 전제가 전부 흔들리므로 하지 않습니다 — 4시간 늦춰
#        지던 것을 되돌리는 것이 이번 목적이지, 앞당기는 것이 아닙니다.
#      · 07:30 이 아니라 07:35 인 이유: 정각·정30분 회피 관례(`scrape.yml` 07:05 / `scrape_us.yml`
#        20:35 — GitHub 스케줄러 혼잡 시각) 하나뿐입니다. #202 가 이 관례를 테스트로 고정했습니다.
#      · 순서 확인: 미국 종목 수집(`scrape_us.yml` 05:35/06:35 KST, 실제 종료 08:20~08:39)·미국
#        벤치마크(08:20, 실제 10시대)보다 **앞**이지만 이 트랙은 미국 파일을 읽지 않으므로 무관하고,
#        달러 트랙(11:35)·결투 USD(12:00)·워치독(18:00)보다 앞입니다. GitHub 스케줄러 지연(실측
#        1.5~5시간)이 걸려도 그날 11:35 트랙과 겹칠 뿐이고, 겹쳐도 안전한 것은 위 💱 문단.
#
#   ⚠️ 여유를 더 두고 싶으면 늦추세요 — 늦어서 손해 보는 것은 "순위표가 몇 시간 늦게
#      갱신된다"뿐이고, 일러서 생기는 손해는 "틀린 값이 남에게 공개된다"입니다. 두 위험의
#      크기가 다릅니다(§0-3-8). 단 워치독(18:00 KST)보다는 앞이어야 합니다.
#      → (#204) 단, "늦추기"는 더 이상 cron 을 옮기는 방식이 아닙니다 — 아래 문단.
#
# -----------------------------------------------------------------------------
# 🔴 2026-09-07 (#204) — `scrape.yml` 완료의 `workflow_run` 을 주 트리거로 추가, cron 은 **순수 안전망**
# -----------------------------------------------------------------------------
#   오너 방향 지시: "전부 다 크롤링 끝나고 연결해서 작업이 발생하게 … 크롤링 후 현재가가 적용이
#   최대한 빨리 되는 방향으로." 위 🕘 문단들은 전부 "코스피는 전날 저녁에 확정되니 다음 날 아침이면
#   충분하다"는 **타이밍 추정**이었고, 결과적으로 16:05 에 수집된 종가가 순위표에 실리기까지
#   14시간(실측으로는 GitHub 스케줄러 지연까지 겹쳐 09:07~10:21 KST — 17시간)이 걸렸습니다.
#
#   트리거 원천 = `scrape.yml`("Daily Market Scraper") 완료. 이 트랙이 읽는 코스피 쪽 입력은 그 한
#   워크플로우가 **한 실행에서 전부** 만듭니다 — 종목 스냅샷(`collector_kospi200.py`)과 코스피 지수
#   (`scrape_daily.py` → `market_history.csv`)가 같은 커밋에 실립니다. 결투 KR 기준값(`duel_daily.yml`
#   산출물)은 §4-b 가 "같은 날이면 이력 CSV 로 대체"하므로 기다릴 필요가 없습니다(결투가 먼저 커밋했든
#   아직이든 판정 경로만 다르고 결과는 같습니다 — `utils/scorecard_publish.py::load_freshness_inputs()`).
#   실측(공개 Actions API, 2026-09-02~06): Cloudflare Worker 의 16:10 dispatch 가 진짜 수집이고
#   17:19~17:59 종료 → 이 배치는 그 직후 1~2분 안에 발행됩니다(종전 다음 날 09:07~10:21).
#
#   `duel_daily.yml` 과 같은 조건(`conclusion == 'success'` + 원천 실행이 schedule 또는 workflow_dispatch)
#   으로 받되, "오늘 값인가"는 게이트 단계 `crawl_ready_gate.py scorecard-kr` 가 **데이터로** 봅니다 —
#   수집기 자체의 사전 점검 함수(#189/#195: 오늘 자 SUCCESS 스냅샷이 장마감 뒤에 저장됨)를 그대로
#   재사용하므로, 백필 dispatch·새벽 수동 실행·이미 처리한 뒤의 두 번째 완료(GitHub cron 지연분)는
#   건너뜁니다. 두 번째 완료를 그냥 돌려도 무해하지만(아래 멱등성) 불필요한 발행이라 거릅니다.
#
#   🔁 멱등성 — 이 배치는 원래 "그날 발행분(담당 통화) 통째로 삭제 후 재작성"(⑥)입니다. 그래서
#      workflow_run(저녁)과 cron(다음 날 아침)이 **둘 다** 돌아도 데이터가 깨지거나 중복되지 않습니다:
#      저녁 실행은 `published_date = D`, 아침 실행은 `published_date = D+1` 로 같은 값을 한 번 더
#      발행하고, 화면은 그룹별 가장 최근 발행일을 읽습니다 — 주말에 이미 매일 일어나는 것과 같은
#      모양(`tests/test_scorecard_publish.py` 가 "같은 날 두 번 발행 = 삭제 후 재작성"을 고정). 그래서
#      cron 쪽엔 게이트를 걸지 않습니다(안전망은 언제나 돕니다 — 철회 청소가 하루 두 번).
#   📅 발행일 의미 변화(정직하게): 종전엔 "D 종가 → D+1 아침 발행"이었고 이제 평일엔 "D 종가 → D
#      저녁 발행"이 먼저 나갑니다. 화면·문서에 "다음 날 아침 발행"을 약속한 문구는 없음을 확인
#      (`web/pages/scorecard_leaderboard_page.py` 는 발행일만 표시). #203 이 "당기지 않는 이유"로 적었던
#      전제는 이번 오너 지시로 뒤집힌 것입니다.
#   🕰️ cron(07:35) 은 그대로 두되 의미가 바뀝니다 — 타이밍 추정이 아니라 **workflow_run 이 그날 안
#      왔을 때 + 주말·휴일의 철회 청소** 를 위한 안전망. 시각은 옮기지 않았습니다(오너: 고정 시각을
#      뒤로 미루는 방향 금지). `workflow_dispatch` 는 게이트를 거치지 않고 예전처럼 항상 실행.
#
#   🩺 2026-09-05 (#201) — 발행 직전에 **결투와 같은 신선도(무변동) 검사**를 합니다
#      (`utils/scorecard_publish.py` §4-b). 수집 실패로 판정(`failed`)되면 이 잡이 실패로
#      남고(아래 `if: failure()` 안내), 휴장/실패 구분 불가·관리자 확인 대기면 오늘 발행만
#      건너뛰고 성공으로 끝나되 실행 요약에 `::warning` 이 뜹니다(어제 발행분 유지).
#      이 트랙은 **코스피만** 검사합니다 — 미국 쪽은 달러 트랙(#203)이 합니다. 실행 요약의
#      "🩺 … KR: 검사함 → ok — 기준선 <어제> (stock_history)" 줄로 확인하세요(평일 아침엔 결투
#      기준선이 오늘 스냅샷과 같은 날이라 이력 CSV 직전 행이 기준선입니다 — §4-b).
# -----------------------------------------------------------------------------
# 🔴 이 배치가 만드는 표는 **로그인한 모든 사용자가 읽습니다** (§0-3-8)
# -----------------------------------------------------------------------------
#   게다가 그 내용은 가상 데이터가 아니라 사용자의 **실제 보유 자산**입니다. 그래서
#   실패했을 때 기본 동작은 "조용히 넘어가기"가 아니라 **시끄럽게 멈추기**입니다.
#   파이썬 쪽이 비정상 종료하면 이 job 이 실패로 남고, 아래 `if: failure()` 단계가 무엇을
#   확인해야 하는지 로그에 남깁니다. 실패한 날의 순위표는 **어제 발행분이 그대로 남습니다**
#   (화면은 그 그룹의 가장 최근 발행일을 읽습니다) — 잘못된 값을 새로 올리는 것보다 낫습니다.
# =============================================================================

name: Scorecard Publish Daily

on:
  schedule:
    # 매일 22:35 UTC = KST 07:35 (다음 날 아침 — 코스피 수집·결투 KR 기준값은 전날 저녁에 확정.
    # 위 머리말 🕘 #203 문단에 근거. #202 의 02:35 UTC(11:35 KST)는 달러 트랙으로 옮겨 감).
    # 🔴 (#204) 이 값은 더 이상 타이밍 추정이 아니라 **순수 안전망**입니다 — 평일엔 아래
    #    workflow_run 이 전날 저녁에 먼저 발행하고, 이 cron 은 그 이벤트가 안 온 날과 주말·휴일
    #    (철회 청소)을 받칩니다. 게이트 없이 항상 돕니다(멱등 — 머리말 🔁).
    - cron: "35 22 * * *"
  # (#204) 코스피 수집(scrape.yml, "Daily Market Scraper")이 끝나면 곧바로 원화 발행. 조건은
  # 아래 job 의 if 와 게이트 단계 참고.
  workflow_run:
    workflows: ["Daily Market Scraper"]
    types: [completed]
  # 수동 실행. 처음 며칠은 dry-run 으로 "무엇이 발행될 뻔했는지"부터 확인하는 것을 권합니다.
  workflow_dispatch:
    inputs:
      published_date:
        description: "발행일 (YYYY-MM-DD, KST). 비우면 오늘"
        required: false
        default: ""
      dry_run:
        description: "저장하지 않고 계산만 (발행표를 건드리지 않음)"
        required: false
        default: false
        type: boolean

# 이 배치는 저장소에 **아무것도 커밋하지 않습니다**(결과는 전부 Supabase 로 갑니다).
# 그래서 쓰기 권한을 주지 않습니다 — 최소 권한(§0-3-9).
permissions:
  contents: read

# 같은 발행일·같은 통화를 두 번 처리하려는 실행이 겹치면, 한쪽이 "그날 발행분 전량 삭제"를 하는
# 사이 다른 쪽이 삽입하는 상태가 생길 수 있습니다. 배치 자체는 다시 돌리면 스스로 따라잡지만,
# 그 사이 화면에 절반만 실린 순위표가 보일 수 있으므로 겹쳐 돌지 않게 막습니다.
# (달러 트랙은 다른 그룹 `scorecard-publish-batch-usd` — 통화별 행만 만지므로 서로 겹쳐도 됩니다.)
concurrency:
  group: scorecard-publish-batch
  cancel-in-progress: false

jobs:
  scorecard-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # (#204) workflow_run 으로 깨어났을 때만 거릅니다 — scrape.yml 이 성공으로 끝났고 그 실행이
    # 자기 cron 또는 workflow_dispatch(Cloudflare Worker 의 16:10 발동이 실제 수집) 였을 때.
    # cron·workflow_dispatch 로 직접 불렸을 땐 항상 참(예전과 동일).
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.event == 'schedule' || github.event.workflow_run.event == 'workflow_dispatch'))

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        # 커밋해 되돌릴 것이 없으므로 전체 이력을 받지 않습니다(기본 얕은 클론).
        # ⚠️ 다만 `data/` 의 가격 스냅샷 파일은 **체크아웃으로 함께 받아야** 합니다
        #    (수익률 계산이 그 파일을 읽습니다). 얕은 클론이라도 최신 커밋의 파일은
        #    전부 들어 있으므로 추가 설정이 필요 없습니다.
        # (#204) workflow_run 이면 ref 없이 main 의 그 시점 최신 커밋 = scrape.yml 이 방금
        #    push 한 스냅샷 커밋이 딸려 옵니다(duel_daily.yml 과 같은 전제).

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚦 크롤링 완료 게이트 (#204 — workflow_run 으로 깨어났을 때만)
        id: gate
        if: github.event_name == 'workflow_run'
        # "오늘(KST) 자 코스피 SUCCESS 스냅샷이 장마감 뒤에 저장됨"일 때만 아래가 돕니다
        # (수집기의 #189/#195 사전 점검 함수 재사용). cron·수동은 게이트 없이 항상 진행(멱등).
        run: |
          python crawl_ready_gate.py scorecard-kr --role event

      - name: 성적표 발행 배치 실행 (KRW)
        if: github.event_name != 'workflow_run' || steps.gate.outputs.ready == 'true'
        env:
          # 🔴 배치 전용 키. 사용자가 접속하는 앱 서버(Render)에는 **절대** 넣지 않습니다
          #    (§0-3-8 · utils/duel_db.py 머리말). 변수 이름은 duel_db.py 가 읽는 것과
          #    글자 그대로 같아야 합니다: SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY.
          #    (성적표 발행 배치는 결투 배치와 **같은 Supabase 프로젝트**의 다른 표를
          #     쓰므로, 키도 같은 것 하나를 씁니다 — 두 번째 키 경로를 만들지 않습니다.)
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          # 🔴 --currency KRW 가 이 트랙의 전부입니다 — 빠지면 두 통화를 한 번에 발행합니다(#203).
          ARGS="--currency KRW"
          if [ -n "${{ github.event.inputs.published_date }}" ]; then
            ARGS="$ARGS --published-date ${{ github.event.inputs.published_date }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          echo "실행: python run_scorecard_publish_batch.py $ARGS"
          python run_scorecard_publish_batch.py $ARGS

      - name: 실패했을 때 확인할 것
        if: failure()
        run: |
          echo "❌ 발행 배치(KRW)가 실패했습니다. 순위표는 **이전 발행분이 그대로 남아 있습니다**"
          echo "   (화면은 각 그룹의 가장 최근 발행일을 읽습니다). 확인 순서:"
          echo "   1) 위 로그의 마지막 '❌ 성적표 발행 배치 실패:' 줄 — 원인이 한국어로 적혀 있습니다."
          echo "   2) Secrets 에 SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY 가 있는지."
          echo "   3) sql/scorecard_public_schema.sql 이 Supabase 에서 실행됐는지 —"
          echo "      표가 없으면 '... does not exist' 계열 오류가 납니다."
          echo "   4) 삭제 후 삽입 도중에 끊긴 경우, 그날 원화 발행분이 일부만 남아 있을 수 있습니다."
          echo "      → workflow_dispatch 로 같은 published_date 를 다시 실행하면 그날 원화분을"
          echo "        통째로 지우고 다시 씁니다(전량 재작성이 그 복구 경로입니다). 달러 행은 건드리지 않습니다."
          exit 1

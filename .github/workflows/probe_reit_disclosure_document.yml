# .github/workflows/probe_reit_disclosure_document.yml
# =============================================================================
# 🔍 (임시·일회성) 리츠(REIT) "부동산투자회사금전배당결정" 공시 원문 실측 조사
#
#   왜 필요한가:
#     `collector_dividend_payment_kr.py`는 처음부터 "리츠 전용 공시 원문의 표 라벨은
#     아직 못 봤다"고 밝혀뒀고, 2026-08-25 8월 백필 실행에서 실제로 롯데리츠ㆍSK리츠ㆍ
#     코람코더원리츠ㆍNH올원리츠 4건이 `parse_status=PARTIAL`(배당구분ㆍ배당종류ㆍ
#     배당금지급 예정일자 라벨을 못 찾음)로 확인됐습니다. 이 워크플로우는 이미 받아 둔
#     그 4건의 rcept_no로 원문(document.xml)을 다시 받아 **실제 라벨 구조를 로그에
#     그대로 찍습니다** — 짐작해서 파서를 고치지 않기 위해서입니다(§0-1).
#
#   무엇을 하는가:
#     probe_reit_disclosure_document.py 를 실행합니다. 이 스크립트는:
#       · data/dividend_kr_2026_payment_events.json 을 **읽기만** 합니다(새 API 조회 없음).
#       · 리츠 전용 접두사 + PARTIAL 인 레코드만 골라(현재 4건) rcept_no로 원문만 다시
#         받습니다(§0-3-2 — 호출 횟수가 늘어나지 않음, 대상이 고정).
#       · data/ 에 아무것도 쓰지 않습니다(조사용, `if: always()` 도 커밋 스텝도 없음).
#
#   실행 방법:
#     Actions 탭 → 이 워크플로우 → "Run workflow" (수동 1회).
#     끝나면 로그 전체를 복사해서 개발 세션에 붙여넣어주세요 — 그 실제 라벨을 보고
#     파서(`parse_dividend_decision_document`)에 리츠 전용 라벨 인식을 추가합니다.
#
#   ✅ 조사가 끝나고 로그를 전달했으면 **이 파일과 `probe_reit_disclosure_document.py`
#      둘 다 지워도 됩니다** — "확인 끝난 일회성 스크립트·워크플로우를 남겨두지 않는다"가
#      이 프로젝트의 관례입니다(`probe_dart_disclosure_document.yml` 전례).
#
#   비밀키:
#     DART_API_KEY (기존 배당 워크플로우들과 같은 시크릿). 코드·이 파일 어디에도
#     하드코딩돼 있지 않습니다.
# =============================================================================

name: (임시) 리츠 공시 원문 조사

on:
  # 스케줄 없음 — 손으로 한 번만 돌립니다.
  workflow_dispatch: {}

# 조사용이라 data/ 에 아무것도 쓰지 않습니다 — 쓰기 권한이 필요 없습니다.
permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "⚠️ requirements.txt 가 없습니다 — 이 조사 스크립트가 쓰는 requests 만 설치합니다."
            pip install requests
          fi

      - name: 리츠 공시 원문 조사 실행
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python probe_reit_disclosure_document.py

name: Keep App Awake

# =============================================================================
# 💤 Streamlit Community Cloud "12시간 무방문 시 잠들기" 방지용 (2026-08-09 신설)
#
# 무료 호스팅(Streamlit Community Cloud)은 12시간 동안 아무도 방문하지 않으면
# 앱을 재웁니다(원래 24시간이었다가 2025-03 12시간으로 단축됨 — 공식 문서 기준).
# 도메인(visiblehand.co.kr)을 사도 호스팅 자체는 그대로 무료 티어라 이 정책이 그대로
# 적용됩니다. 이 워크플로우는 그 12시간 타이머가 다 차기 전에 주기적으로 실제 앱
# URL을 방문(HTTP GET)해서 깨어있는 상태를 유지시킵니다.
#
# ⚠️ 커스텀 도메인(visiblehand.co.kr)이 아니라 **실제 Streamlit 앱 주소**를 직접
#    호출합니다. 커스텀 도메인은 index.html이 그 주소를 iframe으로 감싸는 구조라,
#    curl로 커스텀 도메인만 열면 그 껍데기 HTML만 받아올 뿐 iframe 안의 실제
#    Streamlit 앱까지는 도달하지 않아 깨우기 효과가 없습니다.
#
# ⚠️ 이건 Streamlit이 공식 제공하는 기능이 아니라 흔히 쓰이는 우회법입니다
#    (discuss.streamlit.io에서 자주 나오는 방법). Streamlit이 정책을 더 조이면
#    (예: 단순 HTTP 요청은 "방문"으로 안 쳐주는 식으로) 무력화될 수 있습니다 —
#    그런 경우 앱이 다시 잠드는 것을 발견하면 이 파일을 다시 봐야 합니다.
#
# 코스피/미국주식 수집 워크플로우와는 완전히 무관합니다. 데이터 수집도, 깃허브
# 커밋도 하지 않고 그냥 사이트를 열어보고 끝나는 작업이라 실패해도 데이터에
# 영향이 없습니다.
# =============================================================================

on:
  schedule:
    # 8시간마다 1번 — 12시간 잠들기 기준보다 넉넉히 여유를 둠(GitHub Actions 스케줄
    # 자체가 몇 분씩 밀리는 경우가 있어, 자정 근처의 트래픽 몰림도 피하려고 정각을
    # 살짝 비껴 13분으로 설정).
    - cron: '13 */8 * * *'
  workflow_dispatch: {}
    # 깃허브 웹 화면(Actions 탭)에서 수동으로 즉시 실행할 수 있는 버튼 활성화

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 실제 Streamlit 앱 URL 방문 (깨어있는 상태 유지)
        run: |
          URL="https://visible-hand-dashboard-2vmzz6tk63wsac7n345ord.streamlit.app/"
          echo "방문: $URL"
          # 2026-08-10 수정: 최초 버전은 -L(리다이렉트 추적)이 없어서 Streamlit이
          # 반환하는 303 응답을 그대로 실패로 처리했습니다(실측 확인 — 3회 전부 303).
          # curl은 기본적으로 리다이렉트를 따라가지 않으므로 반드시 -L이 필요합니다.
          # 최대 3회 재시도(연속 실패해도 다음 8시간 뒤 다시 시도하므로 여기서
          # 너무 오래 붙잡고 있을 필요는 없음). 200뿐 아니라 2xx 전체를 성공으로 봄
          # (리다이렉트를 다 따라간 뒤의 최종 상태 코드 기준).
          for i in 1 2 3; do
            code=$(curl -sSL -o /dev/null -w '%{http_code}' --max-time 30 "$URL" || echo "000")
            echo "시도 $i: 최종 HTTP $code"
            case "$code" in
              2??)
                echo "✅ 정상 응답"
                exit 0
                ;;
            esac
            sleep 15
          done
          echo "⚠️ 3회 시도 후에도 2xx 응답을 못 받음 — 다음 8시간 뒤 다시 시도됩니다. (실패해도 기존 자동화·데이터엔 영향 없음. 참고: 이 핑은 '잠들기 전에 미리 방문'하는 예방용이라, 이미 완전히 잠든 앱을 이 핑 하나로 반드시 깨운다는 보장은 없습니다 — 지금 잠들어 있다면 오너가 직접 앱에서 'Yes, get this app back up!'을 눌러야 합니다.)"
          exit 1

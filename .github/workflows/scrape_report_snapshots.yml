name: Daily Report Snapshots

# =============================================================================
# 📈 리포트 모듈 — ① 미국 벤치마크(S&P500·나스닥) 일별 종가 수집
#                  ② 가입한 모든 사용자의 그날 평가금액 스냅샷 적재
#                  (2026-08-12 신설, REPORT_WORK_ORDER.md §6-2 / §7)
#
# ⚠️ 기존 `scrape.yml`(코스피) · `scrape_us.yml`(미국주식)과 **완전히 분리된 별도
#    워크플로우**입니다(ENGINEERING_SPEC §0-3-6). 잘 돌고 있는 두 자동화를 건드리지
#    않기 위해 파일 자체를 나눴습니다.
#
# ── 왜 이 시각인가 ─────────────────────────────────────────────────────────
# 스냅샷은 **그날 가격이 이미 갱신된 뒤**에 찍어야 정확합니다. 앞선 두 워크플로우가
# 언제 끝나는지를 기준으로 잡았습니다.
#
#   · scrape.yml     : 07:05 UTC 시작(= KST 16:05), 실측 20~30분  → 늦어도 07:40 UTC 종료
#   · scrape_us.yml  : 20:35 UTC(EDT) / 21:35 UTC(EST) 시작, 실측 40~56분
#                      → EST 기간 기준으로 가장 늦게 끝나는 경우가 약 22:35 UTC
#
# 그래서 **23:20 UTC(월~금)** 에 실행합니다. 가장 늦는 경우에도 약 45분 여유가 있고,
# 이 시각이면 그날의 한국 종가와 미국 종가가 둘 다 저장소에 들어와 있습니다.
#   (23:20 UTC = 다음날 08:20 KST — 예: 월요일 23:20 UTC 실행분은 "월요일" 거래일의
#    한국·미국 종가를 담습니다. 미국 정규장 마감 16:00 ET = 20:00 UTC 월요일.)
#
# ── 날짜는 시각이 아니라 데이터가 정합니다 ────────────────────────────────
# 스냅샷 행의 `snapshot_date` 는 이 워크플로우가 도는 시각이 아니라, **가격 스냅샷
# 파일이 스스로 말하는 거래일**입니다(`utils/report_db.resolve_session_dates()`).
# 앞선 수집이 실패해 어제 파일이 그대로 남아 있으면, 그 값을 '오늘 값'으로 둔갑시키지
# 않고 어제 날짜 행을 그대로 갱신합니다(§0-1 · §0-3-1 후행지표 전용).
#
# ── 🔴 이 워크플로우만 service_role 키를 씁니다 ───────────────────────────
# "내 성적표" 앱(Streamlit)은 anon key + RLS 만 씁니다. 이 배치는 **가입한 모든
# 사용자**의 스냅샷을 만들어야 해서 RLS 를 우회하는 service_role 이 필요합니다.
#   · 키는 **GitHub Actions Secrets** 에만 등록합니다(`KRX_OPENAPI_KEY` 가 있는 그 자리).
#     Streamlit Cloud Secrets(앱)에는 절대 넣지 마세요 — 넣는 순간 RLS 가 무력화됩니다.
#   · 이 패턴을 다른 곳(특히 앱 코드)에 복사하지 마세요. 자세한 이유는
#     `utils/report_db.py` 상단 주석과 `sql/report_schema.sql` §1 에 적어 뒀습니다.
#
# 필요한 Secrets (오너가 등록):
#   SUPABASE_URL                : Supabase 프로젝트 URL (앱에 쓰는 것과 같은 값)
#   SUPABASE_SERVICE_ROLE_KEY   : Supabase → Settings → API → service_role key
#
# ── 🔴 2026-09-07 (#204) — `scrape_us.yml` 완료의 `workflow_run` 을 주 트리거로, cron 은 순수 안전망 ──
# 오너 방향 지시: "전부 다 크롤링 끝나고 연결해서 작업이 발생하게 … 크롤링 후 현재가가 적용이
# 최대한 빨리 되는 방향으로." 위 "왜 이 시각인가"는 타이밍 추정이었고(scrape_us 실측 소요도 그 뒤
# 40~56분 → 51~55분으로 늘었음), 실측(공개 Actions API, 2026-09-01~05)으로는 미국 종목 수집이
# 08:20~08:39 KST 에 끝났는데 이 워크플로우는 GitHub 스케줄러 지연으로 10:04~10:52 에야 돌아
# 벤치마크·사용자 스냅샷이 1.5~2시간 늦었고, 그 뒤에 매달린 결투 USD·성적표 달러 트랙까지 같이
# 밀렸습니다. 이제 "Daily US Stocks Scraper" 완료(conclusion=success, 원천 실행이 schedule 또는
# workflow_dispatch) 직후에 돌고, 게이트 `crawl_ready_gate.py report-snapshots` 가 **데이터로**
# ① 미국 스냅샷이 처리 거래일(어제, 한국 날짜)의 SUCCESS 인지 ② 벤치마크 수집 시각이 그 스냅샷
# 수집 시각보다 **앞**인지(= 이번 수집분으로 아직 안 돌았는지)를 확인한 뒤에만 아래 단계가 돕니다.
#   · scrape_us.yml 은 서머타임 대비 cron 이 두 줄이라 하루 두 번 완료됩니다(한 번은 수집기 사전
#     점검이 건너뜀). ② 덕분에 두 번째 완료는 조용히 건너뜁니다 — 벤치마크 요청을 하루 두 번 보내지
#     않습니다(§0-3-2 정중한 크롤링).
#   · 벤치마크 원천(stockanalysis.com)의 그날 종가가 이 시각(미국 동부 19:2x~19:4x)에 있는가 —
#     실측 08-19~08-26 의 08:41~08:44 KST(= 19:41~19:44 ET) 수집분이 전부 그날 종가를 받았습니다.
#     혹시 아직 없으면 `collector_us_indices.py` 는 기존 이력을 건드리지 않고 끝나고(그날 값 없음),
#     아래 cron 안전망이 08:20(+지연)에 다시 받아 옵니다 — 그때 완료가 후속 배치를 깨웁니다.
#   · 코스피 수집(scrape.yml) 완료엔 걸지 않습니다 — 스냅샷은 "그날의 한국·미국 종가를 둘 다 담아
#     하루 한 번"이 설계이고(위 문단), 한국 종가는 전날 저녁에 이미 들어와 있습니다.
#   · cron('20 23 * * 1-5') 은 그대로 두되 의미가 바뀝니다 — 타이밍 추정이 아니라 **workflow_run 이
#     안 왔을 때(미국 수집 실패·누락·벤치마크 미확보)** 를 위한 안전망. 게이트 없이 항상 돕니다
#     (벤치마크·스냅샷 적재는 날짜 기준 upsert 라 중복 실행이 무해). 시각은 옮기지 않았습니다
#     (오너: 고정 시각을 뒤로 미루는 방향 금지). workflow_dispatch(수동·dry-run)도 게이트 없이 항상.
#   · 기대 효과(실측 기반): 미국 종목 수집 종료(08:20~08:39) 직후 1~2분 — 종전 10:04~10:52 대비
#     1.5~2시간 빠름. 그 완료가 곧바로 결투 USD·성적표 달러 트랙(둘 다 #204 에서 workflow_run 으로
#     연결)을 깨우므로 미국 쪽 전체 사슬이 앞당겨집니다. 실제 발동은 다음 평일에 확인 필요(§0-1).
# =============================================================================

on:
  # ══════════════════════════════════════════════════════════════════════════
  # 🛑 2026-09-08 — **오너 지시로 자동 실행을 멈췄습니다.**
  #
  # 오너: *"모든 그냥 시스템 종료 / 홈페이지 폐쇄 / 비공개로 한다"*
  #
  # 이유: 코스콤·거래소 시세정보 이용 원칙 확인 결과, 시세를 제3자에게 보여주는 것은
  #       시세정보 이용계약 없이는 불가하고(예외는 "부분 발췌 + 비시스템적 + 비상업적"
  #       뿐인데 이 시스템은 셋 다 해당 없음), 코스콤 오픈API플랫폼은 법인만 이용
  #       가능합니다. 자세한 근거는 `DATA_SOURCES_INVENTORY.md`, 경위는 TASK_HISTORY #227.
  #
  # 🔴 자동 실행을 멈춘 것은 **상대 서버에 계속 요청을 보내지 않기 위해서**이기도 합니다
  #    (§0-3-2 — 필요 없어진 주기 작업을 남겨두는 것도 위반).
  #
  # ▶ 지워지지 않았습니다. `workflow_dispatch`(수동 실행)는 남아 있어 필요하면 오너가
  #   직접 한 번씩 돌릴 수 있습니다.
  # ▶ 되살리려면 아래 주석(`#`)만 풀면 원래대로 돌아갑니다.
  # ══════════════════════════════════════════════════════════════════════════
#  schedule:
    # 월~금 23:20 UTC (= 다음날 08:20 KST). 위 "왜 이 시각인가" 참고.
    # 🔴 (#204) 이 값은 더 이상 타이밍 추정이 아니라 **순수 안전망**입니다 — 평소엔 아래
    #    workflow_run 이 미국 종목 수집 직후에 먼저 돌고, 이 cron 은 그 이벤트가 안 온 날을 받칩니다.
#    - cron: '20 23 * * 1-5'
  # (#204) 미국 종목 수집(scrape_us.yml, "Daily US Stocks Scraper")이 끝나면 곧바로. 조건은
  # 아래 job 의 if 와 게이트 단계 참고.
#  workflow_run:
#    workflows: ["Daily US Stocks Scraper"]
#    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'true 로 두면 Supabase 에 저장하지 않고 계산 결과만 로그로 확인합니다(안전 점검용)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write # data/us_index_history.json 커밋용

# 앞선 실행이 아직 돌고 있으면 취소하지 않고 대기시킵니다(같은 날짜를 두 번 upsert 해도
# 행이 늘지는 않지만, 불필요한 중복 요청 자체를 피합니다 — §0-3-2).
concurrency:
  group: report-snapshots
  cancel-in-progress: false

jobs:
  report-snapshots:
    runs-on: ubuntu-latest
    # 지수 요청 2회 + Supabase 왕복 정도라 몇 분이면 끝납니다. 사고 시 과금/점유를 막기 위해
    # 넉넉하되 짧게 잡습니다.
    timeout-minutes: 20
    # (#204) workflow_run 으로 깨어났을 때만 거릅니다 — scrape_us.yml 이 성공으로 끝났고 그 실행이
    # 자기 cron 또는 workflow_dispatch 였을 때. cron·workflow_dispatch 로 직접 불렸을 땐 항상 참.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.event == 'schedule' || github.event.workflow_run.event == 'workflow_dispatch'))

    steps:
    - name: 저장소 코드 체크아웃
      uses: actions/checkout@v3

    - name: 파이썬 환경 설정
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 필수 의존 라이브러리 설치
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 🚦 크롤링 완료 게이트 (#204 — workflow_run 으로 깨어났을 때만)
      id: gate
      if: github.event_name == 'workflow_run'
      # 미국 스냅샷이 처리 거래일(어제, 한국 날짜)의 SUCCESS 이고, 벤치마크가 아직 그 스냅샷
      # 이후에 수집된 적 없을 때만 아래가 돕니다(머리말 #204). cron·수동은 게이트 없이 항상 진행.
      run: |
        python crawl_ready_gate.py report-snapshots --role event

    - name: 📈 미국 벤치마크(S&P500·나스닥) 일별 종가 수집
      if: github.event_name != 'workflow_run' || steps.gate.outputs.ready == 'true'
      # 실패해도 뒤 단계(스냅샷 적재)는 계속 진행합니다 — 벤치마크가 없으면 그 날 값만
      # NULL 로 저장되고(§0-1, 전날 값 복사 금지) 포트폴리오 기록 자체는 남아야 하기 때문입니다.
      continue-on-error: true
      run: |
        python collector_us_indices.py collect

    - name: 📸 사용자별 평가금액 스냅샷 적재 (Supabase)
      if: github.event_name != 'workflow_run' || steps.gate.outputs.ready == 'true'
      env:
        # ⚠️ 값 자체는 저장소 Secrets 에만 있고 코드·로그·문서 어디에도 남기지 않습니다.
        #    (`utils/report_db.py` 는 이 두 값을 환경변수에서만 읽고, st.secrets 는 보지 않습니다)
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      run: |
        if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
          echo "⚠️ dry_run=true — Supabase 에 저장하지 않고 계산 결과만 출력합니다"
          python -m utils.report_db snapshot --dry-run
        else
          python -m utils.report_db snapshot
        fi

    - name: 벤치마크 이력 파일을 깃허브에 커밋
      if: github.event_name != 'workflow_run' || steps.gate.outputs.ready == 'true'
      # 커밋 대상은 이 워크플로우가 만드는 공개 데이터 **한 파일뿐**입니다.
      #   data/us_index_history.json : 미국 벤치마크 일별 종가(개인정보 아님)
      # 사용자 스냅샷은 git 이 아니라 Supabase 에만 저장됩니다(개인 금융정보).
      # 그래서 다른 워크플로우처럼 `-A` 옵션으로 data 폴더를 통째로 담지 않습니다
      # — 코스피/미국주식 수집기의 산출물이나 다른 파일이 이 커밋에 딸려오면 안 됩니다.
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

        # ⚠️ 2026-08-12 수정: 파일명을 그냥 `git add` 하면 파일이 없을 때
        #    `fatal: pathspec ... did not match any files` 로 **잡 전체가 죽습니다**(exit 128).
        #    수집기는 "두 지수 다 실패하면 기존 값 보존을 위해 파일을 아예 건드리지 않는"
        #    정상 동작이 있어서(§0-1), 파일 없음은 사고가 아니라 예상 가능한 상태입니다.
        #    있으면만 add 하고, 없으면 조용히 넘어갑니다.
        if [ -f data/us_index_history.json ]; then
          git add data/us_index_history.json
        else
          echo "ℹ️ data/us_index_history.json 이 아직 없습니다(수집 실패 또는 첫 실행) — 커밋 없이 넘어갑니다"
        fi

        # 변경분이 없으면(같은 날 재실행 등) commit 이 실패하는데, 이것도 정상이라 조용히 종료합니다.
        git commit -m "Report Benchmark Update: $(date +'%Y-%m-%d') [무인 자동화 로봇]" || exit 0

        # 다른 워크플로우(코스피/미국주식)나 사람이 그 사이 푸시했으면 원격이 앞서 있어
        # push 가 거부됩니다. 기존 두 워크플로우와 동일하게 최대 3회 재시도합니다.
        for i in 1 2 3; do
          if git push origin main; then
            echo "✅ 푸시 성공"
            exit 0
          fi
          echo "⚠️ 푸시 거부됨 (원격이 앞서있음) — 최신 내용 받아와서 재시도 ($i/3)"
          git fetch origin main
          if ! git rebase origin/main; then
            echo "❌ 리베이스 충돌 발생 — 자동 병합 불가, 수동 확인 필요"
            git rebase --abort
            exit 1
          fi
        done
        echo "❌ 3회 재시도 후에도 푸시 실패"
        exit 1

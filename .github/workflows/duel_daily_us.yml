# .github/workflows/duel_daily_us.yml
# =============================================================================
# ⚔️ "결투다!" USD 트랙 야간 배치 — `.github/workflows/duel_daily.yml`(원화)의 미러
#
#   하는 일 (순서는 원화와 같습니다 — DUEL_MODULE_WORK_ORDER.md 2-5):
#     ① 그날(어제, 아래 참고) 확정 미국 정규장 마감가가 실제로 확보됐는지 판정
#     ② 오늘(한국 날짜)이 10일이면 정기 입금
#     ③ pending 주문 체결 → 포지션 갱신 → 현금 원장 기록
#     ④ 일별 스냅샷 적재
#     ⑤ 다음 비교용 기준값 파일(USD 전용)을 저장소에 커밋
#
#   실제 로직은 전부 파이썬에 있습니다
#   (`run_duel_daily_batch_us.py` → `utils/duel_batch_usd.py`).
#   이 워크플로우는 **언제·어떤 권한으로 그걸 부르는가**만 정합니다.
# -----------------------------------------------------------------------------
# 🔴 cron 시각을 왜 이렇게 잡았는가 — `utils/duel_batch_usd.py` 머리말과 같은 근거
# -----------------------------------------------------------------------------
#   미국 정규장 마감 확정 종가는 `.github/workflows/scrape_us.yml`(2026-08-20 device_bash 로
#   원문 직접 확인)이 수집합니다. 그 워크플로우의 cron 은 서머타임 20:35 UTC / 표준시
#   21:35 UTC 이고, 실측 소요 55.5분, 최악의 경우(타임아웃) 90분까지 걸립니다:
#
#     · 서머타임(EDT) — 완료 21:30~22:05 UTC = 06:30~07:05 KST(다음 날)
#     · 표준시(EST)   — 완료 22:30~23:05 UTC = 07:30~08:05 KST(다음 날)
#
#   즉 늦어도 KST 08:05 에는 그날 수집이 끝나 있습니다. 이 배치는 그 뒤 **충분한 여유**를 두고
#   03:00 UTC(= KST 12:00, 정오)에 돌립니다 — 최악의 수집 완료 시각(08:05 KST)에서도 거의
#   4시간 여유이고, 다음 주문 접수 시작(16:00:01 KST, 같은 한국 날짜)보다 4시간 앞서
#   끝납니다. 원화 배치(코스피 수집 16:40 종료 → 배치 17:10, 30분 여유)보다 훨씬 넉넉한
#   이유는, 미국 수집이 실측 소요 시간이 더 길고(20~30분 vs 55~90분) 실패 시 재시도까지
#   감안해야 하기 때문입니다 — 여유를 좁게 잡았다가 나중에 넓히는 대신(발행 배치에서 실제로
#   있었던 일 — 10분→30분), 처음부터 넉넉하게 잡았습니다.
#
#   ⚠️ 이 cron 값은 오너가 명시적으로 확정한 것이 아니라 이번 라운드에 실제 수집 스케줄로부터
#      도출한 값입니다 — 저장소를 다시 열면 오너 확인 항목으로 다시 짚어 주세요
#      (`DUEL_MODULE_WORK_ORDER.md` 참고).
# -----------------------------------------------------------------------------
# 🔴 2026-09-07 (#204) — `workflow_run` 을 주 트리거로 추가, 위 cron 은 **순수 안전망**으로 강등
# -----------------------------------------------------------------------------
#   오너 방향 지시: "전부 다 크롤링 끝나고 연결해서 작업이 발생하게 … 시간을 뒤로 영원히 미뤄도
#   OK 라는 건 절대 아니다 … 크롤링 후 현재가가 적용이 최대한 빨리 되는 방향으로." 위 12:00 은
#   "최악의 수집 완료 + 4시간 여유"라는 타이밍 추정이었고, 실측으로는 GitHub 스케줄러 지연까지
#   겹쳐 **16:18~18:39 KST** 에 돌았습니다(공개 Actions API, 09-02~06 실행 #13~#17). 데이터는 그보다
#   6~8시간 전에 다 들어와 있었습니다.
#
#   이 배치의 입력은 **둘**입니다 — 둘 다 없으면 체결하지 않습니다:
#     · 미국 종목 종가 스냅샷  ← `scrape_us.yml`("Daily US Stocks Scraper")
#     · 미국 벤치마크 종가     ← `scrape_report_snapshots.yml`("Daily Report Snapshots")
#       (지수가 처리 거래일보다 낡으면 `run_duel_daily_batch_us.py` H-1 이 판정을 믿지 않고
#        **보류**합니다 — 지수 없이 돌리면 체결 대신 보류가 되고, 그 뒤 두 번째 실행이 첫 실행의
#        기준값과 비교해 "전부 무변동" → 보류 주문 **취소**로 이어질 수 있습니다. 그래서 종목만
#        들어온 시점에 돌리면 안 됩니다.)
#   어느 쪽이 나중에 끝나는가 — 실측(2026-09-01~05, KST):
#     날짜   scrape_us.yml 실제 종료   scrape_report_snapshots.yml 실제 종료(벤치마크 커밋)
#     09-01  09:54 / 10:46(실패)       10:52
#     09-02  08:36 / 09:30(실패)       10:05
#     09-03  08:39 / 09:31(실패)       10:11
#     09-04  08:37 / 08:38             10:04
#     09-05  08:20 / 08:21             10:04
#   → 지수 쪽이 **항상** 1.5~2시간 늦게 끝났습니다(GitHub 자체 cron 08:20 이 지연된 결과). 그런데
#     #204 에서 `scrape_report_snapshots.yml` 자체도 scrape_us.yml 완료의 workflow_run 으로 바꿨으므로
#     앞으로는 "종목 종료 → 1~2분 뒤 지수 종료"가 정상 순서이고, 지수 수집이 실패하거나 그 cron
#     안전망이 먼저 돈 날은 순서가 뒤집힐 수 있습니다. 그래서 **두 워크플로우 완료를 모두** 트리거로
#     걸고, 어느 쪽으로 깨어나든 게이트(`crawl_ready_gate.py duel-us`)가 **데이터로** "처리 거래일의
#     종목 스냅샷(SUCCESS)과 벤치마크 두 지수의 종가가 모두 있고, 아직 처리 전"임을 확인한 뒤에만
#     배치를 돌립니다 — 먼저 끝난 쪽의 이벤트는 조용히 건너뛰고, 나중에 끝난 쪽의 이벤트가 실제로
#     처리합니다. 하루 두 번 완료되는 scrape_us.yml(서머타임 대비 cron 두 줄 — 한 번은 건너뛰기)도
#     "이미 처리함"으로 걸러집니다.
#   cron(12:00) 은 그대로 두되 의미가 바뀝니다 — 타이밍 추정이 아니라 **workflow_run 이 그날 안
#   왔을 때(두 크롤링 중 하나라도 실패·누락)** 를 위한 안전망. 같은 게이트를 `--role safety-net`
#   으로 불러 "아직 처리 전"일 때만 돕니다(수집 완료는 조건으로 걸지 않습니다 — 크롤링이 안 된 날
#   신선도 판정으로 주문을 정리하는 것이 안전망의 역할). 시각은 옮기지 않았습니다(오너: 고정 시각을
#   뒤로 미루는 방향 금지).
#   `workflow_dispatch`(관리자 override·백필)는 게이트를 거치지 않고 예전과 똑같이 항상 실행.
#   기대 효과(실측 기반): 벤치마크 커밋 직후 1~2분 — 종전 16:18~18:39 대비 6~8시간 빠름. 실제 발동은
#   다음 평일 실행에서 확인 필요(§0-1 — 오프라인에서 workflow_run 이벤트를 만들 수 없음).
# =============================================================================

name: Duel Daily Batch (USD)

on:
  schedule:
    # 매일 03:00 UTC = KST 12:00(정오). 미국 수집 최악의 경우(08:05 KST)에서도 4시간 여유,
    # 다음 주문 접수 시작(16:00:01 KST)보다 4시간 앞서 끝납니다.
    # 🔴 (#204) 이 값은 더 이상 타이밍 추정이 아니라 **순수 안전망**입니다 — 평소엔 아래
    #    workflow_run 이 먼저 처리하고, 이 cron 은 게이트가 "처리 거래일 아직 미처리"라 할 때만 돕니다.
    - cron: "0 3 * * *"
  # (#204) 미국 종목 수집·미국 벤치마크 수집이 끝나면 곧바로. 둘 다 걸어 두고 게이트가 "둘 다
  # 들어왔고 아직 처리 전"일 때만 돌립니다 — 어느 쪽이 나중에 끝나든 그 완료가 실제 처리를 합니다.
  workflow_run:
    workflows: ["Daily US Stocks Scraper", "Daily Report Snapshots"]
    types: [completed]
  # 수동 실행. needs_review 로 보류된 날을 관리자가 확인한 뒤 결론 내릴 때도 씁니다.
  workflow_dispatch:
    inputs:
      target_date:
        description: "확정하려는 미국 거래일 (YYYY-MM-DD). 비우면 어제(한국 날짜)"
        required: false
        default: ""
      today_date:
        description: "정기입금 판정 기준 한국 날짜 (YYYY-MM-DD). 비우면 오늘"
        required: false
        default: ""
      override:
        description: "관리자 확인 후 판정 덮어쓰기 (fill = 정상이었다 / cancel = 실패였다)"
        required: false
        default: ""
        type: choice
        options: ["", "fill", "cancel"]
      dry_run:
        description: "저장하지 않고 계산만"
        required: false
        default: false
        type: boolean

# 기준값 파일(data/duel_freshness_probe_previous_usd.json)을 저장소에 되커밋하므로 쓰기 권한이
# 필요합니다. 그 외 권한은 주지 않습니다(최소 권한 — 원화 워크플로우와 같은 규율).
permissions:
  contents: write

# 같은 워크플로우가 겹쳐 돌면 같은 거래일을 두 번 처리하려다 서로의 커밋을 밀어냅니다.
concurrency:
  group: duel-daily-batch-usd
  cancel-in-progress: false

jobs:
  duel-batch-usd:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # (#204) workflow_run 으로 깨어났을 때만 거릅니다 — 앞 워크플로우가 성공으로 끝났고, 그
    # 실행이 자기 cron 또는 workflow_dispatch(수동·Worker) 였을 때. "오늘 값인가·이미 처리했나"는
    # 아래 게이트 단계가 데이터로 봅니다. cron·workflow_dispatch 로 직접 불렸을 땐 항상 참.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.event == 'schedule' || github.event.workflow_run.event == 'workflow_dispatch'))

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚦 크롤링 완료 게이트 (#204 — workflow_run·cron 만, 수동 실행은 항상 진행)
        id: gate
        if: github.event_name != 'workflow_dispatch'
        # workflow_run: 처리 거래일(어제, 한국 날짜)의 미국 종목 스냅샷(SUCCESS) + 벤치마크 두 지수
        # 종가가 모두 있고 아직 처리 전일 때만. cron(안전망): 아직 처리 전일 때만. 읽기 전용.
        run: |
          ROLE=event
          if [ "${{ github.event_name }}" = "schedule" ]; then ROLE=safety-net; fi
          python crawl_ready_gate.py duel-us --role "$ROLE"

      - name: 결투 USD 야간 배치 실행
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.ready == 'true'
        env:
          # 🔴 배치 전용 키. 원화 배치와 **같은 Supabase 프로젝트, 같은 service_role 키**를
          #    씁니다(두 번째 키를 만들지 않습니다 — utils/duel_db_usd.py 머리말 참고).
          #    사용자가 접속하는 앱 서버(Render)에는 절대 넣지 않습니다(§0-3-8).
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.target_date }}" ]; then
            ARGS="$ARGS --target-date ${{ github.event.inputs.target_date }}"
          fi
          if [ -n "${{ github.event.inputs.today_date }}" ]; then
            ARGS="$ARGS --today-date ${{ github.event.inputs.today_date }}"
          fi
          if [ -n "${{ github.event.inputs.override }}" ]; then
            ARGS="$ARGS --override ${{ github.event.inputs.override }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          echo "실행: python run_duel_daily_batch_us.py $ARGS"
          python run_duel_daily_batch_us.py $ARGS

      - name: 신선도 기준값 파일(USD) 커밋
        # 배치가 실패하면(비정상 종료) 여기까지 오지 않습니다 — 실패한 실행의 기준값을
        # 커밋해 다음 날 판정을 오염시키지 않기 위해서입니다.
        # (#204) 게이트가 건너뛴 실행은 배치도 안 돌았으니 커밋할 것도 없습니다 — 같은 조건.
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.ready == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/duel_freshness_probe_previous_usd.json
          if git diff --cached --quiet; then
            echo "기준값 변경 없음 — 커밋하지 않습니다."
            exit 0
          fi
          git commit -m "chore(duel): USD 신선도 점검 기준값 갱신 [skip ci]"
          # 같은 data/ 폴더를 다른 수집 워크플로우도 커밋하므로 push 가 거절될 수 있습니다.
          # 기존 워크플로우들과 같은 fetch+rebase 재시도 패턴(최대 3회).
          for attempt in 1 2 3; do
            if git push; then
              echo "push 성공 (시도 $attempt)"
              exit 0
            fi
            echo "push 거절 — fetch 후 rebase 재시도 ($attempt/3)"
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}" || exit 1
          done
          echo "❌ 3회 시도 후에도 push 하지 못했습니다."
          exit 1

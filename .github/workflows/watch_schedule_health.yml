# .github/workflows/watch_schedule_health.yml
# =============================================================================
# 🚨 예약 실행(schedule) 감시 워치독 — "크롤링이 조용히 안 도는" 상황을 감지
#
#   왜 필요한가 (2026-08-27~28 실측으로 알게 된 사실):
#     scrape.yml 의 schedule 트리거가 GitHub 쪽 사정으로 이틀 연속 문제가 있었습니다
#     (8/27: 11시간 넘게 늦게 발동, 8/28: 예정 시각을 6시간 넘게 넘겨도 발동 안 함).
#     원인은 GitHub Actions 스케줄러 자체의 지연/누락으로 보이고(GitHub 공식 문서에도
#     "높은 부하 시 지연될 수 있다"고 명시돼 있습니다), 저장소 설정으로 고칠 수 있는
#     문제가 아닙니다 — §0-1(추측 금지) 원칙에 따라 여기서 근본 원인을 안다고 주장하지
#     않습니다. 문제는 이걸 "듀얼게임 주문이 취소돼서" 우연히 알게 됐다는 점입니다.
#     그래서 매일 아침 한 번, 어제/오늘 예정이었던 자동 수집이 실제로 성공했는지 이
#     워크플로우가 대신 확인하고, 빠진 게 있으면 이슈를 만들어 알립니다.
#
#   확인 대상 (저장소의 schedule 트리거 워크플로우 중, 매일/평일 도는 "실데이터 수집·
#   집계" 성격의 것만 골랐습니다. 오너 확인 요청 — "scrape.yml 하나뿐이냐"는 질문에
#   대한 답으로 아래처럼 범위를 넓혔습니다):
#     · scrape.yml, scrape_us.yml, indicator_kr.yml, scrape_report_snapshots.yml,
#       duel_daily.yml — 평일에만 돕니다(주말엔 검사 자체를 건너뜁니다).
#     · duel_daily_us.yml, scorecard_publish_daily.yml, watch_dividend_disclosures.yml,
#       watch_dividend_payment_events.yml, watch_data_sanity.yml — 매일 돕니다.
#       (watch_data_sanity.yml 은 2026-09-03 추가 — 8/30 신설 당시 이 목록에 빠져 있어서,
#        그 워치독이 조용히 멈춰도 아무도 모르는 사각지대였습니다. 매일 09:30 KST 에 돌고
#        트리거가 schedule / workflow_dispatch(입력 없음)뿐이라 다른 daily 대상과 같은
#        규칙(30시간 창, `-f ref=main` 재실행)이 그대로 맞습니다.)
#
#   일부러 뺀 것:
#     · keep_awake.yml / render_keep_awake.yml — 데이터 수집이 아니라 단순 핑(ping)이라
#       실패해도 "느려질 뿐" 조용히 잘못된 판단으로 이어지지 않습니다. 주기도 너무 짧아
#       (8시간 / 10분 간격) "하루 한 번 확인"이라는 이 워치독 방식과 안 맞습니다.
#     · collect_dividend_kr.yml — 1년에 한 번(5월경)만 도는 스케줄이라 "오늘 안 돌았나?"
#       검사 자체가 의미 없습니다(365일 중 364일은 원래 안 돔). watch_dividend_
#       disclosures.yml 이 매일 도는 안전망 역할을 이미 하고 있습니다.
#
#   어떻게 확인하는가:
#     각 대상 워크플로우의 최근 실행 목록을 GitHub API 로 조회해서, "예상 창(window)"
#     안에 conclusion=success 인 실행이 하나라도 있는지 봅니다. 트리거 종류(event)는
#     가리지 않습니다 — 아래 자동 재실행이 성공한 경우 그건 workflow_dispatch 로 남기
#     때문에, event=schedule 만 세면 다음 날에도 "성공 없음"으로 잡혀 재실행을 매일
#     헛되이 반복하게 됩니다(2026-08-31 필터 제거). 평일 전용 워크플로우는 주말엔
#     건너뛰고, 월요일엔 지난 금요일 실행분까지 보이도록 창을
#     넓힙니다(주말 동안은 검사가 없었으므로).
#
#   🔴 2026-09-05 (#196) — "성공으로 끝났다"와 "데이터를 만들었다"는 다른 말입니다:
#     scrape.yml / indicator_kr.yml 은 2026-09-04 부터 `--skip-if-not-ready` 로 돕니다 —
#     "오늘 이미 SUCCESS 스냅샷이 있으면 아무것도 수집하지 않고 exit 0". 그런데 GitHub
#     자체 cron 이 09-04(금) 새벽 07:04 KST 에 늦게 발동해 저장한 "오늘자 SUCCESS"(내용은
#     목요일 종가) 때문에 그날 오후 정식 실행이 전부 건너뛰어졌고(#195), 그 건너뛴 실행이
#     conclusion=success 로 남았습니다. 이 워치독은 conclusion 만 봤으니 "✅ 성공 실행
#     확인됨"을 찍었고, 새 데이터가 하루 종일 하나도 안 만들어졌는데 아무 경고가 없었습니다.
#     그래서 이제 두 대상은 **담당 데이터 파일의 타임스탬프까지** 봅니다:
#       · scrape.yml       → data/kospi200_pegy_latest.json  의 metadata.last_updated_at
#       · indicator_kr.yml → data/indicator_kr_latest.json   의 generated_at
#     판정: 타임스탬프 날짜가 "기대 거래일"(지금이 평일 장마감 이후면 오늘, 아니면 가장
#     최근 평일)이고 **시각이 장마감(15:30 KST) 이후**여야 "데이터를 만들었다"로 칩니다.
#     시각 조건은 collector_kospi200.py::kr_snapshot_time_is_after_close() /
#     collector_indicator_kr.py::snapshot_time_is_after_close() 와 같은 규칙(15:30 정각
#     포함, `utils/constants.py` 의 KR_MARKET_CLOSE_HOUR/MINUTE)입니다 — 이 워크플로우는
#     저장소를 체크아웃하지 않아 그 모듈을 import 할 수 없으므로 아래 `KST_MARKET_CLOSE_MIN`
#     을 같은 값으로 두고, tests/test_watch_schedule_health_window.py 가 두 값이 같은지
#     파일에서 직접 읽어 검사합니다(어긋나면 빨간불). 데이터 파일은 GitHub Contents API
#     (`gh api -H "Accept: application/vnd.github.raw" .../contents/<path>?ref=main`)로
#     main 의 현재 내용을 받습니다 — 체크아웃 없이 파일 하나만 읽는 가장 가벼운 방법입니다.
#     "데이터 미갱신" 판정도 "실행 없음"과 똑같이 취급합니다 — 같은 자동 재실행(장중이면
#     생략)·같은 이슈/디스코드 알림·같은 잡 실패 처리. 재실행이 걸리는 18:00 KST 는 장마감
#     이후라, #195 로 고쳐진 수집기의 사전 점검이 "오늘자 SUCCESS 지만 장마감 이전 시각"을
#     보고 이번엔 실제로 수집합니다.
#
#   🔴 2026-09-05 (#199) — 데이터 갱신 확인을 나머지 대상으로 확장 (오너 요청):
#     "결과물 파일 + 그 안의 타임스탬프 + 언제까지 갱신됐어야 하는지 정할 근거" 세 가지가
#     **저장소 코드에서 그대로 확인되는** 대상만 넣었습니다. 판정 규칙은 5번째 필드로 고르고,
#     기준 시각은 새로 정하지 않고 그 수집기가 이미 쓰는 규칙을 그대로 옮겼습니다(§0-1):
#       · kr  — scrape.yml / indicator_kr.yml (위 #196 그대로: 기대 거래일 + 15:30 KST 이후)
#       · us  — scrape_us.yml → data/us_stocks_latest.json  의 metadata.last_updated_at_et
#               scrape_report_snapshots.yml → data/us_index_history.json 의 metadata.collected_at_et
#               두 수집기(collector_us_stocks.py / collector_us_indices.py)가 공유하는
#               `resolve_collection_session_et()` 규칙 그대로 — "어느 순간의 수집이 담는 거래일"은
#               그 순간(ET) 기준으로 **마감 16:00 ET + 30분(US_COLLECT_AFTER_CLOSE_MINUTES)이 지난
#               가장 최근 평일**. 타임스탬프 시각에 그 규칙을 적용해 얻은 거래일이, 지금(ET)에 같은
#               규칙을 적용해 얻은 거래일과 같아야 "데이터를 만들었다"입니다. 한국 시각이 아니라
#               ET(America/New_York, 서머타임 자동)로 판정하며, 파이썬 표준 zoneinfo 를 씁니다
#               (ubuntu 러너에 tzdata 있음 — 못 불러오면 "판정 불가 = 미갱신"으로 안전한 쪽).
#               상수는 utils/constants_us.py 의 US_MARKET_CLOSE_HOUR/MINUTE·US_COLLECT_AFTER_CLOSE_MINUTES
#               와 같은 값을 아래 `US_MARKET_CLOSE_MIN`/`US_COLLECT_AFTER_CLOSE_MINUTES` 에 두고
#               테스트가 대조합니다(KST_MARKET_CLOSE_MIN 과 같은 방식).
#               scrape_report_snapshots.yml 의 벤치마크 스텝은 `continue-on-error: true` 라 그 스텝이
#               죽어도 conclusion=success 입니다 — 바로 그래서 파일까지 봐야 하는 대상이고, 재실행이
#               같이 다시 돌리는 Supabase 스냅샷 적재는 upsert(user_id,market,snapshot_date)라 안전합니다.
#       · daily@HH:MM — watch_dividend_disclosures.yml → data/cache/dividend_kr_2026_watch_state.json,
#               watch_dividend_payment_events.yml → data/cache/dividend_kr_2026_payment_state.json
#               (둘 다 `updated_at_kst`). 두 감시기는 성공한 실행마다 "어제(KST)까지 확인함"을 이
#               상태 파일에 적고 워크플로우가 매번 커밋합니다(변경 없는 날이 없음 — updated_at_kst
#               가 매번 바뀜). 장마감 개념이 없으니 기준은 **그 워크플로우 자신의 cron(KST)**:
#               지금(KST)이 그 시각을 지났으면 오늘, 아니면 어제가 "기대 실행일"이고, 타임스탬프
#               날짜가 그 날이면 됩니다(시각 조건 없음 — 이 감시기는 언제 돌든 "어제까지"를 보므로
#               같은 날의 어느 시각이든 결과가 같습니다). 파일명의 연도(2026)는 그 워크플로우의
#               `--year 2026` 과 같은 값이어야 하며 테스트가 대조합니다.
#     일부러 넣지 않은 대상(종전대로 conclusion 만 봅니다 — 근거 없이 기준을 지어내지 않음):
#       · duel_daily.yml / duel_daily_us.yml — 결과(체결·취소·보류)는 Supabase 에만 기록되고,
#         git 에 남는 `data/duel_freshness_probe_previous*.json` 은 **내일 비교용 기준값(상태)**
#         파일입니다. 점검표를 못 만든 날은 예전 파일을 일부러 그대로 두는 것이 정상 동작이라
#         (run_duel_daily_batch.py ⑤), 그 파일이 안 바뀐 것을 "배치가 할 일을 안 했다"로 읽으면
#         오탐이고, 반대로 바뀌었다고 주문 처리가 됐다는 뜻도 아닙니다.
#       · scorecard_publish_daily.yml — `permissions: contents: read`, git 산출물이 없습니다(Supabase 만).
#       · watch_data_sanity.yml — 그 자체가 감시 스크립트이고 산출물이 없습니다(읽기만 함).
#       · render_keep_awake.yml / collect_dividend_kr.yml — 애초에 감시 대상이 아님(위 "일부러 뺀 것").
#
#   ⚠️ 한계 — 정직하게 밝혀둡니다:
#     이 워치독도 결국 GitHub Actions 의 schedule 로 도는 워크플로우입니다. 즉 이
#     워치독 자체가 같은 이유로 늦게 돌거나 아예 안 돌 가능성을 완전히 배제할 수는
#     없습니다. 다만 "우연히 알게 되는" 것보다는 훨씬 낫고, 서로 다른 시각에 도는
#     여러 워크플로우 중 하나라도 정상 발동했다면 이 워치독도 비슷한 시점에 같이
#     늦게라도 도는 경우가 많을 것으로 기대합니다. 100% 보장은 아니라는 점만 오너가
#     알고 있으면 됩니다.
#     또 하나 — "그날의 그 시각 tick이 정확히 발동했는지"가 아니라 "최근 window(평소
#     30시간, 월요일 76시간) 안에 성공 실행이 한 번이라도 있었는지"만 봅니다. 그래서
#     이론상 이틀 연속으로 tick 이 밀리면서 지연분이 마침 다음 날 window 안에 걸리는
#     경우, 그 다음 날의 "진짜 미발동"을 놓칠 가능성이 아주 낮게나마 있습니다. 데이터가
#     최근에 갱신됐는지가 우리에게 더 중요한 신호라 판단해 이렇게 설계했습니다.
#
#   🔴 2026-09-01 — "언제 재실행해도 안전한가"를 안 따진 설계 허점(오너 실전 발견):
#     어제(2026-08-31) 넣은 자동 재실행은 "빠진 걸 발견하면 그 자리에서 바로 다시 돌린다"
#     였는데, **그 '자리'가 하필 한국 증시 개장 시각이었습니다.** 이 워치독의 cron 이
#     00:00 UTC = 09:00 KST 였고, 그건 코스피 정규장 개장 정각입니다.
#
#     왜 그게 문제인가 — 대상 수집기 중 일부는 **"과거 특정 날짜"를 지정해 백필하는 기능이
#     아예 없습니다.** 저장소 코드를 직접 열어 확인한 사실입니다(추측 아님, §0-1):
#       · `collector_kospi200.py` — 날짜 인자가 없습니다(2026-09-04 추가된 `--skip-if-not-ready`
#         는 "오늘 이미 SUCCESS 면 건너뛰기" 스위치일 뿐 백필이 아님). 언제 돌리든 "지금 이
#         순간"의 시세만 긁습니다. `scrape.yml` 의 `target_date` 입력은 백필이 아니라
#         **이 스텝을 건너뛰는 스위치**입니다 (`if: ${{ github.event.inputs.target_date == '' }}`).
#       · `collector_indicator_kr.py` — 인자는 `--limit/--days/--delay`(+ 위와 같은
#         `--skip-if-not-ready`) 뿐이고, 기록되는 날짜는 `today_str = _now_kst()` 로
#         **실행 시각이 곧 날짜**입니다.
#         `--days` 는 지표 계산에 쓸 과거 시세를 몇 일치 받아올지일 뿐, "어느 날짜로
#         기록할지"를 바꾸지 못합니다.
#     그래서 장중에 자동 재실행이 걸리면 (a) 장 시작 직후의 어중간한 가격이 그날의 정상적인
#     종가인 것처럼 저장되고, (b) 정작 빠졌던 과거 날짜의 종가는 백필 수단이 없어 영영 못
#     채웁니다. 에러 없이 **틀린 값이 정상인 척 남는** 쪽이라 가장 나쁜 실패 모양입니다.
#
#     고친 방법 — 두 겹으로 막습니다(#183 때와 같은 벨트-앤-서스펜더):
#       (A) 이 워치독의 cron 을 09:00 KST → **18:00 KST(09:00 UTC)** 로 옮겼습니다.
#           · 장 마감(15:30 KST) 이후라 그 시점의 "현재 시세"는 여전히 종가 그대로입니다.
#           · 대상 10개의 그날 정규 스케줄 중 가장 늦은 것이 17:10 KST(duel_daily.yml)이라,
#             **그날 안 돈 것을 그날 저녁에** 잡아냅니다(예전엔 다음 날 09:00까지 기다려야
#             했습니다 — 오히려 대응이 빨라집니다).
#           · 10개 전부에 대해 "정상적으로 그날 스케줄대로 돌았다면 18:00 KST 체크 시점에
#             window(평소 30시간 / 월요일 76시간) 안에 들어오는가"를 요일별로 계산해
#             확인했습니다(가장 빡빡한 duel_daily.yml 도 그날치가 0.83시간 전이고, 설령
#             그게 아직 안 끝났어도 어제치가 24.83시간 전이라 30시간 안에 들어옵니다 —
#             즉 지연·진행중 때문에 오탐이 나지 않습니다).
#       (B) 그와 **별개로**, 자동 재실행을 걸기 직전에 "지금 한국 증시 장중(평일
#           09:00~15:30 KST)인가"를 한 번 확인해서, 장중이면 어떤 대상이든 재실행 POST 를
#           걸지 않고 건너뜁니다. (A)만으로는 오너가 수동 workflow_dispatch 로 장중에
#           이 워치독을 돌리는 경우(2026-09-01 실전 확인 때 실제로 있었던 일)를 못 막습니다.
#           ⚠️ 이 판단은 **그 순간 한 번 보고 끝**입니다 — 재시도 스케줄링이나 상태 파일을
#              만들지 않습니다(그러면 감시의 감시가 됩니다). 어차피 다음 날 18:00 KST 에
#              이 워치독이 다시 돌면서 같은 판정을 한 번 더 합니다.
#           ⚠️ 공휴일은 판정하지 않습니다 — 휴장일 표를 코드에 넣으면 매년 틀리고(§0-1),
#              휴장일에 재실행을 한 번 건너뛰는 것은 "안전한 쪽으로 틀리는" 방향이라
#              그대로 둡니다(다음 날 다시 시도합니다).
#
#   알림 방식:
#     감시에서 빠진 게 발견되면 먼저 (0) 그 워크플로우를 workflow_dispatch 로 **딱 한 번**
#     자동 재실행합니다(2026-08-31 추가 — 오너가 폰을 못 보는 동안 지연이 겹치면 데이터가
#     며칠씩 밀리기 때문). 재실행 성공 여부를 다시 확인하는 별도 장치는 두지 않습니다 —
#     그러면 감시의 감시가 되고, 어차피 다음 날 이 워치독이 또 돌면서 한 번 더 시도합니다.
#     진짜 수집기 버그(외부 사이트 구조 변경 등)는 utils/data_sanity.py·DataValidator·
#     화면 에러 배너 같은 기존 방어선의 몫입니다. 그리고 (1) 이슈를 만들고 오너를
#     assignee 로 지정 — GitHub 기본 알림 설정상 assignee 로 지정되면 이메일이
#     갑니다(오너 쪽 알림 설정을 끄지
#     않았다면). (2) 저장소에 `DISCORD_WEBHOOK_URL` 시크릿이 등록돼 있으면 디스코드
#     채널로도 같은 내용을 보냅니다(2026-08-28 오너 요청 — 이메일보다 실시간 푸시가
#     더 확실하게 눈에 띄어서 추가). 시크릿이 없으면 이 단계는 조용히 건너뜁니다 —
#     필수는 아님. (3) 이 워치독 잡 자체도 실패(exit 1) 처리해서 Actions 탭에 빨간
#     X 로 남습니다.
#
#   비밀키: 기본 GITHUB_TOKEN 만으로도 동작합니다(같은 저장소의 Actions 실행 목록
#   조회 + 자동 재실행 + 이슈 생성). 다만 자동 재실행 때문에 permissions 의
#   actions 가 read 가 아니라 **write** 여야 합니다(2026-08-31).
#   `DISCORD_WEBHOOK_URL`(저장소 Settings → Secrets and variables → Actions)은
#   선택 사항 — 등록해두면 디스코드 알림이 추가로 갑니다.
#   디스코드 웹훅 URL 자체가 비밀 값이라 반드시 시크릿으로만 등록해야 합니다(코드에
#   하드코딩 금지).
# =============================================================================

name: Schedule Health Watch

on:
  workflow_dispatch: {}

  # 매일 09:00 UTC = KST 18:00 (2026-09-01 변경 — 위 🔴 문단 (A) 참고).
  #   · 한국 증시 마감(15:30 KST) 이후라, 여기서 자동 재실행이 걸려도 그 수집기가 긁는
  #     "지금 이 순간"의 시세가 그날 종가 그대로입니다.
  #   · 대상 10개의 그날 정규 스케줄이 전부 지난 뒤입니다(가장 늦은 것: 17:10 KST 인
  #     duel_daily.yml). 그래서 "그날 안 돈 것"을 다음 날이 아니라 그날 저녁에 잡습니다.
  #   ⚠️ 예전 값(00:00 UTC = 09:00 KST)은 하필 코스피 개장 정각이었습니다 — 그게 이번에
  #      고친 바로 그 허점입니다. 이 값을 다시 앞당길 때는 반드시 "그 시각이 장중인가"를
  #      먼저 따지세요. (tests/test_watch_schedule_health_window.py 가 이 cron 값을
  #      파일에서 직접 읽어 장중이 아닌지 검사합니다 — 되돌리면 테스트가 빨간불입니다.)
  schedule:
    - cron: '0 9 * * *'

permissions:
  contents: read
  # actions: write — 확인 목적의 실행 목록 조회(read)뿐 아니라, 빠진 대상을 다시 돌리기
  # 위한 workflow_dispatch API 호출(POST .../dispatches)에 쓰기 권한이 필요합니다.
  actions: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 감시대상 스케줄 확인
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # 파일명|weekdays 또는 daily|데이터 파일(선택)|그 파일의 타임스탬프 JSON 키(선택, 점 구분)|판정 규칙(선택)
          #   (위 헤더 코멘트의 "확인 대상" 목록과 동일. 3·4번째 필드가 있는 대상은 실행 결과에
          #    더해 그 데이터 파일이 실제로 갱신됐는지까지 봅니다 — 2026-09-05 #196 문단 참고.)
          #   5번째 필드 = 판정 규칙(2026-09-05 #199 — 헤더 🔴 #199 문단 참고). 비우면 kr.
          #     kr           : 기대 거래일(KST) + 장마감 15:30 KST 이후
          #     us           : 타임스탬프(ET)가 담는 거래일 == 지금(ET)이 담는 거래일 (마감+30분 ET 규칙)
          #     daily@HH:MM  : 타임스탬프 날짜(KST) == 기대 실행일 (그 워크플로우 cron 의 KST 시각 기준)
          #   daily 의 HH:MM 은 그 워크플로우 schedule cron 을 KST 로 옮긴 값입니다(20:00 UTC → 05:00,
          #   20:30 UTC → 05:30). 테스트가 각 대상 워크플로우의 cron 과 대조합니다.
          TARGETS="scrape.yml|weekdays|data/kospi200_pegy_latest.json|metadata.last_updated_at|kr
          scrape_us.yml|weekdays|data/us_stocks_latest.json|metadata.last_updated_at_et|us
          indicator_kr.yml|weekdays|data/indicator_kr_latest.json|generated_at|kr
          scrape_report_snapshots.yml|weekdays|data/us_index_history.json|metadata.collected_at_et|us
          duel_daily.yml|weekdays
          duel_daily_us.yml|daily
          scorecard_publish_daily.yml|daily
          watch_dividend_disclosures.yml|daily|data/cache/dividend_kr_2026_watch_state.json|updated_at_kst|daily@05:00
          watch_dividend_payment_events.yml|daily|data/cache/dividend_kr_2026_payment_state.json|updated_at_kst|daily@05:30
          watch_data_sanity.yml|daily"

          NOW_TS=$(date -u +%s)
          DOW_KST=$(TZ=Asia/Seoul date +%u)   # 1=월 ... 7=일

          # ── 지금이 한국 증시 정규장 시간대인가 (2026-09-01 추가 — 위 🔴 문단 (B)) ──────
          # 정규장은 평일 09:00~15:30 KST 입니다. 이 값이 true 면 아래에서 **어떤 대상이든**
          # 자동 재실행(dispatches POST)을 걸지 않습니다.
          #
          # 왜 `date` 를 한 번 더 부르지 않고 위 NOW_TS 에서 계산하는가:
          #   "지금"의 출처를 하나로 둬야 판정이 서로 어긋나지 않습니다(자정 근처에서 두 번
          #   읽으면 날짜와 시각이 다른 순간을 가리킬 수 있습니다). 한국은 1988년 이후
          #   서머타임이 없어 KST = UTC+9 가 연중 고정이므로, 초 단위 epoch 에 32400(9시간)을
          #   더해 그날의 '분'으로 환산하는 것으로 충분합니다(§0-1 — 추측이 아니라 확정된 사실).
          #   ⚠️ 공휴일(휴장일)은 판정하지 않습니다 — 위 헤더의 마지막 ⚠️ 참고.
          KST_MINUTE_OF_DAY=$(( ( (NOW_TS + 32400) % 86400 ) / 60 ))
          KST_MARKET_OPEN_MIN=540    # 09:00
          KST_MARKET_CLOSE_MIN=930   # 15:30 (종가가 확정되는 순간이라 경계도 '장중'으로 봅니다)
          # ⚠️ 위 값은 utils/constants.py 의 KR_MARKET_CLOSE_HOUR*60 + KR_MARKET_CLOSE_MINUTE 와
          #    같아야 합니다 — 아래 "데이터 갱신 확인"(2026-09-05)이 수집기와 같은 장마감 기준을
          #    쓰기 위해서입니다. tests/test_watch_schedule_health_window.py 가 두 값을 대조합니다.
          #
          # ── 미국 쪽 기준(2026-09-05 #199, 판정 규칙 us) — utils/constants_us.py 와 같은 값 ─────
          #   US_MARKET_CLOSE_MIN            = US_MARKET_CLOSE_HOUR*60 + US_MARKET_CLOSE_MINUTE (16:00 ET)
          #   US_COLLECT_AFTER_CLOSE_MINUTES = US_COLLECT_AFTER_CLOSE_MINUTES (마감 뒤 데이터 정리 30분)
          #   → US_COLLECT_READY_MIN = 16:30 ET. collector_us_stocks.py::resolve_collection_session_et() 가
          #     "지금 수집하면 담기는 거래일"을 정할 때 쓰는 바로 그 경계이고, collector_us_indices.py 도
          #     같은 함수를 씁니다. 테스트가 세 값을 상수 파일에서 직접 읽어 대조합니다(어긋나면 빨간불).
          #   ⚠️ 분 단위 값은 ET **벽시계** 기준입니다 — 서머타임(EDT/EST) 환산은 아래 파이썬이 zoneinfo 로 합니다.
          US_MARKET_CLOSE_MIN=960             # 16:00 ET
          US_COLLECT_AFTER_CLOSE_MINUTES=30
          US_COLLECT_READY_MIN=$(( US_MARKET_CLOSE_MIN + US_COLLECT_AFTER_CLOSE_MINUTES ))   # 16:30 ET
          if [ "$DOW_KST" -le 5 ] \
             && [ "$KST_MINUTE_OF_DAY" -ge "$KST_MARKET_OPEN_MIN" ] \
             && [ "$KST_MINUTE_OF_DAY" -le "$KST_MARKET_CLOSE_MIN" ]; then
            MARKET_HOURS=true
          else
            MARKET_HOURS=false
          fi
          printf 'ℹ️  현재 %02d:%02d KST (요일 %s) — 한국 증시 장중 여부: %s\n' \
            "$(( KST_MINUTE_OF_DAY / 60 ))" "$(( KST_MINUTE_OF_DAY % 60 ))" "$DOW_KST" "$MARKET_HOURS"

          if [ "$DOW_KST" = "1" ]; then
            WEEKDAY_WINDOW_HOURS=76           # 월요일엔 지난 금요일 실행분까지 봐야 함
          else
            WEEKDAY_WINDOW_HOURS=30
          fi
          DAILY_WINDOW_HOURS=30

          FAILED_LIST=""

          while IFS='|' read -r FILE KIND DATA_FILE STAMP_KEY RULE; do
            [ -z "$FILE" ] && continue

            if [ "$KIND" = "weekdays" ] && { [ "$DOW_KST" = "6" ] || [ "$DOW_KST" = "7" ]; }; then
              echo "⏭  $FILE — 주말이라 이번 검사에서 건너뜁니다."
              continue
            fi

            if [ "$KIND" = "weekdays" ]; then
              WINDOW_HOURS=$WEEKDAY_WINDOW_HOURS
            else
              WINDOW_HOURS=$DAILY_WINDOW_HOURS
            fi

            # 2026-08-30 실전 확인 중 발견한 버그(오너 실측) — 아래처럼 `cmd1 || cmd2` 형태로
            # 한 줄에 쓰면, `gh api`가 실패하면서 stderr가 아니라 **stdout에** 에러 응답 몸통을
            # 이미 찍어 놓은 경우(관측됨 — 존재하지 않는 워크플로우 파일명으로 호출 시) `2>/dev/null`
            # 은 그 stdout 출력을 못 막고, 뒤이어 `|| echo` 의 출력까지 **이어 붙어서** RESP가
            # JSON 두 덩어리가 연달아 붙은 문자열이 됩니다 — 그러면 아래 python `json.load`가
            # `JSONDecodeError: Extra data`로 죽고, 잡 전체가 예외로 멈춰 **has_failures 출력
            # 자체가 안 만들어져서 이슈 생성 단계로 아예 못 넘어갑니다**(워치독이 조용히 실패).
            # if/else 로 나눠 실패 시 RESP를 통째로 덮어써서 이 이어붙기 자체를 막습니다.
            #
            # 2026-08-31 — 쿼리에서 `event=schedule` 필터를 뺐습니다. 아래에서 빠진 대상을
            # 자동 재실행(workflow_dispatch)하게 되면서, 그 재실행이 성공해도 event 가
            # `workflow_dispatch` 라 schedule 만 보는 필터에는 안 잡히고, 그러면 다음 날에도
            # "여전히 성공 없음"으로 판정돼 **매일 헛되이 재실행을 반복**하게 됩니다. 대상
            # 10개는 schedule / workflow_dispatch(그리고 duel_daily.yml 은 scrape.yml 완료를
            # 받는 workflow_run) 외의 트리거가 없어서, 필터를 빼도 무관한 이벤트가 섞여 들어와
            # 오탐이 생길 여지는 없습니다. 우리가 알고 싶은 건 "그날 그 수집이 실제로 돌았는가"
            # 이지 "어느 트리거로 돌았는가"가 아닙니다.
            if ! RESP=$(gh api "repos/${REPO}/actions/workflows/${FILE}/runs?per_page=5" 2>/dev/null); then
              RESP='{"workflow_runs":[]}'
            fi

            LATEST_OK=$(echo "$RESP" | python3 -c '
          import json, sys, datetime
          now = int(sys.argv[1])
          window = int(sys.argv[2]) * 3600
          # 방어적 파싱(2중 안전장치) — 위 bash 쪽 수정으로 RESP가 더는 두 JSON이 이어붙은
          # 모양이 되지는 않지만, 혹시 모를 다른 경로로 RESP가 유효한 JSON이 아니게 되는
          # 경우에도 워치독 자체가 예외로 죽어 이슈 생성 단계를 통째로 건너뛰지 않도록,
          # "파싱 실패 = 확인 못 함 = 실행 기록 없음"으로 안전한 쪽(no)으로 처리합니다.
          try:
              data = json.loads(sys.stdin.read())
          except json.JSONDecodeError:
              data = {}
          if not isinstance(data, dict):
              data = {}
          found = False
          for run in data.get("workflow_runs", []):
              created = datetime.datetime.strptime(run["created_at"], "%Y-%m-%dT%H:%M:%SZ").replace(tzinfo=datetime.timezone.utc).timestamp()
              if now - created <= window and run.get("conclusion") == "success":
                  found = True
                  break
          print("yes" if found else "no")
          ' "$NOW_TS" "$WINDOW_HOURS")

            # ── 2026-09-05 (#196): 성공 실행이 있어도 "실제로 새 데이터를 만들었는가" ────────
            # 3·4번째 필드가 있는 대상은 main 의 데이터 파일을 받아 타임스탬프를 봅니다.
            # `--skip-if-not-ready` 로 아무것도 안 하고 exit 0 한 실행도 conclusion=success 라,
            # 실행 결과만으로는 "데이터가 안 만들어진 하루"를 못 잡기 때문입니다(위 헤더 🔴
            # 2026-09-05 문단). 실행 기록 자체가 없으면 어차피 재실행 대상이므로 파일을 받지
            # 않습니다. 판정 규칙(kr / us / daily@HH:MM)은 5번째 필드 — #199 문단 참고.
            DATA_FRESH=yes
            DATA_NOTE=""
            if [ "$LATEST_OK" = "yes" ] && [ -n "${DATA_FILE:-}" ]; then
              # 실패(404·권한·네트워크)하면 빈 문자열 → 아래 판정이 "타임스탬프 없음 = 갱신
              # 확인 못 함 = 미갱신"으로 안전한 쪽(no)으로 처리합니다(RESP 와 같은 if/else 꼴 —
              # `cmd || echo` 한 줄 형태가 stdout 을 이어 붙이는 문제는 위 주석 참고).
              if ! DATA_JSON=$(gh api -H "Accept: application/vnd.github.raw" \
                    "repos/${REPO}/contents/${DATA_FILE}?ref=main" 2>/dev/null); then
                DATA_JSON=''
              fi
              DATA_VERDICT=$(printf '%s' "$DATA_JSON" | python3 -c '
          import json, sys, re, datetime
          # 인자: NOW_TS(epoch 초) / 타임스탬프 키(점 구분) / 판정 규칙(kr | us | daily@HH:MM, 빈 값=kr)
          #       / 한국 장마감 분(KST_MARKET_CLOSE_MIN) / 미국 수집 가능 분(US_COLLECT_READY_MIN, ET 벽시계)
          # stdout: 1행 "yes"|"no", 2행 사람이 읽는 사유(로그·이슈 본문에 그대로 실림).
          now = int(sys.argv[1])
          key = sys.argv[2]
          rule = sys.argv[3] or "kr"
          close_min = int(sys.argv[4])
          us_ready_min = int(sys.argv[5])
          KST = datetime.timezone(datetime.timedelta(hours=9))

          def verdict(ok, note):
              print("yes" if ok else "no")
              print(note)
              sys.exit(0)

          try:
              data = json.loads(sys.stdin.read())
          except Exception:
              data = None
          stamp = data
          for part in key.split("."):
              stamp = stamp.get(part) if isinstance(stamp, dict) else None
          # 타임스탬프 앞부분 "YYYY-MM-DD HH:MM" / "YYYY-MM-DDTHH:MM..." 만 읽습니다. 뒤에 초·시간대
          # 오프셋이 붙어 있어도(예: 2026-09-04T21:04:52-04:00) 그 벽시계 값이 곧 그 시장의 시각입니다
          # (kr/daily 는 KST 로, us 는 ET 로 적힌 값 — 각 수집기가 그 시간대의 now 로 적습니다).
          m = (re.match(r"^(\d{4}-\d{2}-\d{2})[ T](\d{1,2}):(\d{2})", stamp.strip())
               if isinstance(stamp, str) else None)
          if m is None:
              verdict(False, f"데이터 파일의 타임스탬프({key})를 읽지 못함(파일을 못 받았거나 형식이 다름): {str(stamp)[:60]!s}")
          stamp_date, hh, mm = m.group(1), int(m.group(2)), int(m.group(3))
          try:
              stamp_day = datetime.date.fromisoformat(stamp_date)
          except ValueError:
              stamp_day = None
          if stamp_day is None or not (0 <= hh <= 23 and 0 <= mm <= 59):
              verdict(False, f"데이터 파일의 타임스탬프({key}) 시각이 비정상: {stamp_date} {hh}:{mm}")

          if rule == "kr":
              # ── #196 그대로 ─────────────────────────────────────────────────────────
              # 기대 거래일: 지금이 평일이고 장마감(close_min) 이후면 오늘, 아니면 가장 최근 평일.
              # (18:00 KST 정규 발동이면 항상 오늘. 사람이 장 마감 전에 수동으로 돌리면 어제 평일.)
              # 공휴일은 판정하지 않습니다 — 헤더의 ⚠️ 참고(휴장일 표 하드코딩 금지, §0-1).
              kst_now = datetime.datetime.fromtimestamp(now, KST)
              expected = kst_now.date()
              if not (expected.isoweekday() <= 5 and kst_now.hour * 60 + kst_now.minute >= close_min):
                  expected -= datetime.timedelta(days=1)
              while expected.isoweekday() > 5:
                  expected -= datetime.timedelta(days=1)
              close_label = f"{close_min // 60:02d}:{close_min % 60:02d}"
              if stamp_date != expected.isoformat():
                  verdict(False, f"데이터 기준 {stamp_date} {hh:02d}:{mm:02d} KST — 기대 거래일 {expected.isoformat()}(장마감 {close_label} 이후)의 데이터가 아님")
              if hh * 60 + mm < close_min:
                  # 수집기의 kr_snapshot_time_is_after_close()/snapshot_time_is_after_close() 와 같은
                  # 규칙 — 장마감 정각(15:30)은 "이후"로 칩니다. 이 분기가 #195 사고(07:04 SUCCESS)의 모양입니다.
                  verdict(False, f"데이터 기준 {stamp_date} {hh:02d}:{mm:02d} KST — 날짜는 오늘이지만 장마감 {close_label} 이전 시각(장 시작 전·장중 값)")
              verdict(True, f"데이터 기준 {stamp_date} {hh:02d}:{mm:02d} KST — 거래일 {expected.isoformat()} 장마감 이후")

          if rule == "us":
              # ── #199: collector_us_stocks.py::resolve_collection_session_et() 규칙 그대로 ────
              # "어느 순간에 수집하면 어느 거래일을 담는가" = 그 순간(ET) 기준으로 마감+30분
              # (us_ready_min)이 지난 가장 최근 평일. 타임스탬프 순간의 거래일이 지금의 거래일과
              # 같으면 갱신된 것입니다. 날짜 == 오늘 식의 비교를 안 쓰는 이유: 미국 수집은 ET 저녁
              # (= KST 다음 날 새벽)에 돌고, 빠진 날을 사람이 KST 낮에 다시 돌리면 타임스탬프 날짜는
              # 다음 ET 날짜(마감 전 시각)가 되지만 담긴 종가는 여전히 직전 거래일 것이라 정상입니다
              # — 수집기 자신이 그렇게 판정하므로 여기서도 같은 함수를 씁니다.
              # 미국 휴장일도 판정하지 않습니다(수집기와 같은 한계 — 헤더 ⚠️ 참고).
              try:
                  import zoneinfo
                  ET = zoneinfo.ZoneInfo("America/New_York")
              except Exception as exc:
                  verdict(False, f"미국 동부 시간대(America/New_York) 정보를 불러오지 못해 판정 불가: {type(exc).__name__}: {exc}")

              def session_of(moment_et):
                  probe = moment_et.date()
                  while True:
                      ready = datetime.datetime(probe.year, probe.month, probe.day,
                                                us_ready_min // 60, us_ready_min % 60, tzinfo=ET)
                      if probe.isoweekday() <= 5 and moment_et >= ready:
                          return probe
                      probe -= datetime.timedelta(days=1)

              now_et = datetime.datetime.fromtimestamp(now, ET)
              expected = session_of(now_et)
              stamp_et = datetime.datetime(stamp_day.year, stamp_day.month, stamp_day.day, hh, mm, tzinfo=ET)
              got = session_of(stamp_et)
              ready_label = f"{us_ready_min // 60:02d}:{us_ready_min % 60:02d}"
              if got != expected:
                  verdict(False, f"데이터 기준 {stamp_date} {hh:02d}:{mm:02d} ET — 그 시각의 수집이 담는 거래일은 {got.isoformat()}(마감+30분 {ready_label} ET 규칙), 기대 거래일 {expected.isoformat()}의 데이터가 아님")
              verdict(True, f"데이터 기준 {stamp_date} {hh:02d}:{mm:02d} ET — 거래일 {expected.isoformat()} 마감+30분({ready_label} ET) 이후")

          dm = re.match(r"^daily@(\d{2}):(\d{2})$", rule)
          if dm and int(dm.group(1)) <= 23 and int(dm.group(2)) <= 59:
              # ── #199: 장마감 개념이 없는 매일 실행 대상 — 그 워크플로우 cron(KST) 기준 ───────
              # 기대 실행일: 지금(KST)이 cron 시각을 지났으면 오늘, 아니면 어제. 타임스탬프 날짜가
              # 그 날이면 갱신된 것이고 시각은 보지 않습니다(배당 감시기는 언제 돌든 "어제까지"를
              # 확인하므로 같은 날의 어느 시각이든 결과가 같습니다 — collector_dividend_kr.py /
              # collector_dividend_payment_kr.py 의 `end_date = today - 1일`).
              deadline_min = int(dm.group(1)) * 60 + int(dm.group(2))
              deadline_label = f"{dm.group(1)}:{dm.group(2)}"
              kst_now = datetime.datetime.fromtimestamp(now, KST)
              expected = kst_now.date()
              if kst_now.hour * 60 + kst_now.minute < deadline_min:
                  expected -= datetime.timedelta(days=1)
              if stamp_day != expected:
                  verdict(False, f"데이터 기준 {stamp_date} {hh:02d}:{mm:02d} KST — 기대 실행일 {expected.isoformat()}(예약 {deadline_label} KST)의 결과가 아님")
              verdict(True, f"데이터 기준 {stamp_date} {hh:02d}:{mm:02d} KST — 기대 실행일 {expected.isoformat()}(예약 {deadline_label} KST)의 결과")

          verdict(False, f"알 수 없는 판정 규칙({rule!r}) — TARGETS 5번째 필드를 확인하세요")
          ' "$NOW_TS" "$STAMP_KEY" "${RULE:-kr}" "$KST_MARKET_CLOSE_MIN" "$US_COLLECT_READY_MIN")
              DATA_FRESH=$(printf '%s\n' "$DATA_VERDICT" | sed -n 1p)
              DATA_NOTE=$(printf '%s\n' "$DATA_VERDICT" | sed -n 2p)
            fi

            # 이슈 본문 항목 앞에 붙는 설명. "실행 없음"은 예전 그대로 빈 문자열(문구 불변).
            STALE_TAG=""
            if [ "$LATEST_OK" = "yes" ] && [ "$DATA_FRESH" = "yes" ]; then
              if [ -n "${DATA_FILE:-}" ]; then
                echo "✅ $FILE — 최근 ${WINDOW_HOURS}시간 내 성공 실행 확인됨 + ${DATA_FILE} 갱신 확인(${DATA_NOTE})."
              else
                echo "✅ $FILE — 최근 ${WINDOW_HOURS}시간 내 성공 실행 확인됨."
              fi
            else
              if [ "$LATEST_OK" = "yes" ]; then
                echo "❌ $FILE — 실행은 성공(conclusion=success)으로 끝났지만 ${DATA_FILE} 이 갱신되지 않음: ${DATA_NOTE}"
                STALE_TAG="실행은 성공했지만 데이터 미갱신: ${DATA_NOTE}; "
              else
                echo "❌ $FILE — 최근 ${WINDOW_HOURS}시간 내 성공 실행 기록 없음!"
              fi
              # 발견 즉시 그 자리에서 딱 한 번 재실행을 걸어 둡니다(§0-3-2 — 사람이 폰을 못
              # 보는 동안 데이터가 며칠씩 밀리는 걸 막는 게 목적). 대상 10개 모두
              # workflow_dispatch 트리거가 있고 입력값은 전부 선택(기본값 있음)이라
              # `-f ref=main` 만으로 트리거됩니다.
              # 재실행이 진짜 성공했는지까지 여기서 다시 확인하지는 **않습니다** — 그건 감시의
              # 감시가 되고, 어차피 내일 이 워치독이 다시 돌면서 같은 판정을 한 번 더 합니다.
              # 재시도 횟수를 세는 상태 파일도 두지 않습니다(하루 한 번이 곧 재시도 주기).
              #
              # 2026-09-01 — 재실행을 걸기 **직전에** 장중인지 한 번 봅니다. 장중이면 어떤
              # 대상이든 트리거하지 않습니다: 대상 수집기 중 collector_kospi200.py 와
              # collector_indicator_kr.py 는 "지금 이 순간"의 시세만 가져올 수 있어서
              # (백필 인자가 아예 없습니다 — 위 헤더 🔴 문단 참고), 장중에 돌리면 장중
              # 가격이 그날 종가인 것처럼 저장됩니다. 나머지 7개는 그 정도로 위험하지는
              # 않지만(예: 배당 감시 2종은 DART 접수일 기준으로 스스로 따라잡고,
              # collector_us_stocks.py 는 `--skip-if-not-ready` 로 스스로 막습니다), 대상별로
              # 예외를 두면 "어느 게 안전한지"를 매번 다시 판단해야 하므로 **전부 똑같이**
              # 건너뜁니다(§0-3-2 — 안전한 쪽이 기본값).
              if [ "$MARKET_HOURS" = "true" ]; then
                echo "⏸  $FILE — 지금은 한국 증시 장중(평일 09:00~15:30 KST)이라 자동 재실행을 생략합니다."
                FAILED_LIST="${FAILED_LIST}- ${FILE} (${STALE_TAG}장중이라 자동 재실행 생략 — 장 마감 후 이 워치독이 다시 확인합니다)\n"
              elif gh api -X POST "repos/${REPO}/actions/workflows/${FILE}/dispatches" -f ref=main >/dev/null 2>&1; then
                echo "🔁 $FILE — 자동 재실행 트리거 성공."
                FAILED_LIST="${FAILED_LIST}- ${FILE} (${STALE_TAG}자동 재실행 트리거함)\n"
              else
                echo "⚠️ $FILE — 자동 재실행 트리거 실패! 수동 확인 필요."
                FAILED_LIST="${FAILED_LIST}- ${FILE} (${STALE_TAG}자동 재실행도 실패 — 수동 확인 필요)\n"
              fi
            fi
          done <<< "$TARGETS"

          # 이슈 본문에서 "왜 재실행을 안 걸었는지"를 설명하려면 이 값이 필요합니다.
          # 실패가 없어도 항상 내보냅니다(뒤 스텝이 빈 값을 만나 조용히 갈라지지 않도록).
          echo "market_hours=$MARKET_HOURS" >> "$GITHUB_OUTPUT"

          if [ -n "$FAILED_LIST" ]; then
            echo "has_failures=true" >> "$GITHUB_OUTPUT"
            {
              echo "failed_list<<GHOUTPUT_EOF"
              echo -e "$FAILED_LIST"
              echo "GHOUTPUT_EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "has_failures=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 이슈로 알림 + 잡 실패 처리
        if: steps.check.outputs.has_failures == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          FAILED: ${{ steps.check.outputs.failed_list }}
          MARKET_HOURS: ${{ steps.check.outputs.market_hours }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          TITLE="⚠️ 예약 실행 누락 감지 — $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST"

          # 세 번째 케이스(2026-09-01) — 장중이라 재실행을 **아예 걸지 않은** 경우.
          # 기존 두 케이스('자동 재실행 트리거함' / '자동 재실행도 실패')와 달리 이건
          # 우리가 일부러 안 건 것이므로, 그 이유와 다음에 무슨 일이 일어나는지를 본문에
          # 명시합니다(사람이 "왜 아무것도 안 했지?"로 읽지 않도록 — §0-1).
          MARKET_NOTE=""
          if [ "${MARKET_HOURS:-false}" = "true" ]; then
            MARKET_NOTE="⏸ **지금은 한국 증시 장중(평일 09:00~15:30 KST)이라 자동 재실행을 생략했습니다.**
          '장중이라 자동 재실행 생략'으로 적힌 항목은 트리거를 아예 걸지 않았습니다 — 코스피
          수집기(collector_kospi200.py)와 보조지표 수집기(collector_indicator_kr.py)는 '지금 이
          순간'의 시세만 가져올 수 있고 과거 날짜를 지정하는 백필 기능이 없어서, 장중에 다시
          돌리면 장중 가격이 그날 종가인 것처럼 저장되기 때문입니다. 다음 안전한 시각(장 마감
          후 18:00 KST)에 이 워치독이 다시 확인하면서 그때 재실행을 겁니다. 그때까지 기다릴 수
          없다면 Actions 탭에서 직접 workflow_dispatch 로 실행하세요.
          "
          fi

          BODY="다음 워크플로우가 예상 시간 안에 **성공** 실행된 기록이 없거나, 성공으로
          끝났는데도 담당 데이터 파일이 갱신되지 않았습니다('실행은 성공했지만 데이터 미갱신'
          으로 적힌 항목 — \`--skip-if-not-ready\` 로 아무것도 수집하지 않고 exit 0 한 실행도
          conclusion=success 로 남기 때문에, 2026-09-05 부터 데이터 파일의 타임스탬프까지
          확인합니다). 각 항목 뒤에 자동 재실행(workflow_dispatch)을 걸어 봤는지, 그 트리거
          자체가 됐는지를 적어 뒀습니다:

          ${FAILED}

          ${MARKET_NOTE}
          재실행을 **건 항목은 걸어만 둔** 상태입니다 — 그게 실제로 성공했는지는 확인하지 않았으니
          Actions 탭에서 결과를 직접 봐 주세요. 특히 이번 누락이 GitHub 스케줄러 지연
          때문인지(재실행이 그대로 성공했을 가능성이 큼), 아니면 수집기 자체가 깨진
          것인지(예: 외부 사이트 구조 변경 — 재실행도 같은 이유로 실패)는 여전히 사람이
          구분해야 합니다. '자동 재실행도 실패'로 적힌 항목은 트리거 API 호출조차 실패한
          경우라 더 급합니다. 이 이슈는 watch_schedule_health.yml 이 자동 생성했습니다."

          gh issue create --repo "$REPO" --title "$TITLE" --body "$BODY" --assignee moonbear135

          # 디스코드 웹훅이 등록돼 있으면 같은 내용을 채널에도 보냄(선택 사항 —
          # 시크릿이 없으면 이 블록은 조용히 건너뜀). 실패해도 위 이슈 생성/잡 실패
          # 처리는 이미 끝났으니 워크플로우 전체를 막지 않음(|| true).
          if [ -n "${DISCORD_WEBHOOK_URL:-}" ]; then
            DISCORD_MSG=$(printf '⚠️ **예약 실행 누락 감지** (%s KST)\n\n%s\n자세한 내용: https://github.com/%s/issues' \
              "$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')" "$FAILED" "$REPO")
            PAYLOAD=$(python3 -c '
          import json, sys
          print(json.dumps({"content": sys.argv[1]}))
          ' "$DISCORD_MSG")
            curl -s -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK_URL" >/dev/null \
              && echo "✅ 디스코드 알림 전송됨" \
              || echo "⚠️ 디스코드 알림 전송 실패(이메일/이슈 알림은 이미 처리됐으니 계속 진행)"
          fi

          echo "::error::예약 실행이 안 된 워크플로우가 있어 이 잡을 실패 처리합니다(Actions 탭에서 바로 보이도록)."
          exit 1

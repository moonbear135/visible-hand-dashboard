# .github/workflows/watch_schedule_health.yml
# =============================================================================
# 🚨 예약 실행(schedule) 감시 워치독 — "크롤링이 조용히 안 도는" 상황을 감지
#
#   왜 필요한가 (2026-08-27~28 실측으로 알게 된 사실):
#     scrape.yml 의 schedule 트리거가 GitHub 쪽 사정으로 이틀 연속 문제가 있었습니다
#     (8/27: 11시간 넘게 늦게 발동, 8/28: 예정 시각을 6시간 넘게 넘겨도 발동 안 함).
#     원인은 GitHub Actions 스케줄러 자체의 지연/누락으로 보이고(GitHub 공식 문서에도
#     "높은 부하 시 지연될 수 있다"고 명시돼 있습니다), 저장소 설정으로 고칠 수 있는
#     문제가 아닙니다 — §0-1(추측 금지) 원칙에 따라 여기서 근본 원인을 안다고 주장하지
#     않습니다. 문제는 이걸 "듀얼게임 주문이 취소돼서" 우연히 알게 됐다는 점입니다.
#     그래서 매일 아침 한 번, 어제/오늘 예정이었던 자동 수집이 실제로 성공했는지 이
#     워크플로우가 대신 확인하고, 빠진 게 있으면 이슈를 만들어 알립니다.
#
#   확인 대상 (저장소의 schedule 트리거 워크플로우 중, 매일/평일 도는 "실데이터 수집·
#   집계" 성격의 것만 골랐습니다. 오너 확인 요청 — "scrape.yml 하나뿐이냐"는 질문에
#   대한 답으로 아래처럼 범위를 넓혔습니다):
#     · scrape.yml, scrape_us.yml, indicator_kr.yml, scrape_report_snapshots.yml,
#       duel_daily.yml — 평일에만 돕니다(주말엔 검사 자체를 건너뜁니다).
#     · duel_daily_us.yml, scorecard_publish_daily.yml, watch_dividend_disclosures.yml,
#       watch_dividend_payment_events.yml — 매일 돕니다.
#
#   일부러 뺀 것:
#     · keep_awake.yml / render_keep_awake.yml — 데이터 수집이 아니라 단순 핑(ping)이라
#       실패해도 "느려질 뿐" 조용히 잘못된 판단으로 이어지지 않습니다. 주기도 너무 짧아
#       (8시간 / 10분 간격) "하루 한 번 확인"이라는 이 워치독 방식과 안 맞습니다.
#     · collect_dividend_kr.yml — 1년에 한 번(5월경)만 도는 스케줄이라 "오늘 안 돌았나?"
#       검사 자체가 의미 없습니다(365일 중 364일은 원래 안 돔). watch_dividend_
#       disclosures.yml 이 매일 도는 안전망 역할을 이미 하고 있습니다.
#
#   어떻게 확인하는가:
#     각 대상 워크플로우의 최근 실행 목록을 GitHub API 로 조회해서, "예상 창(window)"
#     안에 conclusion=success 인 실행이 하나라도 있는지 봅니다. 트리거 종류(event)는
#     가리지 않습니다 — 아래 자동 재실행이 성공한 경우 그건 workflow_dispatch 로 남기
#     때문에, event=schedule 만 세면 다음 날에도 "성공 없음"으로 잡혀 재실행을 매일
#     헛되이 반복하게 됩니다(2026-08-31 필터 제거). 평일 전용 워크플로우는 주말엔
#     건너뛰고, 월요일엔 지난 금요일 실행분까지 보이도록 창을
#     넓힙니다(주말 동안은 검사가 없었으므로).
#
#   ⚠️ 한계 — 정직하게 밝혀둡니다:
#     이 워치독도 결국 GitHub Actions 의 schedule 로 도는 워크플로우입니다. 즉 이
#     워치독 자체가 같은 이유로 늦게 돌거나 아예 안 돌 가능성을 완전히 배제할 수는
#     없습니다. 다만 "우연히 알게 되는" 것보다는 훨씬 낫고, 서로 다른 시각에 도는
#     여러 워크플로우 중 하나라도 정상 발동했다면 이 워치독도 비슷한 시점에 같이
#     늦게라도 도는 경우가 많을 것으로 기대합니다. 100% 보장은 아니라는 점만 오너가
#     알고 있으면 됩니다.
#     또 하나 — "그날의 그 시각 tick이 정확히 발동했는지"가 아니라 "최근 window(평소
#     30시간, 월요일 76시간) 안에 성공 실행이 한 번이라도 있었는지"만 봅니다. 그래서
#     이론상 이틀 연속으로 tick 이 밀리면서 지연분이 마침 다음 날 window 안에 걸리는
#     경우, 그 다음 날의 "진짜 미발동"을 놓칠 가능성이 아주 낮게나마 있습니다. 데이터가
#     최근에 갱신됐는지가 우리에게 더 중요한 신호라 판단해 이렇게 설계했습니다.
#
#   알림 방식:
#     감시에서 빠진 게 발견되면 먼저 (0) 그 워크플로우를 workflow_dispatch 로 **딱 한 번**
#     자동 재실행합니다(2026-08-31 추가 — 오너가 폰을 못 보는 동안 지연이 겹치면 데이터가
#     며칠씩 밀리기 때문). 재실행 성공 여부를 다시 확인하는 별도 장치는 두지 않습니다 —
#     그러면 감시의 감시가 되고, 어차피 다음 날 이 워치독이 또 돌면서 한 번 더 시도합니다.
#     진짜 수집기 버그(외부 사이트 구조 변경 등)는 utils/data_sanity.py·DataValidator·
#     화면 에러 배너 같은 기존 방어선의 몫입니다. 그리고 (1) 이슈를 만들고 오너를
#     assignee 로 지정 — GitHub 기본 알림 설정상 assignee 로 지정되면 이메일이
#     갑니다(오너 쪽 알림 설정을 끄지
#     않았다면). (2) 저장소에 `DISCORD_WEBHOOK_URL` 시크릿이 등록돼 있으면 디스코드
#     채널로도 같은 내용을 보냅니다(2026-08-28 오너 요청 — 이메일보다 실시간 푸시가
#     더 확실하게 눈에 띄어서 추가). 시크릿이 없으면 이 단계는 조용히 건너뜁니다 —
#     필수는 아님. (3) 이 워치독 잡 자체도 실패(exit 1) 처리해서 Actions 탭에 빨간
#     X 로 남습니다.
#
#   비밀키: 기본 GITHUB_TOKEN 만으로도 동작합니다(같은 저장소의 Actions 실행 목록
#   조회 + 자동 재실행 + 이슈 생성). 다만 자동 재실행 때문에 permissions 의
#   actions 가 read 가 아니라 **write** 여야 합니다(2026-08-31).
#   `DISCORD_WEBHOOK_URL`(저장소 Settings → Secrets and variables → Actions)은
#   선택 사항 — 등록해두면 디스코드 알림이 추가로 갑니다.
#   디스코드 웹훅 URL 자체가 비밀 값이라 반드시 시크릿으로만 등록해야 합니다(코드에
#   하드코딩 금지).
# =============================================================================

name: Schedule Health Watch

on:
  workflow_dispatch: {}

  # 매일 00:00 UTC = KST 09:00 — 위에서 확인하는 워크플로우들의 그날 예정 실행이
  # 전부 끝났을 시각(가장 늦은 것: 08:20 KST 인 scrape_report_snapshots.yml) 이후.
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read
  # actions: write — 확인 목적의 실행 목록 조회(read)뿐 아니라, 빠진 대상을 다시 돌리기
  # 위한 workflow_dispatch API 호출(POST .../dispatches)에 쓰기 권한이 필요합니다.
  actions: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 감시대상 스케줄 확인
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # 파일명|weekdays 또는 daily  (아래 헤더 코멘트의 "확인 대상" 목록과 동일)
          TARGETS="scrape.yml|weekdays
          scrape_us.yml|weekdays
          indicator_kr.yml|weekdays
          scrape_report_snapshots.yml|weekdays
          duel_daily.yml|weekdays
          duel_daily_us.yml|daily
          scorecard_publish_daily.yml|daily
          watch_dividend_disclosures.yml|daily
          watch_dividend_payment_events.yml|daily"

          NOW_TS=$(date -u +%s)
          DOW_KST=$(TZ=Asia/Seoul date +%u)   # 1=월 ... 7=일

          if [ "$DOW_KST" = "1" ]; then
            WEEKDAY_WINDOW_HOURS=76           # 월요일엔 지난 금요일 실행분까지 봐야 함
          else
            WEEKDAY_WINDOW_HOURS=30
          fi
          DAILY_WINDOW_HOURS=30

          FAILED_LIST=""

          while IFS='|' read -r FILE KIND; do
            [ -z "$FILE" ] && continue

            if [ "$KIND" = "weekdays" ] && { [ "$DOW_KST" = "6" ] || [ "$DOW_KST" = "7" ]; }; then
              echo "⏭  $FILE — 주말이라 이번 검사에서 건너뜁니다."
              continue
            fi

            if [ "$KIND" = "weekdays" ]; then
              WINDOW_HOURS=$WEEKDAY_WINDOW_HOURS
            else
              WINDOW_HOURS=$DAILY_WINDOW_HOURS
            fi

            # 2026-08-30 실전 확인 중 발견한 버그(오너 실측) — 아래처럼 `cmd1 || cmd2` 형태로
            # 한 줄에 쓰면, `gh api`가 실패하면서 stderr가 아니라 **stdout에** 에러 응답 몸통을
            # 이미 찍어 놓은 경우(관측됨 — 존재하지 않는 워크플로우 파일명으로 호출 시) `2>/dev/null`
            # 은 그 stdout 출력을 못 막고, 뒤이어 `|| echo` 의 출력까지 **이어 붙어서** RESP가
            # JSON 두 덩어리가 연달아 붙은 문자열이 됩니다 — 그러면 아래 python `json.load`가
            # `JSONDecodeError: Extra data`로 죽고, 잡 전체가 예외로 멈춰 **has_failures 출력
            # 자체가 안 만들어져서 이슈 생성 단계로 아예 못 넘어갑니다**(워치독이 조용히 실패).
            # if/else 로 나눠 실패 시 RESP를 통째로 덮어써서 이 이어붙기 자체를 막습니다.
            #
            # 2026-08-31 — 쿼리에서 `event=schedule` 필터를 뺐습니다. 아래에서 빠진 대상을
            # 자동 재실행(workflow_dispatch)하게 되면서, 그 재실행이 성공해도 event 가
            # `workflow_dispatch` 라 schedule 만 보는 필터에는 안 잡히고, 그러면 다음 날에도
            # "여전히 성공 없음"으로 판정돼 **매일 헛되이 재실행을 반복**하게 됩니다. 대상
            # 9개는 schedule / workflow_dispatch(그리고 duel_daily.yml 은 scrape.yml 완료를
            # 받는 workflow_run) 외의 트리거가 없어서, 필터를 빼도 무관한 이벤트가 섞여 들어와
            # 오탐이 생길 여지는 없습니다. 우리가 알고 싶은 건 "그날 그 수집이 실제로 돌았는가"
            # 이지 "어느 트리거로 돌았는가"가 아닙니다.
            if ! RESP=$(gh api "repos/${REPO}/actions/workflows/${FILE}/runs?per_page=5" 2>/dev/null); then
              RESP='{"workflow_runs":[]}'
            fi

            LATEST_OK=$(echo "$RESP" | python3 -c '
          import json, sys, datetime
          now = int(sys.argv[1])
          window = int(sys.argv[2]) * 3600
          # 방어적 파싱(2중 안전장치) — 위 bash 쪽 수정으로 RESP가 더는 두 JSON이 이어붙은
          # 모양이 되지는 않지만, 혹시 모를 다른 경로로 RESP가 유효한 JSON이 아니게 되는
          # 경우에도 워치독 자체가 예외로 죽어 이슈 생성 단계를 통째로 건너뛰지 않도록,
          # "파싱 실패 = 확인 못 함 = 실행 기록 없음"으로 안전한 쪽(no)으로 처리합니다.
          try:
              data = json.loads(sys.stdin.read())
          except json.JSONDecodeError:
              data = {}
          if not isinstance(data, dict):
              data = {}
          found = False
          for run in data.get("workflow_runs", []):
              created = datetime.datetime.strptime(run["created_at"], "%Y-%m-%dT%H:%M:%SZ").replace(tzinfo=datetime.timezone.utc).timestamp()
              if now - created <= window and run.get("conclusion") == "success":
                  found = True
                  break
          print("yes" if found else "no")
          ' "$NOW_TS" "$WINDOW_HOURS")

            if [ "$LATEST_OK" = "yes" ]; then
              echo "✅ $FILE — 최근 ${WINDOW_HOURS}시간 내 성공 실행 확인됨."
            else
              echo "❌ $FILE — 최근 ${WINDOW_HOURS}시간 내 성공 실행 기록 없음!"
              # 발견 즉시 그 자리에서 딱 한 번 재실행을 걸어 둡니다(§0-3-2 — 사람이 폰을 못
              # 보는 동안 데이터가 며칠씩 밀리는 걸 막는 게 목적). 대상 9개 모두
              # workflow_dispatch 트리거가 있고 입력값은 전부 선택(기본값 있음)이라
              # `-f ref=main` 만으로 트리거됩니다.
              # 재실행이 진짜 성공했는지까지 여기서 다시 확인하지는 **않습니다** — 그건 감시의
              # 감시가 되고, 어차피 내일 이 워치독이 다시 돌면서 같은 판정을 한 번 더 합니다.
              # 재시도 횟수를 세는 상태 파일도 두지 않습니다(하루 한 번이 곧 재시도 주기).
              if gh api -X POST "repos/${REPO}/actions/workflows/${FILE}/dispatches" -f ref=main >/dev/null 2>&1; then
                echo "🔁 $FILE — 자동 재실행 트리거 성공."
                FAILED_LIST="${FAILED_LIST}- ${FILE} (자동 재실행 트리거함)\n"
              else
                echo "⚠️ $FILE — 자동 재실행 트리거 실패! 수동 확인 필요."
                FAILED_LIST="${FAILED_LIST}- ${FILE} (자동 재실행도 실패 — 수동 확인 필요)\n"
              fi
            fi
          done <<< "$TARGETS"

          if [ -n "$FAILED_LIST" ]; then
            echo "has_failures=true" >> "$GITHUB_OUTPUT"
            {
              echo "failed_list<<GHOUTPUT_EOF"
              echo -e "$FAILED_LIST"
              echo "GHOUTPUT_EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "has_failures=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 이슈로 알림 + 잡 실패 처리
        if: steps.check.outputs.has_failures == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          FAILED: ${{ steps.check.outputs.failed_list }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          TITLE="⚠️ 예약 실행 누락 감지 — $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST"
          BODY="다음 워크플로우가 예상 시간 안에 **성공** 실행된 기록이 없습니다. 각 항목
          뒤에 자동 재실행(workflow_dispatch)을 걸어 봤는지, 그 트리거 자체가 됐는지를
          적어 뒀습니다:

          ${FAILED}

          재실행을 **걸어만 둔** 상태입니다 — 그게 실제로 성공했는지는 확인하지 않았으니
          Actions 탭에서 결과를 직접 봐 주세요. 특히 이번 누락이 GitHub 스케줄러 지연
          때문인지(재실행이 그대로 성공했을 가능성이 큼), 아니면 수집기 자체가 깨진
          것인지(예: 외부 사이트 구조 변경 — 재실행도 같은 이유로 실패)는 여전히 사람이
          구분해야 합니다. '자동 재실행도 실패'로 적힌 항목은 트리거 API 호출조차 실패한
          경우라 더 급합니다. 이 이슈는 watch_schedule_health.yml 이 자동 생성했습니다."

          gh issue create --repo "$REPO" --title "$TITLE" --body "$BODY" --assignee moonbear135

          # 디스코드 웹훅이 등록돼 있으면 같은 내용을 채널에도 보냄(선택 사항 —
          # 시크릿이 없으면 이 블록은 조용히 건너뜀). 실패해도 위 이슈 생성/잡 실패
          # 처리는 이미 끝났으니 워크플로우 전체를 막지 않음(|| true).
          if [ -n "${DISCORD_WEBHOOK_URL:-}" ]; then
            DISCORD_MSG=$(printf '⚠️ **예약 실행 누락 감지** (%s KST)\n\n%s\n자세한 내용: https://github.com/%s/issues' \
              "$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')" "$FAILED" "$REPO")
            PAYLOAD=$(python3 -c '
          import json, sys
          print(json.dumps({"content": sys.argv[1]}))
          ' "$DISCORD_MSG")
            curl -s -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK_URL" >/dev/null \
              && echo "✅ 디스코드 알림 전송됨" \
              || echo "⚠️ 디스코드 알림 전송 실패(이메일/이슈 알림은 이미 처리됐으니 계속 진행)"
          fi

          echo "::error::예약 실행이 안 된 워크플로우가 있어 이 잡을 실패 처리합니다(Actions 탭에서 바로 보이도록)."
          exit 1

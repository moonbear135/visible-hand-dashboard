# .github/workflows/naver_api_shadow.yml
# =============================================================================
# 🕶️ 네이버 신 증권 API **섀도 수집** — 실전에 영향 0, 관찰만
#
#   왜 필요한가 (2026-09-07 오너 지시, #213):
#     *"만들어 둔 거는 만들어 둔 것대로 데이터가 잘 받아지는지 10일까지 데이터 축적도
#     해봐야 하지 않아?"*
#
#     네이버가 2026-09-10 구 증권 서비스 종료를 예고했고(#211), 그 대비로
#     `utils/naver_stock_api.py` 파서를 만들어 뒀습니다(#212). 그런데 **그 파서를
#     9/10 에 처음 돌려보는 것은 안전주의가 아닙니다.** 구 출처가 살아 있는 동안
#     신 API 를 나란히 받아 매일 대조해 두면, 전환하는 날에 "이미 며칠째 같은 값이
#     나오고 있다"는 근거를 들고 갈 수 있습니다.
#
#   🔴 실전 데이터를 건드리지 않습니다.
#     쓰기는 `data/naver_api_shadow/` 아래로만 합니다. 스크립트가 스스로
#     `_assert_shadow_path()` 로 확인하고, 경로가 벗어나면 예외로 멈춥니다.
#     화면·점수·스냅샷 어디에도 영향이 없습니다.
#
#   🟢 §0-3-2 매너 (`polite-data-fetching`):
#     · 요청 사이 2.0~3.0초 랜덤 딜레이 · 순차 요청만(병렬 없음)
#     · 403/429 를 만나면 **재시도·우회 없이 그 즉시 중단**
#     · 연속 실패 5회 → 서킷 브레이커 · 1회 실행 요청 상한 60건
#     · 목록 25요청 + 상세 **표본 20종목** = 하루 약 45요청. 상세를 전 종목(520개)
#       받지 않는 것은 **관찰이 목적이지 수집이 목적이 아니기 때문**입니다.
#     · `pageSize` 는 화면이 실제 쓰는 20 을 그대로 씁니다 — 한도를 찾겠다고 큰 값을
#       넣어 시험하지 않습니다.
#
#   🔴 KRX 고정. 신 사이트 주소는 대부분 NXT(넥스트레이드)인데, NXT 는 15:40~20:00
#      애프터마켓이 열려 있어 **종가가 아니라 시간외가**를 줍니다
#      (NAVER_MIGRATION_WORK_ORDER.md §1-5-11). 파서가 코드로 차단합니다.
#
#   트리거: scrape.yml("Daily Market Scraper") 완료 이벤트 (§0-3-15).
#     크롤링 결과를 소비하는 배치는 크롤링 완료 이벤트에 연결합니다. 같은 날 같은 시점의
#     실전 스냅샷과 대조해야 의미가 있으므로, cron 으로 "이쯤이면 끝났겠지"를 추정하지
#     않습니다. 안전망 cron 은 **두지 않습니다** — 이 워크플로우는 관찰용이라
#     하루 걸러도 잃는 것이 없고, 필요 없는 요청을 상대 서버에 보내지 않는 편이 낫습니다.
#
#   ⏳ 이 워크플로우는 **한시적**입니다. 이관이 끝나면(또는 구 출처가 완전히 죽으면)
#      삭제합니다 — 필요 없어진 주기 작업을 남겨두는 것도 상대 서버에 대한 낭비입니다.
#      담당: kr-stocks
# =============================================================================
name: Naver API Shadow

on:
  workflow_run:
    workflows: ["Daily Market Scraper"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shadow:
    runs-on: ubuntu-latest
    # 수동 실행이거나, scrape.yml 이 실제로 성공했을 때만. 실패한 날의 스냅샷과
    # 대조하면 "신 API 가 틀렸다"는 잘못된 결론이 나옵니다.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 원격 main 최신 커밋으로 동기화 (scrape.yml 이 방금 푸시한 스냅샷 반영)
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: 파이썬 준비
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 의존성 설치 (requests 만 있으면 됩니다)
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 섀도 수집 + 현행 대조
        id: shadow
        # 🔴 실패해도 워크플로우를 빨간불로 만들지 않습니다. 이건 **관찰**이고,
        #    네이버가 막았다는 사실 자체가 우리가 알고 싶은 정보입니다.
        continue-on-error: true
        run: |
          set -o pipefail
          python run_naver_api_shadow.py 2>&1 | tee shadow_output.txt
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: 결과 커밋
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/naver_api_shadow/ || true
          git diff --staged --quiet && echo "변경 없음 — 커밋 생략" && exit 0
          git commit -m "Shadow: 네이버 신 API 관찰 $(date +'%Y-%m-%d') [무인 자동화 로봇]"
          for i in 1 2 3; do
            git fetch origin main && git rebase origin/main && git push origin main && break
            echo "푸시 재시도 $i"; sleep 5
          done

      - name: 디스코드 알림 (이상할 때만)
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set -uo pipefail
          # 🔴 판정은 run_naver_api_shadow.py 한 곳에만 있습니다(§0-3-10).
          #    여기서 임계값을 다시 적으면 한쪽만 고쳐져 조용히 어긋납니다.
          MSG=$(python run_naver_api_shadow.py --alert-message || true)
          if [ -z "$MSG" ]; then
            echo "✅ 섀도 대조 정상 — 알림 없음"
            exit 0
          fi
          echo "⚠️ $MSG"
          if [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then
            echo "ℹ️ DISCORD_WEBHOOK_URL 시크릿이 없어 알림을 건너뜁니다(선택 사항)."
            exit 0
          fi
          python run_naver_api_shadow.py --discord-payload > /tmp/shadow_payload.json
          curl -s -H "Content-Type: application/json" -d @/tmp/shadow_payload.json \
               "$DISCORD_WEBHOOK_URL" >/dev/null \
            && echo "디스코드 알림 전송" || echo "디스코드 알림 실패(무시)"

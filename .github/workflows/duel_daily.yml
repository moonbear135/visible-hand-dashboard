# .github/workflows/duel_daily.yml
# =============================================================================
# ⚔️ "결투다!" 야간 배치 — DUEL_MODULE_WORK_ORDER.md 2-5
#
#   하는 일 (순서가 곧 작업지시서 2-5 의 순서입니다):
#     ① 그날 확정 종가가 실제로 확보됐는지 판정 (2-9, 51개 점검 — 아래 주석 참고)
#     ② 그날이 10일이면 정기 입금 (2-2)
#     ③ pending 주문 체결 → 포지션 갱신 → 현금 원장 기록 (2-4-6)
#     ④ 일별 스냅샷 적재 (1-5)
#     ⑤ 내일 비교용 기준값 파일을 저장소에 커밋
#
#   실제 로직은 전부 파이썬에 있습니다(`run_duel_daily_batch.py` → `utils/duel_batch.py`).
#   이 워크플로우는 **언제·어떤 권한으로 그걸 부르는가**만 정합니다.
# -----------------------------------------------------------------------------
# ✅ 2026-08-20 — 아래 cron 시각을 실제 `scrape.yml`(사용자 device_bash로 직접 확인)과
#    대조했습니다. 실제 `scrape.yml`: name="Daily Market Scraper", cron '5 7 * * 1-5'
#    (= UTC 07:05 = KST 16:05 시작), 당시 실측 소요 20~30분 → 늦어도 UTC 07:40(KST 16:40) 종료.
#    이 파일의 cron(UTC 08:10 = KST 17:10)은 그 뒤 약 30분 여유를 두고, 주문 접수 시작
#    (18:00:01 KST)보다 50분 앞서 끝나도록 잡은 것이었는데, 실제 파일과 대조해보니
#    당시엔 그대로 맞았습니다.
#
# 🔴 2026-08-26 — `workflow_run` 트리거 추가(오너 요청, DUEL_MODULE_WORK_ORDER.md 2-5
#    본래 권장 방식). 계기: "재무제표 읽기"(코스피 시가총액 상위 200 → 코스피+코스닥 통합
#    상위 500 확대) 작업 검토 중, 종목 수가 2.5배로 늘면 `scrape.yml` 실측 소요가 20~30분에서
#    더 늘어날 수 있고(정확한 새 수치는 아직 실측 전), 그러면 위 cron(17:10)이 전제로 삼은
#    "scrape.yml은 16:40쯤 끝나 있다"는 가정이 깨져 **이 배치가 '오늘 데이터'가 아니라
#    '어제 데이터'로 조용히 잘못 판정할 위험**이 있다고 오너가 지적. 에러 없이 틀린 날짜로
#    처리되는 쪽이라 cron 시각을 넉넉히 미루는 것만으로는 근본 해결이 안 됨(scrape.yml 소요는
#    매일 일정하지 않고, 미래에 종목 수가 또 늘면 같은 문제가 재발함 — 정확히 같은 이유로
#    `indicator_kr.yml`도 별도 워크플로우로 분리했던 전례가 있음, TECHNICAL_INDICATOR_WORK_ORDER.md §7).
#
#    그래서 **cron 은 그대로 안전망으로 남기고**, `scrape.yml`("Daily Market Scraper") 완료를
#    조건으로 하는 `workflow_run` 을 주 트리거로 추가합니다. 평소엔 scrape.yml이 몇 분이
#    걸리든 상관없이 "진짜 끝난 직후"에 이 배치가 시작되고, 혹시 그날 scrape.yml의 cron
#    자체가 안 돌았다면(정각 혼잡으로 스케줄이 씹히는 경우가 실제로 있음 — scrape.yml 자체
#    주석 참고) workflow_run 이 아예 안 와도 기존 17:10 cron 이 그대로 돌아 ①번 신선도 점검이
#    발동합니다(무변동 종목이 허용치를 넘으면 needs_review 로 보류 — 기존 안전장치 그대로 유지).
#    같은 날 cron·workflow_run 이 둘 다 걸려 두 번 처리돼도 배치 자체가 멱등이라 데이터는
#    안 깨집니다(위 concurrency 참고, push 재시도만 한 번 더 돎).
#
#    job 조건은 아래처럼 잡았습니다:
#      `github.event_name != 'workflow_run' || (conclusion == 'success' && event == 'schedule')`
#    · `event_name != 'workflow_run'` — cron/workflow_dispatch로 직접 불렸을 때는 기존과
#      완전히 동일하게 항상 실행(이 조건 자체가 워크플로우_run 트리거에만 해당하므로).
#    · `conclusion == 'success'` — scrape.yml이 도중에 실패(코스피 데이터 수집 실패 등)했으면
#      새 데이터가 커밋되지 않았으므로 이번엔 건너뜁니다(다음 cron 때 그때 상태로 재판정).
#    · `event == 'schedule'` — scrape.yml 은 `workflow_dispatch`(과거 날짜 백필용, `target_date`
#      입력 시 코스피 수집 자체를 건너뜀)로도 수동 실행될 수 있습니다. 그 백필 실행은 코스피
#      데이터를 새로 안 가져오는데도 워크플로우 자체는 성공으로 끝날 수 있어, 필터링 안 하면
#      "코스피 데이터는 그대로인데 결투 배치만 괜히 한 번 더 깨어남" 이 됩니다. 위험하진
#      않지만(멱등) 불필요한 실행이라 `event == 'schedule'`(scrape.yml이 원래 자기 cron으로
#      돌았을 때만)로 걸러냅니다.
#    ⚠️ `actions/checkout` 은 `ref` 를 안 주면 이 워크플로우 파일이 있는 브랜치(main)의 **그
#    시점 최신 커밋**을 받아옵니다 — scrape.yml이 방금 push한 커밋이 그대로 딸려 옵니다(둘 다
#    같은 main 브랜치에서만 도는 워크플로우라 `head_sha` 를 따로 고정할 필요가 없습니다).
#    실제 GitHub Actions 실행에서 이 연결이 의도대로 동작하는지는 이번 merge 이후 첫 실행을
#    보고 확인 필요(§0-1 — 이 샌드박스에서 실제 workflow_run 이벤트를 발생시켜볼 수는 없음).
#
# 🔴 2026-09-07 (#204) — 위 `event == 'schedule'` 필터가 **실제로는 이 배치를 4시간 늦추고
#    있었습니다.** 공개 Actions API 로 2026-09-01~06 실행 이력을 조회한 실측(추측 아님):
#      · 2026-09-01 부터 `cloudflare_worker.js` 가 16:10 KST 에 `workflow_dispatch` 로 scrape.yml
#        을 깨우고(GitHub 자체 cron 이 매일 4~5시간 지연되는 문제의 우회), **진짜 수집은 그
#        실행**이 합니다 — 09-02 16:10→17:59, 09-03 16:10→17:46, 09-06 16:10→17:19 종료.
#      · 이 워크플로우의 workflow_run 은 그 완료를 받았지만 `event == 'schedule'` 이 아니라서
#        전부 **skipped**(duel_daily.yml #18·#21·#28). 그 뒤 GitHub 자체 cron 의 scrape.yml
#        (21:03~21:05 시작, 수집기 사전 점검이 "오늘 이미 SUCCESS"라 1분 만에 종료)이 끝난
#        22:11~22:12 에야 workflow_run 이 통과해 실제 처리됨(#20·#23·#25). 이 배치의 자체 cron
#        (17:10)도 같은 지연을 받아 21:41~21:47 에 돌았습니다.
#      → 데이터는 17:19~17:59 에 준비됐는데 처리는 21:41~22:12 — "크롤링 후 최대한 빨리"의
#        정반대였습니다. 필터가 전제한 "정식 수집 = schedule 이벤트"가 Worker 도입 뒤로 깨진 것.
#    고친 것:
#      ① job `if` 를 `event == 'schedule' || event == 'workflow_dispatch'` 로 넓힘 — Worker 의
#         dispatch 완료를 받습니다. (`conclusion == 'success'` 는 그대로.)
#      ② 그 대신 **데이터로 거릅니다** — `crawl_ready_gate.py duel-kr` 게이트 단계. "오늘(KST) 자
#         SUCCESS 스냅샷이 장마감 뒤에 저장됨"(수집기 자체의 #189/#195 사전 점검 함수 재사용)이고
#         "오늘 아직 처리 전"(기준값 파일의 target_date ≠ 오늘)일 때만 배치를 돌립니다. 그래서
#         백필 dispatch(어제 값)·새벽 수동 실행(#195 모양)·이미 처리한 뒤의 두 번째 완료(GitHub
#         cron 지연분)는 전부 조용히 건너뜁니다. 게이트가 없던 때는 같은 날 두 번째 실행이 첫
#         실행이 남긴 기준값과 비교해 "전부 무변동" → `failed_or_holiday` → 첫 실행이 **보류**해 둔
#         주문을 **취소**할 수 있었습니다(`utils/duel_batch.resolve_action()` — 위 "멱등" 서술은
#         체결까지 끝난 날에만 맞았습니다). 게이트가 그 경로를 막습니다.
#         (#207) 예외 하나 — 아래 ③ cron 안전망이 **크롤링 전에** 돌아 "스냅샷 거래일 ≠ 처리 거래일"
#         로 보류하고 오늘 자 기준값(값은 어제 것)을 남긴 날은, 기준값의 `outcome`(held + 값 원천
#         거래일)을 보고 게이트가 "아직 처리 전"으로 답해 진짜 수집 완료 이벤트가 보류를 체결로
#         되살립니다. 체결·취소로 끝난 날은 그대로 "이미 처리"입니다.
#      ③ cron(17:10) 은 **순수 안전망**입니다 — "오늘 아직 처리 전"일 때만 돕니다(같은 게이트를
#         `--role safety-net` 으로: 수집 완료는 조건으로 걸지 않습니다 — 크롤링이 그날 아예 안
#         돌았을 때 신선도 판정으로 주문을 정리하는 것이 안전망의 존재 이유이므로). 평소엔 위
#         workflow_run 이 17:20~18:00 에 먼저 처리하고 cron 은 건너뜁니다. 시각은 옮기지 않았습니다
#         (오너: 고정 시각을 뒤로 미루는 방향은 금지 — cron 은 이제 타이밍 추정용이 아닙니다).
#      ④ `workflow_dispatch`(관리자 override·백필) 는 게이트를 거치지 않고 예전과 똑같이 항상 실행.
#    기대 효과(실측 기반): Worker dispatch 완료(17:19~17:59) 직후 1~2분 안에 체결 — 종전 21:41~22:12
#    보다 약 4시간 빠름. 실제 workflow_run 발동 지연은 GitHub 쪽이라 다음 평일 실행에서 확인 필요.
# =============================================================================

name: Duel Daily Batch

on:
  # ══════════════════════════════════════════════════════════════════════════
  # 🛑 2026-09-08 — **오너 지시로 자동 실행을 멈췄습니다.**
  #
  # 오너: *"모든 그냥 시스템 종료 / 홈페이지 폐쇄 / 비공개로 한다"*
  #
  # 이유: 코스콤·거래소 시세정보 이용 원칙 확인 결과, 시세를 제3자에게 보여주는 것은
  #       시세정보 이용계약 없이는 불가하고(예외는 "부분 발췌 + 비시스템적 + 비상업적"
  #       뿐인데 이 시스템은 셋 다 해당 없음), 코스콤 오픈API플랫폼은 법인만 이용
  #       가능합니다. 자세한 근거는 `DATA_SOURCES_INVENTORY.md`, 경위는 TASK_HISTORY #227.
  #
  # 🔴 자동 실행을 멈춘 것은 **상대 서버에 계속 요청을 보내지 않기 위해서**이기도 합니다
  #    (§0-3-2 — 필요 없어진 주기 작업을 남겨두는 것도 위반).
  #
  # ▶ 지워지지 않았습니다. `workflow_dispatch`(수동 실행)는 남아 있어 필요하면 오너가
  #   직접 한 번씩 돌릴 수 있습니다.
  # ▶ 되살리려면 아래 주석(`#`)만 풀면 원래대로 돌아갑니다.
  # ══════════════════════════════════════════════════════════════════════════
#  schedule:
    # 평일 08:10 UTC = KST 17:10 (코스피 수집 16:05 완료 후, 주문 접수 18:00:01 시작 전).
    # ✅ 실제 scrape.yml(cron '5 7 * * 1-5' = KST 16:05, 2026-08-20 당시 실측 20~30분 소요)과
    #    대조 완료. 2026-08-26부터는 아래 workflow_run 이 주 트리거이고, 이 cron 은 scrape.yml
    #    자체가 그날 안 돌았을 때를 대비한 안전망으로 남겨둡니다(위 2026-08-26 코멘트 참고).
    # 🔴 (#204) 이 값은 더 이상 "이쯤이면 scrape.yml 이 끝났겠지"라는 타이밍 추정이 아닙니다 —
    #    **순수 안전망**입니다. 평소엔 아래 workflow_run 이 먼저 처리하고, 이 cron 은 게이트
    #    (`crawl_ready_gate.py duel-kr --role safety-net`)가 "오늘 아직 처리 전"이라 할 때만 돕니다.
#    - cron: "10 8 * * 1-5"
  # scrape.yml("Daily Market Scraper")이 끝나면 그 결과를 조건으로 곧바로 실행 (2026-08-26 추가).
  # 위 cron 처럼 "몇 시쯤 끝나 있겠지"를 추정할 필요 없이, scrape.yml이 몇 분이 걸리든 항상
  # "진짜 끝난 직후"에 시작합니다. 어떤 조건으로 실제 처리를 걸렀는지는 아래 job 의 if 와
  # 게이트 단계(#204) 참고.
#  workflow_run:
#    workflows: ["Daily Market Scraper"]
#    types: [completed]
  # 수동 실행. needs_review 로 보류된 날을 관리자가 확인한 뒤 결론 내릴 때도 씁니다.
  workflow_dispatch:
    inputs:
      target_date:
        description: "처리할 거래일 (YYYY-MM-DD, KST). 비우면 오늘"
        required: false
        default: ""
      override:
        description: "관리자 확인 후 판정 덮어쓰기 (fill = 정상이었다 / cancel = 실패였다)"
        required: false
        default: ""
        type: choice
        options: ["", "fill", "cancel"]
      dry_run:
        description: "저장하지 않고 계산만"
        required: false
        default: false
        type: boolean

# 기준값 파일(data/duel_freshness_probe_previous.json)을 저장소에 되커밋하므로 쓰기 권한이
# 필요합니다. 그 외 권한은 주지 않습니다(최소 권한).
permissions:
  contents: write

# 같은 워크플로우가 겹쳐 돌면 같은 거래일을 두 번 처리하려다 서로의 커밋을 밀어냅니다.
# (배치 자체는 멱등이라 데이터가 깨지지는 않지만, push 충돌로 시끄러워집니다.)
concurrency:
  group: duel-daily-batch
  cancel-in-progress: false

jobs:
  duel-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 2026-08-26 — workflow_run 으로 깨어났을 때만 거릅니다(cron·workflow_dispatch 로 직접
    # 불렸을 때는 이 조건 자체가 항상 참이라 기존과 동일하게 무조건 실행). 상세 근거는 위
    # 2026-08-26 코멘트 참고.
    # 2026-09-07 (#204) — Cloudflare Worker 의 `workflow_dispatch` 완료도 받습니다(위 #204 코멘트:
    # 진짜 수집이 그 실행). "오늘 값인가·이미 처리했나"는 아래 게이트 단계가 데이터로 거릅니다.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.event == 'schedule' || github.event.workflow_run.event == 'workflow_dispatch'))

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          # 기준값 파일을 커밋해 되돌려 보내야 하므로 얕은 클론이어도 push 가 가능하도록
          # 기본 토큰을 그대로 씁니다(추가 시크릿 없음).
          fetch-depth: 0

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚦 크롤링 완료 게이트 (#204 — workflow_run·cron 만, 수동 실행은 항상 진행)
        id: gate
        if: github.event_name != 'workflow_dispatch'
        # workflow_run 으로 깨어났으면 "오늘 자 코스피 수집이 끝났고 아직 처리 전"일 때만,
        # cron(안전망)이면 "아직 처리 전"일 때만 아래 단계가 돕니다. 판정 근거는 로그와 실행
        # 요약(::notice)에 남습니다. 읽기 전용 — 이 단계는 아무것도 쓰지 않습니다.
        run: |
          ROLE=event
          if [ "${{ github.event_name }}" = "schedule" ]; then ROLE=safety-net; fi
          python crawl_ready_gate.py duel-kr --role "$ROLE"

      - name: 결투 야간 배치 실행
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.ready == 'true'
        env:
          # 🔴 배치 전용 키. 사용자가 접속하는 앱 서버(Render)에는 **절대** 넣지 않습니다
          #    (§0-3-8 · utils/duel_db.py 머리말). 변수 이름은 duel_db.py 가 읽는 것과
          #    글자 그대로 같아야 합니다: SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.target_date }}" ]; then
            ARGS="$ARGS --target-date ${{ github.event.inputs.target_date }}"
          fi
          if [ -n "${{ github.event.inputs.override }}" ]; then
            ARGS="$ARGS --override ${{ github.event.inputs.override }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          echo "실행: python run_duel_daily_batch.py $ARGS"
          python run_duel_daily_batch.py $ARGS

      - name: 신선도 기준값 파일 커밋
        # 배치가 실패하면(비정상 종료) 여기까지 오지 않습니다 — 실패한 실행의 기준값을
        # 커밋해 다음 날 판정을 오염시키지 않기 위해서입니다.
        # `scrape_report_snapshots.yml` 이 data/us_index_history.json 을 커밋하는 것과
        # 같은 방식입니다(변경이 없으면 아무것도 하지 않고 정상 종료).
        # (#204) 게이트가 건너뛴 실행은 배치도 안 돌았으니 커밋할 것도 없습니다 — 같은 조건.
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.ready == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/duel_freshness_probe_previous.json
          if git diff --cached --quiet; then
            echo "기준값 변경 없음 — 커밋하지 않습니다."
            exit 0
          fi
          git commit -m "chore(duel): 신선도 점검 기준값 갱신 [skip ci]"
          # 같은 data/ 폴더를 코스피 수집 워크플로우도 커밋하므로 push 가 거절될 수 있습니다.
          # 기존 워크플로우들과 같은 fetch+rebase 재시도 패턴(최대 3회).
          for attempt in 1 2 3; do
            if git push; then
              echo "push 성공 (시도 $attempt)"
              exit 0
            fi
            echo "push 거절 — fetch 후 rebase 재시도 ($attempt/3)"
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}" || exit 1
          done
          echo "❌ 3회 시도 후에도 push 하지 못했습니다."
          exit 1

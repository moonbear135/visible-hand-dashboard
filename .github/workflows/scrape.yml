name: Daily Market Scraper

on:
  schedule:
    # 매일 평일(월-금) 한국 시간 오후 4:05 (UTC 7:05)에 자동 실행
    # 정각(0분)은 깃허브 서버가 몰려서 지연/누락되기 쉬워 5분 뒤로 설정
    - cron: '5 7 * * 1-5'
  workflow_dispatch:
    # 깃허브 웹 화면에서 수동으로 즉시 실행할 수 있는 버튼 활성화
    inputs:
      target_date:
        description: '(선택) 과거 날짜를 보정하려면 YYYY-MM-DD 형식으로 입력. 비워두면 오늘 기준으로 정상 수집합니다.'
        required: false
        default: ''
      # 2026-09-04: scrape_us.yml 의 같은 이름 입력과 동일한 관례. 기본값 false 라
      # cloudflare_worker.js / watch_schedule_health.yml 처럼 입력 없이 dispatch 하는 호출은
      # 전부 사전 점검이 켜진 채로 돕니다.
      force:
        description: '사전 점검을 무시하고 무조건 수집합니다 (오늘 이미 SUCCESS 로 수집된 날을 다시 수집하고 싶을 때만 true)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write # 깃허브에 파일 쓰기 권한 활성화

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
    - name: 저장소 코드 체크아웃
      uses: actions/checkout@v3

    - name: 파이썬 환경 설정
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 필수 의존 라이브러리 설치
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 코스피 시가총액 상위 200 개별 종목 데이터 수집 (data/*.json 갱신)
      # 과거 날짜 보정(백필) 실행일 때는 건너뜁니다 (이 수집기는 항상 "현재 시점" 데이터만 가져오기 때문)
      if: ${{ github.event.inputs.target_date == '' }}
      # 2026-09-04: 평소(cron · Cloudflare Worker 의 workflow_dispatch)에는 --skip-if-not-ready 로
      # 사전 점검을 켭니다. 오늘(KST) 자 스냅샷이 이미 status=SUCCESS 면 아무것도 하지 않고 정상
      # 종료(exit 0)하므로, GitHub 자체 cron 이 몇 시간 늦게 발동해 Worker 와 같은 날 둘 다 돌아도
      # 실제 크롤링은 하루 한 번만 일어납니다(2026-09-02·09-03 실측: 매일 두 번 커밋됨).
      # DEGRADED/FAILED 로 끝난 날은 성공으로 치지 않고 다시 수집합니다.
      # 수동 실행에서 force=true 를 고르면 점검 없이 무조건 다시 수집합니다(scrape_us.yml 과 동일).
      # ⚠️ 위 schedule: cron 은 안전망으로 그대로 둡니다 — Worker 쪽 장애 시 이게 유일한 트리거.
      run: |
        if [ "${{ github.event.inputs.force }}" = "true" ]; then
          echo "⚠️ force=true — 사전 점검을 건너뛰고 무조건 수집합니다"
          python collector_kospi200.py
        else
          python collector_kospi200.py --skip-if-not-ready
        fi

    - name: 거시경제/수급 데이터 수집 (market_history.csv 갱신)
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        # 2026-08-10 (TASK_HISTORY #70): KRX OPEN API 인증키.
        # VKOSPI 지수값과 KOSPI200 선물 베이시스를 실측으로 받아오는 데 씁니다.
        # ⚠️ 값 자체는 저장소 Secrets 에만 있고 코드·로그·문서 어디에도 남기지 않습니다.
        #    Secret 이 없거나 서비스 승인이 안 났으면(401) 그 두 지표만 '산출 불가'로 빠지고
        #    나머지 수집은 정상 진행됩니다(값을 지어내지 않음, ENGINEERING_SPEC §0-1).
        KRX_OPENAPI_KEY: ${{ secrets.KRX_OPENAPI_KEY }}
      run: |
        python scrape_daily.py "${{ github.event.inputs.target_date }}"

    - name: 갱신된 데이터를 깃허브에 영구 커밋 및 업로드
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add data/ market_history.csv
        git commit -m "Auto Update: $(date +'%Y-%m-%d') [무인 자동화 로봇]" || exit 0

        # 이 작업은 크롤링에 20~30분이 걸리는데, 그 사이 사람이 직접 다른 파일을(코드/문서)
        # 푸시하면 원격 저장소가 앞서나가 있어서 그냥 push하면 거부(rejected)됩니다.
        # 최대 3번까지 최신 내용을 받아와 자동으로 합친 뒤 재시도합니다.
        for i in 1 2 3; do
          if git push origin main; then
            echo "✅ 푸시 성공"
            exit 0
          fi
          echo "⚠️ 푸시 거부됨 (원격이 앞서있음) — 최신 내용 받아와서 재시도 ($i/3)"
          git fetch origin main
          if ! git rebase origin/main; then
            echo "❌ 리베이스 충돌 발생 — 자동 병합 불가, 수동 확인 필요"
            git rebase --abort
            exit 1
          fi
        done
        echo "❌ 3회 재시도 후에도 푸시 실패"
        exit 1

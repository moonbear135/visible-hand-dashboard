name: Daily Market Scraper

on:
  schedule:
    # 매일 평일(월-금) 한국 시간 오후 4:05 (UTC 7:05)에 자동 실행
    # 정각(0분)은 깃허브 서버가 몰려서 지연/누락되기 쉬워 5분 뒤로 설정
    - cron: '5 7 * * 1-5'
  workflow_dispatch:
    # 깃허브 웹 화면에서 수동으로 즉시 실행할 수 있는 버튼 활성화
    inputs:
      target_date:
        description: '(선택) 과거 날짜를 보정하려면 YYYY-MM-DD 형식으로 입력. 비워두면 오늘 기준으로 정상 수집합니다.'
        required: false
        default: ''

permissions:
  contents: write # 깃허브에 파일 쓰기 권한 활성화

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
    - name: 저장소 코드 체크아웃
      uses: actions/checkout@v3

    - name: 파이썬 환경 설정
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 필수 의존 라이브러리 설치
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 코스피200 개별 종목 데이터 수집 (data/*.json 갱신)
      # 과거 날짜 보정(백필) 실행일 때는 건너뜁니다 (이 수집기는 항상 "현재 시점" 데이터만 가져오기 때문)
      if: ${{ github.event.inputs.target_date == '' }}
      run: |
        python collector_kospi200.py

    - name: 거시경제/수급 데이터 수집 (market_history.csv 갱신)
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        python scrape_daily.py "${{ github.event.inputs.target_date }}"

    - name: 갱신된 데이터를 깃허브에 영구 커밋 및 업로드
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add data/ market_history.csv
        git commit -m "Auto Update: $(date +'%Y-%m-%d') [무인 자동화 로봇]" || exit 0
        git push origin main

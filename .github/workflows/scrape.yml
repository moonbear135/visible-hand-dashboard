name: Daily Market Scraper

on:
  schedule:
    # 매일 평일(월-금) 한국 시간 오후 5:00 (UTC 8:00)에 자동 실행
    - cron: '0 8 * * 1-5'
  workflow_dispatch:
    # 깃허브 웹 화면에서 수동으로 즉시 실행할 수 있는 버튼 활성화

permissions:
  contents: write # 깃허브에 파일 쓰기 권한 활성화

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
    - name: 저장소 코드 체크아웃
      uses: actions/checkout@v3

    - name: 파이썬 환경 설정
      uses: actions/setup-python@v4
      with:
        python-state-: '3.10'
        python-version: '3.10'

    - name: 필수 의존 라이브러리 설치
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 실시간 금융 수급 데이터 자동 수집 실행
      run: |
        python scrape_daily.py

    - name: 갱신된 데이터를 깃허브에 영구 커밋 및 업로드
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add market_history.csv
        git commit -m "Auto Update: $(date +'%Y-%m-%d') [무인 자동화 로봇]" || exit 0
        git push origin main

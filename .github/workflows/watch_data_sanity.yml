# .github/workflows/watch_data_sanity.yml
# =============================================================================
# 📏 수집 결과 산티체크 감시 — "실행은 됐는데 결과 값이 이상한" 날을 잡아 디스코드로 알림
#
#   왜 필요한가 (2026-08-30 오너 지시):
#     지금 이 저장소의 감시망에는 정확히 한 칸이 비어 있었습니다.
#       · watch_schedule_health.yml — **"오늘 이 워크플로우가 실행됐는가"** 만 봅니다
#         (그 파일 머리말이 스스로 그렇게 못 박아 두었습니다). "안 돌았다"는 잡지만
#         "돌긴 돌았는데 결과가 이상하다"는 전혀 못 잡습니다.
#       · test_suite.yml — pytest 를 돌립니다. 즉 **이미 알려진 검사**만 지켜줍니다.
#         오늘 소스 HTML 이 바뀌어 가격이 전부 0으로 들어와도 pytest 는 초록불입니다.
#     그 사이의 공백 — 수집 종목 수 급감 / 핵심 숫자 컬럼이 전부 결측·0 / 값이 전부 같은
#     상수 / 어제 대비 값 수준이 말이 안 되게 튐 — 이 워크플로우가 담당합니다.
#
#   ⚠️ watch_schedule_health.yml 은 **건드리지 않았습니다.** 그 파일은 "실행 여부"라는
#      다른 관심사를 스스로 명시한 별개 감시이고, 이번 건은 완전히 새로운 검사입니다.
#
#   판정은 누가 하나:
#     각 수집기가 **자기 결과를 저장한 뒤** `utils/data_sanity.check_dataset()` 을 불러
#     `data/<dataset>_sanity.json` 에 판정 결과와 '내일의 기준값'을 남깁니다. 그 파일은
#     각 수집기 워크플로우가 이미 하고 있는 `git add data/` 커밋에 그대로 실려 옵니다
#     (`utils/duel_batch.py` 의 신선도 기준값 파일이 커밋되는 것과 같은 방식).
#     이 워크플로우는 **판정을 다시 하지 않고** 그 파일들을 읽어 알리기만 합니다
#     (ENGINEERING_SPEC §0-3-10 — 같은 판정을 두 곳에서 구현하지 않기).
#
#   왜 수집기 워크플로우마다 스텝을 넣지 않고 이 통합 워크플로우 하나로 했는가:
#     ① **기존 파일을 가장 적게 건드립니다.** 이 방식은 기존 워크플로우 중 딱 하나
#        (indicator_kr.yml 의 `git add` 목록에 산티체크 파일 2개 경로 추가)만 손대면
#        됩니다. scrape.yml(`git add data/`)·scrape_us.yml(`git add -A data/`)은 이미
#        data/ 전체를 커밋하고 있어 **한 글자도 고치지 않았습니다.** 반대로 수집기마다
#        스텝을 넣는 방식은 실제 자산 데이터를 수집하는 프로덕션 워크플로우 3개를
#        전부 열어 각각 20여 줄씩 고쳐야 합니다.
#     ② **더 안전합니다.** 이 워크플로우가 어떻게 실패하든 수집은 영향을 받지 않습니다.
#        수집기 워크플로우 안에 알림 스텝을 넣으면, 그 스텝의 사소한 셸 실수 하나가
#        수집·커밋 잡 자체를 빨간 X 로 만들 수 있습니다.
#     ③ 알림 문구를 만드는 곳이 한 군데입니다.
#     🔻 대신 포기한 것(정직하게): 이 워크플로우도 결국 GitHub 이 굴려 주는 물건이라,
#        watch_schedule_health.yml 이 자기 머리말에 적어 둔 한계(스케줄러 지연·이벤트
#        유실 가능성)를 똑같이 가집니다. 100% 보장이 아니라는 점만 알고 있으면 됩니다.
#
#   🔴 2026-09-08 (#219) 변경 — **하루 한 번(09:30)에서 "수집이 끝나는 즉시"로** 바꿨습니다.
#      원래는 "하루 한 번 한 메시지로 모인다"는 것을 장점으로 적어 뒀는데, 오너 지적으로
#      그게 장점이 아니라 **치명적인 단점**이었음이 드러났습니다 — 09:30 은 이미 장이
#      열린 뒤라 알아도 그날은 손쓸 수가 없습니다. 자세한 경위는 아래 `on:` 주석 참고.
#      🔻 대신 포기한 것: 문제가 이어지는 동안 하루 최대 3~4통이 옵니다. 같은 문제를
#         여러 번 알리는 셈이지만, **아직 안 고쳐졌다는 사실은 매번 참**입니다(§0-1).
#
#   확인 대상: `data/*_sanity.json` 전부. **파일 목록을 여기에 적지 않습니다** —
#     적어 두면 수집기 쪽과 두 개의 출처가 생겨서 어긋납니다(§0-3-10). 지금 이 파일을
#     만드는 수집기는 collector_kospi200.py / collector_us_stocks.py /
#     collector_indicator_kr.py 세 개입니다.
#     🔻 이 방식의 한계(정직하게): 목록을 안 적으므로 "세 개 중 하나가 조용히 파일을
#        안 쓰게 된" 경우는 못 잡습니다. 그건 "그 워크플로우가 성공했는가"의 문제라
#        watch_schedule_health.yml 의 관심사입니다. 다만 파일이 **하나도** 없는 경우는
#        명백한 이상이라 알립니다(배포 직후 첫 실행은 아직 수집기가 안 돌아 이 알림이
#        한 번 올 수 있는데, 그건 오탐이 아니라 "감시가 살아 있다"는 확인입니다).
#
#   알림 방식:
#     의심/판정 오류가 있으면 (1) 저장소에 `DISCORD_WEBHOOK_URL` 시크릿이 있으면
#     디스코드로 보내고 — `watch_schedule_health.yml`·`test_suite.yml` 이 이미 쓰는
#     **같은 시크릿을 그대로 재사용**합니다(새로 설정할 것 없음), (2) 이 잡 자체를
#     실패(exit 1) 처리해 Actions 탭에 빨간 X 로 남깁니다. 페이로드는 두 파일과
#     **완전히 같은 방식**(`python3 -c` 로 JSON 이스케이프 후 curl)이라 한글·이모지·
#     따옴표가 섞여도 깨지지 않습니다. 정상인 날에는 아무 알림도 보내지 않습니다.
#     이슈는 만들지 않습니다(test_suite.yml 과 같은 판단 — 빨간 X + 디스코드로 충분히
#     눈에 띄고, 매일 이슈가 쌓이면 오히려 소음).
#
#   🔴 이 감시는 아무 데이터도 고치지 않습니다. 의심스러운 값도 그대로 두고 사람에게
#      알리기만 합니다(§0-1).
# =============================================================================

name: Data Sanity Watch

on:
  workflow_dispatch: {}

  # ── 🔴 2026-09-08 (#219) — **수집이 끝나는 즉시** 확인합니다 ──────────────────
  #
  # 오너 지적: *"매일 오전 9시 30분이라는 시간은 참 애매한 시간대인데, 크롤링이 실패했어도
  # 수습할 수 있는 시간도 아니고, 그날 장은 시작했으니까 장 종료까지 기다려야 하고."*
  # 그리고: *"문제가 생긴 것을 수습할 시간을 벌기 위한 경고문들인데, 그 경고문들을
  # 쓸 수가 없네."*
  #
  # 맞습니다. **판정은 수집 직후에 이미 나와 있었고**(각 수집기가 저장 직후
  # `data_sanity.check_dataset()` 을 부릅니다), 09:30 은 그걸 **읽어주기만** 하는
  # 시각이었습니다. 그런데 하필 장이 열린 뒤(09:00~)라 —
  #   · 다시 수집하면 **장중 가격이 그날 종가로 저장**됩니다(이 저장소가 실제로 겪은 사고).
  #   · 그래서 15:30 마감까지 기다려야 하고, 하루를 통째로 잃습니다.
  # 즉 **경고가 가장 쓸모없는 시각에 도착**하고 있었습니다.
  #
  # 🔴 그리고 한국장·미국장이 한 번에 묶여 있었습니다(오너: *"이 부분을 미국장 한국장을
  #    분리해서 돌려야 하는 게 맞다고 생각해, 이게 커버가 안 돼"*). 두 시장은 마감
  #    시각이 12시간 가까이 다른데 알림은 하루 한 번뿐이라, 어느 쪽이든 한쪽은 반드시
  #    늦게 알게 됩니다.
  #
  # → 각 수집기의 **완료 이벤트**에 겁니다(§0-3-15 — 소비자는 수집 완료에 연결).
  #   · 코스피   완료 → 약 16:10 KST (장 마감 15:30 이후) → 그날 안에 다시 돌릴 수 있음
  #   · 보조지표 완료 → 약 17:10 KST
  #   · 미국주식 완료 → 약 05:40 KST (미국장 마감 이후) → 그날 안에 다시 돌릴 수 있음
  #   세 시장이 각자 **자기 장이 닫혀 있는 시간에** 알림을 받습니다.
  #
  # ⚠️ 여기에 적는 것은 **워크플로우 이름뿐**이고, 데이터셋 파일 목록은 여전히 적지
  #    않습니다(§0-3-10) — 아래 검사는 언제 불려도 `data/*_sanity.json` 전부를 봅니다.
  #    그래서 이름이 하나 빠져도 아래 cron 안전망이 여전히 잡습니다.
  workflow_run:
    workflows:
      - "Daily Market Scraper"                              # 코스피 (scrape.yml)
      - "Daily US Stocks Scraper"                           # 미국주식 (scrape_us.yml)
      - "보조지표 모듈(여기서부터는 신앙입니다) 일간 수집"      # 보조지표 (indicator_kr.yml)
    types: [completed]

  # 🛟 **안전망으로만 남깁니다.** 매일 00:30 UTC = KST 09:30.
  #   위 이벤트가 안 오는 경우(수집 워크플로우 자체가 발동하지 않은 날, 이벤트 유실,
  #   상태 파일이 아예 안 생긴 경우)를 여기서 받칩니다. **이제 이 시각이 1차 알림이
  #   아닙니다** — 1차는 수집 직후입니다.
  #   · watch_schedule_health.yml(00:00 UTC)과 같은 분에 겹치지 않게 30분 뒤로 뒀습니다.
  #   · watch_schedule_health.yml 이 이 워크플로우를 "daily" 로 감시하는데, 그쪽은
  #     event 필터 없이 "창 안에 성공 실행이 있었나"만 보므로(그 파일 2026-08-31 주석)
  #     이벤트 실행이 늘어도 감시는 그대로 유효합니다.
  schedule:
    - cron: '30 0 * * *'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 🔴 수집 워크플로우가 **실패한** 날에는 이 감시를 돌리지 않습니다 — 그날은 상태 파일이
    #    갱신되지 않았을 것이고, 어제 판정을 오늘 것처럼 다시 알리면 사실과 다릅니다(§0-1).
    #    "수집이 아예 안 돌았다/실패했다"는 watch_schedule_health.yml 의 관심사입니다.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: 저장소 코드 체크아웃
        uses: actions/checkout@v3
        # ⚠️ ref 를 지정하지 않습니다. workflow_run 으로 불렸을 때 필요한 것은 방금 끝난
        #    수집기가 **커밋해 올린 상태 파일**인데, 그건 기본 브랜치 끝에 있습니다.
        #    `github.event.workflow_run.head_sha` 는 그 수집이 **시작할 때**의 커밋이라
        #    상태 파일이 아직 없습니다 — 지정하면 오히려 어제 것을 보게 됩니다.

      - name: 파이썬 환경 설정
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 산티체크 상태 파일 확인
        id: check
        # utils/data_sanity.py 는 표준 라이브러리만 씁니다 — 여기서 requirements.txt 를
        # 설치하지 않는 이유입니다(§0-3-2 · 필요 없는 일은 하지 않음).
        run: |
          python3 - <<'PYCHECK'
          import glob
          import json
          import os
          import sys

          sys.path.insert(0, os.getcwd())
          from utils.data_sanity import alert_lines, format_status_line

          paths = sorted(glob.glob("data/*_sanity.json"))
          entries = []          # 읽는 데 성공한 (경로, payload) 짝. 경로와 내용을 절대 따로
                                # 들고 다니지 않습니다 — 하나가 빠지면 짝이 밀려서 엉뚱한
                                # 파일 이름에 남의 판정이 붙습니다(§0-1: 사실과 다른 표시 금지).
          lines = []

          for path in paths:
              try:
                  with open(path, encoding="utf-8") as handle:
                      entries.append((path, json.load(handle)))
              except Exception as exc:
                  # 상태 파일을 못 읽는 것 자체가 알려야 할 이상입니다(조용히 넘기지 않음).
                  lines.append(f"• {path} — 상태 파일을 읽을 수 없습니다: {type(exc).__name__}: {exc}")

          # Actions 로그에는 정상까지 전부 남깁니다(무엇을 봤는지 사람이 확인할 수 있게).
          print(f"확인한 상태 파일: {len(paths)}개 (읽기 성공 {len(entries)}개)")
          for path, payload in entries:
              print(f"  {path}: {format_status_line(payload)}")

          if not paths:
              lines.append("• data/*_sanity.json 상태 파일이 하나도 없습니다 — 수집기가 산티체크를 "
                           "기록하지 못했거나 커밋되지 않았습니다.")

          lines.extend(alert_lines([payload for _path, payload in entries]))

          # 디스코드의 content 한도는 2000자입니다. 넘기면 요청이 거부되는데 curl 은 그걸
          # 실패로 보지 않아 "전송됨"만 찍히고 **아무것도 안 갑니다.** 위 Actions 로그에는
          # 이미 전부 남겼으니, 알림 문구만 안전하게 줄이고 줄였다는 사실을 밝힙니다(§0-1).
          MAX_ALERT_CHARS = 1500
          alert_text = "\n".join(lines)
          if len(alert_text) > MAX_ALERT_CHARS:
              alert_text = (alert_text[:MAX_ALERT_CHARS].rstrip()
                            + f"\n… 너무 길어 여기서 줄였습니다 — 전체 {len(lines)}건은 Actions 로그에서 확인하세요.")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"has_alerts={'true' if lines else 'false'}\n")
              out.write("alert_text<<GHOUTPUT_EOF\n")
              out.write(alert_text + ("\n" if lines else ""))
              out.write("GHOUTPUT_EOF\n")

          if lines:
              print("::warning::산티체크 의심 항목이 있습니다 — 아래 알림 스텝에서 처리합니다.")
              for line in lines:
                  print(line)
          else:
              print("✅ 의심 항목 없음.")
          PYCHECK

      - name: 의심이면 디스코드 알림 + 잡 실패 처리
        if: steps.check.outputs.has_alerts == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ALERTS: ${{ steps.check.outputs.alert_text }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [ -n "${DISCORD_WEBHOOK_URL:-}" ]; then
            RUN_URL="https://github.com/${REPO}/actions/runs/${RUN_ID}"
            MSG=$(printf '📏 **수집 결과 산티체크 — 의심 발견** (%s KST)\n%s\n\n값은 그대로 두었습니다(고치거나 지우지 않음). 확인 후 판단해 주세요.\n%s' \
              "$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')" \
              "$ALERTS" \
              "$RUN_URL")
            # 디스코드 JSON 페이로드는 python3 -c 로 만듭니다 — 사유 문장에 따옴표·개행·
            # 이모지가 섞여도 셸에서 깨지지 않게 안전하게 이스케이프하기 위함
            # (watch_schedule_health.yml · test_suite.yml 과 같은 방식).
            PAYLOAD=$(python3 -c '
          import json, sys
          print(json.dumps({"content": sys.argv[1]}))
          ' "$MSG")
            curl -s -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK_URL" >/dev/null \
              && echo "✅ 디스코드 알림 전송됨" \
              || echo "⚠️ 디스코드 알림 전송 실패(Actions 탭의 빨간 X는 이미 남으니 계속 진행)"
          else
            echo "ℹ️ DISCORD_WEBHOOK_URL 시크릿이 없어 디스코드 알림을 건너뜁니다(선택 사항)."
          fi

          echo "::error::수집 결과 산티체크에서 의심 항목이 나와 이 잡을 실패 처리합니다(Actions 탭에서 바로 보이도록)."
          exit 1

# .github/workflows/backfill_dividend_payment_events_2026_08.yml
# =============================================================================
# 🧹 (임시·일회성) 배당 지급일정 백필 — 2026년 8월 1일 ~ 실행 전날
#
#   왜 필요했는가:
#     watch_dividend_payment_events.yml 의 수집기는 "한 번 지나간 날짜는 다시 안 훑는"
#     구조입니다(상태 파일 data/cache/dividend_kr_2026_payment_state.json 의
#     last_checked_de 기준 증분 확인). 그래서 **첫 프로덕션 실행의 lookback 창보다 앞서
#     접수된 공시는 영영 들어오지 않습니다.**
#       · 실제 사례: 2026-08-20 롯데케미칼 "현금ㆍ현물배당결정"
#         (rcept_no=20260820800655, 기준일 2026-09-03 / 지급예정일 2026-09-18).
#         첫 실행이 2026-08-25경이었고 기본 lookback 이 3일이라 훑은 구간이 대략
#         08-22~08-24 — 08-20 은 그 창보다 앞이라 누락됐고, **오너가 DART 화면을 보고
#         직접 발견**했습니다.
#     이 워크플로우는 그 구멍을 **한 번** 메우기 위한 것입니다.
#
#   무엇을 하는가:
#     collector_dividend_payment_kr.py 를 백필 모드(--bgn-de/--end-de)로 한 번 돌립니다.
#     조회·중복방지·저장 본체는 매일 도는 감시 모드와 **완전히 같은 코드**입니다:
#       · 이미 파일에 있는 rcept_no 는 원문(document.xml)을 **다시 받지 않습니다**(§0-3-2).
#         → 백필 구간이 이미 수집된 날짜와 겹쳐도 DART 에 헛요청이 가지 않습니다.
#       · 산출물은 append-only. 기존 레코드를 고치거나 지우지 않습니다.
#
#   🔴 정기 실행(watch_dividend_payment_events.yml)을 깨지 않는 이유 — 이게 핵심입니다:
#     백필은 상태 파일의 last_checked_de 를
#         max(기존 값, 이번 백필이 실제로 확인을 끝낸 날)
#     로만 갱신합니다. **절대 뒤로 되돌리지 않습니다.** (예: 상태가 이미 08-24 인데
#     08-01~08-19 를 백필해도 상태 파일은 여전히 08-24 로 남습니다.) 되돌아가면 다음
#     정기 실행이 이미 확인한 구간을 DART 에 다시 요청하게 됩니다(§0-3-2 위반).
#     이 규칙은 tests/test_dividend_payment_collector.py 의
#     `test_backfill_never_moves_the_state_file_backwards` 가 지키고 있습니다.
#
#   ⚠️ 종료일은 **하드코딩하지 않습니다.** 언제 실행될지 모르므로 아래 스텝에서
#      "KST 기준 어제"를 그때그때 계산합니다(오늘은 아직 하루가 안 끝나 접수가 더 들어올
#      수 있어 '확인 끝'으로 적으면 안 됩니다 — 수집기도 오늘 이후 날짜를 받으면 거부합니다).
#
#   실행 방법:
#     Actions 탭 → 이 워크플로우 → "Run workflow" (수동 1회). 스케줄은 일부러 없습니다.
#
#   ✅ 실행이 성공하고 산출물 커밋을 확인했으면 **이 파일은 지워도 됩니다.**
#      "확인 끝난 일회성 스크립트·워크플로우를 남겨두지 않는다"가 이 프로젝트의 관례입니다
#      (probe_dart_disclosure_document.yml 전례). 수집기 쪽 백필 모드(--bgn-de/--end-de)는
#      같은 사고가 또 났을 때 쓸 수 있으니 그대로 둡니다.
#
#   비밀키:
#     DART_API_KEY (기존 배당 워크플로우들과 같은 시크릿). 코드·이 파일 어디에도
#     하드코딩돼 있지 않습니다.
# =============================================================================

name: (임시) 배당 지급일정 백필 2026-08

on:
  # 스케줄 없음 — 손으로 한 번만 돌립니다.
  workflow_dispatch: {}

# 산출물(data/dividend_kr_2026_payment_events*, data/cache/*)을 커밋해야 하므로 쓰기 권한.
permissions:
  contents: write

# 🔴 watch_dividend_payment_events.yml / collect_dividend_kr.yml /
#    watch_dividend_disclosures.yml 과 **글자 하나까지 같은 그룹 이름**입니다.
#    네 워크플로우가 모두 data/ 에 커밋하므로, 같은 그룹으로 묶어야 GitHub 이 줄을 세워
#    주고 동시 실행으로 인한 git push 충돌(그리고 같은 산출물에 대한 동시 쓰기)이
#    생기지 않습니다. 이름이 다르면 백필이 정기 수집과 같은 파일을 동시에 건드립니다.
concurrency:
  group: dividend-kr-collector
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    # 8월 한 달치(대략 3~4주) 구간이라 배당결정이 정기 실행보다 많이 잡힐 수 있습니다.
    # 건당 2~3초 딜레이(§0-3-2)를 감안해 정기 실행과 같은 상한을 둡니다.
    timeout-minutes: 120

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        # watch_dividend_payment_events.yml 과 같은 방식입니다(이 수집기가 실제로 쓰는
        # 외부 패키지는 requests 하나뿐 — 나머지는 표준 라이브러리).
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "⚠️ requirements.txt 가 없습니다 — 이 수집기가 쓰는 requests 만 설치합니다."
            pip install requests
          fi

      - name: 백필 구간 계산 (KST 기준 어제까지)
        # ⚠️ 날짜를 하드코딩하지 않습니다. 러너 시계는 UTC 라 TZ 를 KST 로 고정해
        #    수집기의 기준(_now_kst)과 같은 "어제"를 구합니다.
        #    계산에 실패하면 빈 값으로 조용히 넘어가지 않고 여기서 멈춥니다(§0-1).
        run: |
          END_DE="$(TZ=Asia/Seoul date -d 'yesterday' +%Y%m%d)"
          case "$END_DE" in
            [0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]) ;;
            *) echo "❌ 어제 날짜(KST)를 YYYYMMDD 로 계산하지 못했습니다: '$END_DE'"; exit 1 ;;
          esac
          echo "END_DE=$END_DE" >> "$GITHUB_ENV"
          echo "백필 구간: 20260801 ~ $END_DE (접수일 기준, KST)"

      - name: 배당 지급일정 백필 실행
        env:
          # 🔴 저장소 Settings → Secrets and variables → Actions 에 등록된 값.
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          # 위 스텝이 계산한 값. 외부 입력(workflow_dispatch inputs)은 받지 않으므로
          # 셸에 끼어들 사용자 문자열이 없습니다(§0-3-9).
          END_DE: ${{ env.END_DE }}
        run: |
          python collector_dividend_payment_kr.py \
            --year 2026 \
            --out-dir data \
            --cache-dir data/cache \
            --bgn-de 20260801 \
            --end-de "$END_DE"

      - name: 산출물 커밋
        # ⚠️ `if: always()` 를 **일부러 넣지 않습니다**(정기 워크플로우와 같은 이유).
        #    원문 조회가 한 건이라도 실패하면 스크립트가 종료코드 2로 끝나고 이 스텝은
        #    건너뛰어져 **아무것도 커밋되지 않습니다.** 어중간한 산출물이 커밋되지 않아야
        #    다음 실행이 같은 구간을 다시 확인할 수 있습니다(이미 받아 둔 rcept_no 는
        #    그때도 다시 받지 않습니다).
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # ⚠️ 정기 워크플로우와 **똑같은 파일 3개만** 명시적으로 add 합니다.
          #    (`git add data/` 로 뭉뚱그리면 다른 모듈의 산출물이 이 커밋에 끌려옵니다.)
          for f in \
            data/dividend_kr_2026_payment_events.json \
            data/dividend_kr_2026_payment_events_raw.jsonl \
            data/cache/dividend_kr_2026_payment_state.json \
          ; do
            if [ -f "$f" ]; then
              git add "$f"
            fi
          done

          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋하지 않습니다(백필 구간에 새 배당결정 공시가 없었고,"
            echo "상태 파일도 되돌릴 필요가 없었다면 정상입니다)."
            exit 0
          fi

          git commit -m "chore(dividend): 배당 지급일정 2026-08 구간 일회성 백필 [skip ci]"

          # 다른 워크플로우도 같은 data/ 폴더를 커밋하므로 push 가 거절될 수 있습니다.
          # 기존 워크플로우들과 같은 재시도 패턴.
          for attempt in 1 2 3; do
            if git push; then
              echo "push 성공 (시도 $attempt)"
              exit 0
            fi
            echo "push 거절 — fetch 후 rebase 재시도 ($attempt/3)"
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}" || exit 1
          done
          echo "❌ 3회 시도 후에도 push 하지 못했습니다."
          exit 1
